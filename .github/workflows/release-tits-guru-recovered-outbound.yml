name: Release recovered tits.guru outbound mail

# After a clean-host recovery of tits-guru, the replacement machine holds every
# message tits-guru sends — its listener accepts and HOLDS it, with no direct
# route at all — from before its mail gateway was installed. This workflow is
# the one way that hold is released:
# infrastructure/scripts/release-recovered-outbound, run from trusted main
# tooling, against the machine the deployment binding now points at.
#
# It belongs to the end of adopting a recovered machine, never to the
# recovery itself: run it once the traffic and the deployment binding have
# moved to the recovered machine and its DNS — the A record of the MTA
# hostname, the PTR of its address, SPF — names it. Until then its proof
# refuses and nothing changes.
#
#   mode=check   read-only: every condition, and whether apply would release
#   mode=apply   the release itself, behind the full proof, through the mail
#                gateway's one-use authorization, with a return to held on any
#                failure; an already released, ready machine is a no-op
#   mode=verify  read-only, after the release: released, and OUTBOUND READY
#
# The operator names the recovery operation the machine was restored by (from
# the recovery's run summary) and the IPv4 address it sends from, and an apply
# requires the confirmation `release tits-guru outbound mail on <address>`,
# typed exactly. The server-side proof requires a completed recovery
# (recover-host --verify), the hold bound to exactly that operation, the
# gateway exactly held, public DNS naming exactly that address as two
# independent resolvers both answer it (A, PTR and its forward confirmation,
# SPF, the DKIM record of the installed key, DMARC), and a running signer.
#
# It changes no DNS record, no deployment binding, no Nginx site, no
# environment file and no offsite-write hold, and it never releases a message
# from the HOLD queue: mail the application sent while it was held stays held,
# and what becomes of it is a separate, explicit decision. The target, the
# trusted ref and the GitHub Environment are fixed.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check (read-only), apply (the release), or verify (read-only, after it)"
        required: true
        type: choice
        options:
          - check
          - apply
          - verify
        default: check
      operation:
        description: "The recovery operation that restored the machine (YYYYMMDD-HHMMSS-xxxxxx), from the recovery's summary. Not for verify."
        required: false
        default: ""
      address:
        description: "The IPv4 address the recovered machine sends from. Not for verify."
        required: false
        default: ""
      confirm:
        description: "apply only — type exactly: release tits-guru outbound mail on <address>"
        required: false
        default: ""

permissions:
  contents: read

# tits-guru shares its physical host with staging today, so this must never run
# halfway through a mutation of either target, nor while another production
# mail or verification operation reads that machine. This is the domain every
# operation on that machine uses for the same reason; it waits rather than
# cancelling anything. On the host, release-recovered-outbound holds the host's
# own infrastructure lock for the whole of an apply.
concurrency:
  group: rateguru-staging-deployment
  cancel-in-progress: false

jobs:
  # --- main-only control-plane gate (begin) ---
  #
  # Fail-closed, and deliberately a job of its own with NO `environment:`.
  #
  # The production-tits-guru Environment permits `main` and `v*`. `v*` has to be
  # there, because Release to production runs with `github.ref` at the tag — but
  # GitHub matches an Environment's allowlist against the ref of the RUN, and a
  # workflow_dispatch ref may be a tag as well as a branch. So the allowlist
  # alone would also admit a manual dispatch of THIS workflow from a tag, and
  # the workflow definition that then ran would be the one at that tag.
  #
  # A manual production operation is a main-only operation, so anything else is
  # refused here, before a single production job starts. Because this job holds
  # no Environment, a refused run never has those credentials available to it at
  # all — the job that owns them never begins.
  #
  # WHAT THIS IS NOT. It guards against accidental and casual misuse: a tag
  # selected in the Run workflow dropdown, or the habit of dispatching from
  # develop, neither of which can reach a production job any more.
  # It is NOT a boundary against someone who can already create an arbitrary
  # trusted tag, because they would author this very file at that tag. Who may
  # create `v*` is a GitHub tag ruleset, which is a separate permission boundary
  # and the one that actually bounds that case. See
  # infrastructure/runbooks/deployment-targets.md.
  validate-ref:
    name: Refuse any ref but main
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require refs/heads/main
        shell: bash
        env:
          RUN_REF: ${{ github.ref }}
        run: |
          set -Eeuo pipefail

          if [[ "${RUN_REF}" != "refs/heads/main" ]]; then
            echo "A manual production operation runs from main and nowhere else." >&2
            echo "Dispatched ref: ${RUN_REF}" >&2
            echo "Re-run with main selected. New application code reaches production only through Release to production, from a v* tag." >&2
            exit 1
          fi

          echo "Control plane: ${RUN_REF}"
  # --- main-only control-plane gate (end) ---
  validate-request:
    name: Validate the release request
    runs-on: ubuntu-24.04

    needs: [validate-ref]
    timeout-minutes: 5

    steps:
      # The request alone, before any credential exists in the run: a mode from
      # the closed set, an exact recovery operation and IPv4 address where the
      # mode takes them, and — for an apply — the operator's confirmation,
      # typed exactly for the address being released.
      - name: Require exact inputs and the operator's confirmation
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          OPERATION: ${{ inputs.operation }}
          ADDRESS: ${{ inputs.address }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -Eeuo pipefail

          case "${MODE}" in
            check|apply|verify) ;;
            *)
              echo "Invalid mode: ${MODE} (expected check, apply or verify)" >&2
              exit 1
              ;;
          esac

          if [[ "${MODE}" == verify ]]; then
            if [[ -n "${OPERATION:-}" || -n "${ADDRESS:-}" ]]; then
              echo "verify takes no operation and no address: it reads both from the released hold." >&2
              exit 1
            fi
          else
            [[ "${OPERATION:-}" =~ ^[0-9]{8}-[0-9]{6}-[0-9a-f]{6}$ ]] || {
              echo "operation must be the exact recovery operation that restored the machine (YYYYMMDD-HHMMSS-xxxxxx, from the recovery's summary), not: ${OPERATION:-<empty>}" >&2
              exit 1
            }
            [[ "${ADDRESS:-}" =~ ^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$ ]] || {
              echo "address must be the IPv4 address the recovered machine sends from, not: ${ADDRESS:-<empty>}" >&2
              exit 1
            }
          fi

          if [[ "${MODE}" == apply ]]; then
            expected="release tits-guru outbound mail on ${ADDRESS}"

            if [[ "${CONFIRM:-}" != "${expected}" ]]; then
              echo "An apply releases tits-guru's outbound mail, and needs the operator's explicit confirmation." >&2
              echo "Type exactly: ${expected}" >&2
              exit 1
            fi
          elif [[ -n "${CONFIRM:-}" ]]; then
            echo "confirm belongs to an apply alone; a ${MODE} changes nothing and takes none." >&2
            exit 1
          fi

          {
            echo "## tits-guru recovered outbound mail — request"
            echo
            echo "| Input | Value |"
            echo "| --- | --- |"
            echo "| Mode | ${MODE} |"
            echo "| Recovery operation | ${OPERATION:-—} |"
            echo "| Sending address | ${ADDRESS:-—} |"
            echo "| Confirmed | $([[ "${MODE}" == apply ]] && echo yes || echo "not required") |"
          } >> "${GITHUB_STEP_SUMMARY}"

  release:
    name: Release tits-guru's recovered outbound mail
    runs-on: ubuntu-24.04

    needs: [validate-ref, validate-request]

    # The GitHub Environment holding this target's own credentials. Only this
    # job, downstream of the main-only gate and the validated request, ever
    # receives them.
    environment: production-tits-guru
    timeout-minutes: 30

    steps:
      # Operational tooling always comes from main, the production control
      # plane.
      - name: Checkout trusted tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Release on the recovered machine
        id: release
        uses: ./.github/actions/release-rateguru-recovered-outbound
        with:
          operation: ${{ inputs.mode }}
          deployment-target: tits-guru
          recovery-operation: ${{ inputs.operation }}
          sending-address: ${{ inputs.address }}

          # The machine the deployment binding points at: the recovered one,
          # once it has been adopted. Before that, the proof refuses.
          bootstrap-host: ${{ vars.DEPLOY_HOST }}
          bootstrap-port: ${{ vars.DEPLOY_PORT }}

          # The privileged bootstrap credential: the gateway, the signer, the
          # hold and the queue are root's. Never the deploy key.
          bootstrap-user: ${{ vars.BOOTSTRAP_USER }}
          bootstrap-ssh-key: ${{ secrets.BOOTSTRAP_SSH_KEY }}
          bootstrap-known-hosts: ${{ secrets.BOOTSTRAP_KNOWN_HOSTS }}

      # The action writes the result of every completed run. A run that
      # produced no result at all says so here, rather than leaving an empty
      # summary that could be read as nothing wrong.
      - name: Report an incomplete release
        if: ${{ always() && steps.release.outputs.status == '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          {
            echo "## tits-guru recovered outbound mail"
            echo
            echo "The run did not complete, so there is no result. If an apply had begun the release, any failure returns the machine to held on its own; the reason is in the job log. Run this workflow with mode=check before anything else."
          } >> "${GITHUB_STEP_SUMMARY}"
