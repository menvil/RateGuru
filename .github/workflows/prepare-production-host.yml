name: Prepare tits.guru host

# The production counterpart of prepare-staging-host.yml. Same operator
# semantics, same shared implementation, different fixed identity — an operator
# picks the workflow that names their environment rather than selecting a target
# from a dropdown.
#
# tits-guru is lifecycle=active: its activation was a reviewed registry change,
# and this workflow is how that change reaches the host. Run from main after
# the change is there, it installs the runtime registry that says so, the
# target-aware operations, the deploy user's sudo grant and the backup cron, and
# verifies the target's PHP-FPM pool, Supervisor program, scheduler and internal
# Nginx site — every one of them by the same mechanism staging is prepared with.
# infrastructure/scripts/prepare-host still refuses any target that is not
# lifecycle=active, BEFORE any target-specific mutation.
#
# What it does not do: deploy, migrate, create a release, open the public site,
# or touch the existing environment file, database password, DKIM key,
# certificates or SSH keys — existing material is never overwritten, and an
# absent PREPARE_* secret is simply not supplied. Nothing here edits the
# registry, and the production-tits-guru GitHub Environment's own protection
# rules stay authoritative.
on:
  workflow_dispatch:

permissions:
  contents: read

# The same logical domain every other production target mutation uses:
# preparation must never overlap a production release or a production rollback.
concurrency:
  group: rateguru-production-release
  cancel-in-progress: false

jobs:
  # --- main-only control-plane gate (begin) ---
  #
  # Fail-closed, and deliberately a job of its own with NO `environment:`.
  #
  # The production-tits-guru Environment permits `main` and `v*`. `v*` has to be
  # there, because Release to production runs with `github.ref` at the tag — but
  # GitHub matches an Environment's allowlist against the ref of the RUN, and a
  # workflow_dispatch ref may be a tag as well as a branch. So the allowlist
  # alone would also admit a manual dispatch of THIS workflow from a tag, and
  # the workflow definition that then ran would be the one at that tag.
  #
  # A manual production operation is a main-only operation, so anything else is
  # refused here, before a single production job starts. Because this job holds
  # no Environment, a refused run never has those credentials available to it at
  # all — the job that owns them never begins.
  #
  # WHAT THIS IS NOT. It guards against accidental and casual misuse: a tag
  # selected in the Run workflow dropdown, or the habit of dispatching from
  # develop, neither of which can reach a production job any more.
  # It is NOT a boundary against someone who can already create an arbitrary
  # trusted tag, because they would author this very file at that tag. Who may
  # create `v*` is a GitHub tag ruleset, which is a separate permission boundary
  # and the one that actually bounds that case. See
  # infrastructure/runbooks/deployment-targets.md.
  validate-ref:
    name: Refuse any ref but main
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require refs/heads/main
        shell: bash
        env:
          RUN_REF: ${{ github.ref }}
        run: |
          set -Eeuo pipefail

          if [[ "${RUN_REF}" != "refs/heads/main" ]]; then
            echo "A manual production operation runs from main and nowhere else." >&2
            echo "Dispatched ref: ${RUN_REF}" >&2
            echo "Re-run with main selected. New application code reaches production only through Release to production, from a v* tag." >&2
            exit 1
          fi

          echo "Control plane: ${RUN_REF}"
  # --- main-only control-plane gate (end) ---
  prepare:
    name: Prepare the tits-guru host
    runs-on: ubuntu-24.04

    needs: [validate-ref]
    environment: production-tits-guru
    timeout-minutes: 45

    steps:
      - name: Checkout trusted bootstrap tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      # Pinned to the real production target ID: the server's lifecycle gate
      # decides whether it may be prepared. Routing production preparation at
      # staging-main would prepare the wrong target.
      - name: Prepare tits-guru
        uses: ./.github/actions/prepare-rateguru-host
        with:
          deployment-target: tits-guru
          environment: production

          bootstrap-host: ${{ vars.DEPLOY_HOST }}
          bootstrap-port: ${{ vars.DEPLOY_PORT }}

          bootstrap-user: ${{ vars.BOOTSTRAP_USER }}
          bootstrap-ssh-key: ${{ secrets.BOOTSTRAP_SSH_KEY }}
          bootstrap-known-hosts: ${{ secrets.BOOTSTRAP_KNOWN_HOSTS }}

          laravel-env: ${{ secrets.PREPARE_LARAVEL_ENV }}
          deploy-authorized-keys: ${{ secrets.PREPARE_DEPLOY_AUTHORIZED_KEYS }}
          rclone-config: ${{ secrets.PREPARE_RCLONE_CONFIG }}
          basic-auth: ${{ secrets.PREPARE_BASIC_AUTH }}
          tls-certificate: ${{ secrets.PREPARE_TLS_CERTIFICATE }}
          tls-private-key: ${{ secrets.PREPARE_TLS_PRIVATE_KEY }}
          tls-dhparams: ${{ secrets.PREPARE_TLS_DHPARAMS }}
          nginx-tls-options: ${{ secrets.PREPARE_NGINX_TLS_OPTIONS }}
          mail-tls-certificate: ${{ secrets.PREPARE_MAIL_TLS_CERTIFICATE }}
          mail-tls-private-key: ${{ secrets.PREPARE_MAIL_TLS_PRIVATE_KEY }}
