name: Recover staging host

# Manual-only: rebuilding a target onto a replacement machine is an operator
# decision, never an automatic reaction to anything. The target is fixed to
# staging-main by this workflow — an operator names WHICH replacement machine
# and WHICH backup, never WHICH target. There is deliberately no target
# dropdown anywhere in this repository: "Recover staging host" and "Recover
# production host" are two buttons whose names say what they do, sharing one
# implementation underneath.
#
# This workflow is policy and orchestration only. Every mechanism it uses
# already exists and is used unchanged:
#
#   .github/actions/prepare-rateguru-host       the one host-preparation transport
#   .github/actions/recover-rateguru-host       the one recovery transport
#   .github/actions/build-rateguru              the one build implementation
#   .github/actions/deploy-rateguru             the one deployment transport
#   .github/actions/record-rateguru-deployment  the one observability marker
#
# and every decision that touches the host is made by the server-side
# prepare-host and recover-host, never here.
#
# THE PIPELINE.
#
#   a replacement machine
#     -> Prepare Host                  (infrastructure, no application)
#     -> recover-host --apply          (one exact offsite backup; host held)
#     -> the server names the commit   (read from the backup's release.json)
#     -> historical build of THAT commit
#     -> controlled recovery deployment, migrations forbidden, host still held
#     -> recover-host --resume         (the only thing that ends a hold)
#     -> recover-host --verify         (independent final contract)
#     -> deployment marker
#
# WHAT IS AN OPERATOR INPUT, AND WHY.
#
# The replacement host is. A recovery exists precisely because the machine the
# GitHub Environment names is gone, so the physical machine cannot come from
# the environment — it is the one thing about this operation that is not
# already known. Nothing else is: not the target, not the environment class,
# not the credentials, not the paths, and above all not the commit. The commit
# is read on the SERVER out of the backup's own release.json and flows
# backup -> server -> action output -> checkout, without ever passing through
# a person's hands.
#
# WHAT THIS DOES NOT DO. It does not change DNS, does not update DEPLOY_HOST,
# does not touch the machine that target is currently bound to, does not
# activate a target, and does not make the replacement host public. A recovery
# rehearsal runs against a disposable machine and leaves the long-lived staging
# host exactly as it found it; repointing the world at a recovered machine is a
# separate question, and only the recovery itself is here.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: start a new recovery, or continue one already held on the replacement host
        required: true
        default: new
        type: choice
        options:
          - new
          - continue

      backup:
        description: Exact offsite backup timestamp YYYYMMDD-HHMMSS (required when mode=start, must be empty otherwise)
        required: false
        default: ""
        type: string

      operation:
        description: Recovery operation ID (required when mode=continue-held, must be empty otherwise)
        required: false
        default: ""
        type: string

      recovery-host:
        description: Hostname or IPv4 address of the REPLACEMENT machine (never the host this target is bound to now)
        required: true
        default: ""
        type: string

      confirmation:
        description: Type exactly "RECOVER staging-main" to confirm rebuilding this target onto a replacement machine
        required: true
        default: ""
        type: string

      # Rehearsal only, and named so it cannot be mistaken for anything else.
      # A real recovery never wants it: it stops one step short of a serving
      # host, deliberately, so a disposable-host rehearsal can prove that a
      # recovery survives losing its runner between the controlled deployment
      # and the resume. There is no counterpart on the production workflow.
      pause-after-controlled-deploy:
        description: "REHEARSAL ONLY: stop after the controlled deployment, leaving the recovery held at ready-to-resume"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# The WHOLE workflow, not just its first job. Prepare -> recover -> build ->
# controlled deploy -> resume -> verify is ONE logical mutation of one target:
# an ordinary staging deploy, rollback, Restore or Repair slipping in between
# two of its jobs would act on a target whose runtime is deliberately held and
# cannot object. Same group as deploy-staging.yml, rollback-staging.yml,
# restore-staging.yml and repair-staging.yml, so none of them can run alongside
# it. cancel-in-progress stays false: a cancelled recovery is not a stopped
# recovery, and the server-side locks and the recovery guard remain the
# ultimate integrity protection regardless.
concurrency:
  group: rateguru-staging-deployment
  cancel-in-progress: false

jobs:
  # No GitHub Environment and no secret: request policy and the target's
  # lifecycle are decided before the environment's own protection rules are
  # ever consulted, so a malformed request never becomes an approval request
  # and never reaches a credential.
  validate:
    name: Validate recovery request
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    outputs:
      mode: ${{ steps.request.outputs.mode }}
      backup: ${{ steps.request.outputs.backup }}
      operation: ${{ steps.request.outputs.operation }}
      recovery_host: ${{ steps.request.outputs.recovery_host }}
      pause_after_controlled_deploy: ${{ steps.request.outputs.pause_after_controlled_deploy }}

    steps:
      # Deliberately first, and deliberately without a checkout: a malformed
      # request is refused before this runner has fetched anything at all.
      - name: Validate the recovery request
        id: request
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          BACKUP: ${{ inputs.backup }}
          OPERATION: ${{ inputs.operation }}
          REPLACEMENT_HOST: ${{ inputs['recovery-host'] }}
          CONFIRMATION: ${{ inputs.confirmation }}
          PAUSE_AFTER_CONTROLLED_DEPLOY: ${{ inputs['pause-after-controlled-deploy'] }}
        run: |
          set -Eeuo pipefail

          # First, and in a job that holds no GitHub Environment: an
          # unconfirmed recovery ends here, before the environment's own
          # protection rules are consulted, before a secret is loaded and long
          # before any connection is opened to anything.
          if [[ "${CONFIRMATION}" != "RECOVER staging-main" ]]; then
            echo "confirmation must be exactly 'RECOVER staging-main' to rebuild this target onto a replacement machine" >&2
            exit 1
          fi

          # Whitespace is stripped before anything is judged: a pasted backup
          # ID, operation ID or address routinely arrives with a trailing
          # space, and "looks empty but is not" is exactly the confusion these
          # rules are here to remove.
          backup="$(printf '%s' "${BACKUP}" | tr -d '[:space:]')"
          operation="$(printf '%s' "${OPERATION}" | tr -d '[:space:]')"
          replacement_host="$(printf '%s' "${REPLACEMENT_HOST}" | tr -d '[:space:]')"

          case "${MODE}" in
            new)
              # An exact backup, always. There is no "latest" anywhere in this
              # pipeline: a recovery names the data it rebuilds a host from.
              if [[ ! "${backup}" =~ ^[0-9]{8}-[0-9]{6}$ ]]; then
                echo "mode=new requires an exact offsite backup timestamp YYYYMMDD-HHMMSS (got: ${BACKUP})" >&2
                exit 1
              fi

              if [[ -n "${operation}" ]]; then
                echo "mode=new must not name an operation: a new recovery generates its own operation ID on the server. To continue a recovery that is already held on the replacement host, use mode=continue" >&2
                exit 1
              fi
              ;;
            continue)
              if [[ ! "${operation}" =~ ^[0-9]{8}-[0-9]{6}-[0-9a-f]{6}$ ]]; then
                echo "mode=continue requires the recovery operation ID to continue (got: ${OPERATION})" >&2
                exit 1
              fi

              # Refusing a backup here is the point of the mode. A replacement
              # host that is held already HAS recovered data, from a backup its
              # own persisted state names; starting a second recovery on top of
              # it would replace that data — and the code being built would
              # then be for the wrong commit. The server refuses it too.
              if [[ -n "${backup}" ]]; then
                echo "mode=continue must not name a backup: the held operation's own state records which backup it recovered, and a new recovery must never be started over a held one" >&2
                exit 1
              fi
              ;;
            *)
              echo "mode must be new or continue" >&2
              exit 1
              ;;
          esac

          # A boolean input still arrives as a string, and anything but the two
          # values GitHub produces would be a bug in this workflow rather than
          # an operator mistake.
          case "${PAUSE_AFTER_CONTROLLED_DEPLOY}" in
            true|false)
              ;;
            *)
              echo "pause-after-controlled-deploy must be true or false (got: ${PAUSE_AFTER_CONTROLLED_DEPLOY})" >&2
              exit 1
              ;;
          esac

          if [[ -z "${replacement_host}" ]]; then
            echo "recovery-host is required: a recovery rebuilds a target onto a named machine, and there is no default" >&2
            exit 1
          fi

          if (( ${#replacement_host} > 253 )); then
            echo "recovery-host is longer than a DNS name may be (253 characters)" >&2
            exit 1
          fi

          # The address is DATA, never shell syntax. One closed character class
          # of DNS labels rejects whitespace, control characters, every shell
          # metacharacter, a leading "-", "user@host", ":port" suffixes, paths
          # and SSH option syntax in a single expression — an ordinary
          # hostname and an IPv4 address are both sequences of such labels, and
          # nothing else is accepted.
          host_label='[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?'

          if [[ ! "${replacement_host}" =~ ^${host_label}(\.${host_label})*$ ]]; then
            echo "recovery-host must be a DNS hostname or an IPv4 address (got: ${REPLACEMENT_HOST})" >&2
            exit 1
          fi

          # An all-numeric name is an address, and an address that is out of
          # range is a typo rather than a hostname. Checked separately so the
          # diagnostic says which of the two the operator got wrong.
          if [[ "${replacement_host}" =~ ^[0-9.]+$ ]]; then
            if [[ ! "${replacement_host}" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
              echo "recovery-host looks like an address but is not a valid IPv4 address: ${REPLACEMENT_HOST}" >&2
              exit 1
            fi

            IFS='.' read -r -a octets <<<"${replacement_host}"

            for octet in "${octets[@]}"; do
              # 10# forces decimal: Bash reads a leading-zero operand inside
              # (( )) as octal, so 010 would be 8 and 08 would raise an error
              # this || chain would read as "the condition did not hold".
              if (( 10#${octet} > 255 )); then
                echo "recovery-host is not a valid IPv4 address: ${REPLACEMENT_HOST}" >&2
                exit 1
              fi
            done
          fi

          {
            echo "mode=${MODE}"
            echo "backup=${backup}"
            echo "operation=${operation}"
            echo "recovery_host=${replacement_host}"
            echo "pause_after_controlled_deploy=${PAUSE_AFTER_CONTROLLED_DEPLOY}"
          } >> "${GITHUB_OUTPUT}"

          echo "Mode: ${MODE}"
          echo "Backup: ${backup:-n/a}"
          echo "Operation: ${operation:-n/a}"
          echo "Replacement host: ${replacement_host}"
          echo "Rehearsal hold after the controlled deployment: ${PAUSE_AFTER_CONTROLLED_DEPLOY}"

      # Trusted develop, purely so the lifecycle question below can be asked of
      # this repository's own registry rather than of a rule copied into YAML.
      - name: Checkout the trusted target registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          fetch-depth: 1
          persist-credentials: false

      # The same question the recovery action and the server-side primitives
      # ask, asked here first for one reason: in a job that holds no GitHub
      # Environment, so a recovery of a target that must not exist yet is
      # refused before an environment is entered, before a secret is loaded and
      # long before a connection is opened to anything.
      - name: Refuse a recovery of a target that is not active
        shell: bash
        env:
          DEPLOYMENT_TARGET: staging-main
        run: |
          set -Eeuo pipefail

          registry="${GITHUB_WORKSPACE}/infrastructure/config/deployment-targets.json"
          targets_cli="${GITHUB_WORKSPACE}/infrastructure/scripts/targets"

          test -x "${targets_cli}"
          test -f "${registry}"

          if ! target_json="$("${targets_cli}" show --target "${DEPLOYMENT_TARGET}" --file "${registry}" 2>&1)"; then
            echo "${target_json}" >&2
            echo "Unknown or unusable deployment target: ${DEPLOYMENT_TARGET}" >&2
            exit 1
          fi

          lifecycle="$(printf '%s' "${target_json}" | jq -r '.lifecycle // empty')"

          if [[ "${lifecycle}" != "active" ]]; then
            echo "Target ${DEPLOYMENT_TARGET} has lifecycle=${lifecycle:-unknown}, not active." >&2
            echo "Recovery is refused before any GitHub Environment is entered. A recovery rebuilds a target that is already live somewhere; activating a target is a deliberate registry change in its own right, never a side effect of recovering a host." >&2
            exit 1
          fi

          echo "Target ${DEPLOYMENT_TARGET}: lifecycle=active — recovery may proceed"

  # The one place vars.DEPLOY_HOST is read, and it is read only to REFUSE.
  #
  # Recover Host is for a machine that is gone. Pointing it at the machine the
  # target is currently bound to would attack a live host with an operation
  # whose whole premise is that the host is empty — and the two operations that
  # DO belong to a live host already exist. The comparison needs the GitHub
  # Environment (that is where the binding lives), so it runs in its own job,
  # before Prepare Host, before the recovery credential is used and before
  # anything at all is uploaded anywhere.
  #
  # Nothing here updates the binding. The target stays bound to the machine it
  # is bound to for the whole of the recovery; repointing it is a separate,
  # deliberate act.
  binding:
    name: Confirm the replacement host is not the current host
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5

    steps:
      - name: Refuse a recovery onto the host this target is already bound to
        shell: bash
        env:
          REPLACEMENT_HOST: ${{ needs.validate.outputs.recovery_host }}
          CURRENT_HOST: ${{ vars.DEPLOY_HOST }}
          # Read to COMPARE, never to connect. No step in this job opens a
          # connection to anything, and neither value is ever printed.
          CURRENT_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REPLACEMENT_KNOWN_HOSTS: ${{ secrets.RECOVERY_BOOTSTRAP_KNOWN_HOSTS }}
          REPLACEMENT_DEPLOY_KNOWN_HOSTS: ${{ secrets.RECOVERY_DEPLOY_KNOWN_HOSTS }}
          RECOVERY_PORT: ${{ vars.RECOVERY_PORT }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${CURRENT_HOST}" ]]; then
            echo "The staging environment has no DEPLOY_HOST, so this run cannot prove the replacement machine is a different one." >&2
            echo "Recovery is refused: the proof that a recovery is not pointed at a live host must never be skipped because the binding is missing." >&2
            exit 1
          fi

          # DNS names are case-insensitive, so two spellings that differ only
          # in case name the same machine and must be refused as the same
          # machine.
          if [[ "${REPLACEMENT_HOST,,}" == "${CURRENT_HOST,,}" ]]; then
            echo "The replacement host is the host currently bound to this target." >&2
            echo "Recover Host is only for a lost/replacement machine. Use Restore or Repair for the existing host." >&2
            exit 1
          fi

          # The comparison above catches the common paste mistake and nothing
          # more: one machine answers to a name, an alias and an address, and
          # only one of those spellings is in DEPLOY_HOST.
          #
          # This second gate does not care how the machine is spelled, and it
          # has to exist HERE rather than be left to the server, because of
          # what runs next. The job after this one is Prepare Host, and Prepare
          # Host is convergent by design: it has no empty-host precondition, it
          # reconverges whatever it finds, and it is perfectly willing to act
          # on a target that is already serving. The prepared/EMPTY contract
          # that would refuse a live host belongs to `recover-host --apply`,
          # which runs a whole job LATER. So an alias that slips past a literal
          # string comparison reaches a mutating operation on the live machine
          # before anything checks whether that machine is empty.
          #
          # ONE CANONICAL IDENTITY, REQUIRED ON BOTH SIDES. Sharing a host key
          # proves one machine, but NOT sharing one proves nothing by itself:
          # an ordinary OpenSSH server offers several host keys, and two
          # secrets can easily hold different ones for the SAME machine —
          #
          #   DEPLOY_KNOWN_HOSTS     current.example.com ssh-ed25519 AAAA1111
          #   RECOVERY_BOOTSTRAP_KNOWN_HOSTS  203.0.113.10 ssh-rsa   AAAA2222
          #
          # — which is no overlap and one machine, and would have walked
          # straight into Prepare Host on the live host. So identity is pinned
          # to the one key type every supported host generates, it is required
          # on both sides, and a missing or ambiguous one is a refusal rather
          # than a pass. That makes the NEGATIVE answer decisive too: two
          # different canonical keys are two different machines.
          #
          # Direct host keys only. An @cert-authority or @revoked line names a
          # CA or a withdrawn key, never this machine's own identity, and
          # hostname fields are ignored throughout — they are exactly what
          # differs between two spellings of one machine.
          ed25519_identity() {
            awk '
              { sub(/\r$/, "") }
              /^[[:space:]]*($|#)/ { next }
              $1 ~ /^@/ { next }
              $2 == "ssh-ed25519" && $3 != "" { print $3 }
            ' | sort -u
          }

          current_identity="$(printf '%s\n' "${CURRENT_KNOWN_HOSTS}" | ed25519_identity)"
          replacement_identity="$(printf '%s\n' "${REPLACEMENT_KNOWN_HOSTS}" | ed25519_identity)"

          current_identity_count="$(grep -c . <<<"${current_identity}" || true)"
          replacement_identity_count="$(grep -c . <<<"${replacement_identity}" || true)"

          if (( current_identity_count != 1 )); then
            echo "DEPLOY_KNOWN_HOSTS does not carry exactly one direct ssh-ed25519 host key (found ${current_identity_count})." >&2
            echo "Recovery is refused. That key is the canonical machine identity this run compares, and without exactly one the replacement machine cannot be proven to be a different machine — while the next job, Prepare Host, would converge whatever answers at the address it is given." >&2
            echo "Record the bound host's own ssh-ed25519 entry, and only that host's." >&2
            exit 1
          fi

          if (( replacement_identity_count != 1 )); then
            echo "RECOVERY_BOOTSTRAP_KNOWN_HOSTS does not carry exactly one direct ssh-ed25519 host key (found ${replacement_identity_count})." >&2
            echo "Recovery is refused. That key is the canonical machine identity this run compares, and an RSA or ECDSA entry alone cannot answer whether this is the machine the target is already bound to." >&2
            echo "Record the replacement machine's own ssh-ed25519 entry, verified out of band." >&2
            exit 1
          fi

          if [[ "${current_identity}" == "${replacement_identity}" ]]; then
            echo "The replacement machine presents the same ssh-ed25519 host key as the machine currently bound to this target." >&2
            echo "That is one physical machine under two names. Recover Host is only for a lost/replacement machine, and the next job — Prepare Host — would converge this one: it has no empty-host precondition, and the prepared/EMPTY contract that refuses a live host does not run until a job later." >&2
            echo "Use Restore or Repair for the existing host." >&2
            exit 1
          fi

          # Belt and braces, and it can only ever refuse more. Two canonical
          # keys that differ are normally two machines — but they also differ
          # when one secret predates a host-key rotation, and there the machine
          # is the same and some OTHER key type still matches.
          any_key_blobs() {
            awk '
              { sub(/\r$/, "") }
              /^[[:space:]]*($|#)/ { next }
              $1 ~ /^@/ { next }
              { if ($2 != "" && $3 != "") { print $2 " " $3 } }
            ' | sort -u
          }

          shared_keys="$(
            comm -12 \
              <(printf '%s\n' "${CURRENT_KNOWN_HOSTS}" | any_key_blobs) \
              <(printf '%s\n' "${REPLACEMENT_KNOWN_HOSTS}" | any_key_blobs) \
              | grep -c . || true
          )"

          if (( shared_keys > 0 )); then
            echo "The replacement machine shares an SSH host key with the machine currently bound to this target, under a different key type than the canonical one." >&2
            echo "That is one physical machine whose recorded ssh-ed25519 keys disagree — most likely one of the two secrets predates a host-key rotation. Recovery is refused rather than guessing which is current." >&2
            exit 1
          fi

          # The bootstrap connection prepares and recovers the machine; the
          # restricted deploy connection installs code on it. They are separate
          # credentials by design, and nothing else checks that they describe
          # the SAME machine — so an operator who pastes one host's key into
          # RECOVERY_BOOTSTRAP_KNOWN_HOSTS and another's into
          # RECOVERY_DEPLOY_KNOWN_HOSTS would prepare one VPS and deploy to a
          # different one. Both must carry the same canonical identity.
          replacement_deploy_identity="$(printf '%s\n' "${REPLACEMENT_DEPLOY_KNOWN_HOSTS}" | ed25519_identity)"
          replacement_deploy_identity_count="$(grep -c . <<<"${replacement_deploy_identity}" || true)"

          if (( replacement_deploy_identity_count != 1 )); then
            echo "RECOVERY_DEPLOY_KNOWN_HOSTS does not carry exactly one direct ssh-ed25519 host key (found ${replacement_deploy_identity_count})." >&2
            echo "Recovery is refused: the controlled deployment verifies that material, and it must name the same machine this run is about to prepare." >&2
            exit 1
          fi

          if [[ "${replacement_deploy_identity}" != "${replacement_identity}" ]]; then
            echo "RECOVERY_BOOTSTRAP_KNOWN_HOSTS and RECOVERY_DEPLOY_KNOWN_HOSTS name two different machines." >&2
            echo "Recovery is refused rather than preparing one VPS and deploying the recovered code onto another." >&2
            exit 1
          fi

          # The replacement machine's SSH port is an environment binding, not
          # an operator input, so it is validated once here rather than failing
          # later inside every connection with a less obvious diagnostic.
          if [[ ! "${RECOVERY_PORT}" =~ ^[0-9]{1,5}$ ]] \
            || (( 10#${RECOVERY_PORT} < 1 )) \
            || (( 10#${RECOVERY_PORT} > 65535 ))
          then
            echo "RECOVERY_PORT must be configured for this environment as a port between 1 and 65535 (got: ${RECOVERY_PORT:-<unset>})" >&2
            exit 1
          fi

          echo "The replacement machine is not the machine staging-main is currently bound to: different name, and a different canonical ssh-ed25519 host key."
          echo "Its bootstrap and deploy known_hosts agree on one machine, and its SSH port is configured."
          echo "The current binding is left exactly as it is: recovery never edits DEPLOY_HOST, the target registry or DNS."

  # START ONLY. A recovery that is already held deliberately must not be
  # prepared again: preparation reconverges the target's Supervisor program and
  # its scheduler cron entry, which is exactly what a recovery holds aside, and
  # the server-side interlock refuses a Prepare against any guarded target.
  # Skipping the job is orchestration; the refusal on the host is the guarantee.
  prepare:
    name: Prepare the replacement host
    needs:
      - validate
      - binding
    if: ${{ needs.validate.outputs.mode == 'new' }}
    runs-on: ubuntu-latest
    environment: staging
    # A genuinely clean VPS installs the full base runtime before it does
    # anything else, which is by far the slowest step here.
    timeout-minutes: 45

    steps:
      - name: Checkout trusted bootstrap tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          fetch-depth: 1
          persist-credentials: false

      # The SAME preparation action the ordinary Prepare staging host workflow
      # uses. The only difference is the machine it is pointed at: an ordinary
      # preparation passes the target's registered DEPLOY_HOST, a recovery
      # passes the replacement machine. The action does not decide that
      # binding, and never has.
      - name: Prepare staging-main on the replacement machine
        uses: ./.github/actions/prepare-rateguru-host
        with:
          deployment-target: staging-main
          environment: staging

          bootstrap-host: ${{ needs.validate.outputs.recovery_host }}
          bootstrap-port: ${{ vars.RECOVERY_PORT }}

          # A replacement machine has its own privileged credential, separate
          # from the long-lived host's. The public half is installed by
          # whoever creates the machine — that first access is a provider
          # concern, outside RateGuru automation — and there is deliberately no
          # fallback to BOOTSTRAP_SSH_KEY or to the deployment key.
          bootstrap-user: ${{ vars.RECOVERY_BOOTSTRAP_USER }}
          bootstrap-ssh-key: ${{ secrets.RECOVERY_BOOTSTRAP_SSH_KEY }}
          bootstrap-known-hosts: ${{ secrets.RECOVERY_BOOTSTRAP_KNOWN_HOSTS }}

          # The target's own external material, unchanged. The environment file
          # in particular must be the one the backup was taken under: recovery
          # compares the prepared shared/.env byte-for-byte against the
          # backup's own copy and fails closed on a difference.
          laravel-env: ${{ secrets.PREPARE_LARAVEL_ENV }}
          deploy-authorized-keys: ${{ secrets.PREPARE_DEPLOY_AUTHORIZED_KEYS }}
          basic-auth: ${{ secrets.PREPARE_BASIC_AUTH }}
          tls-certificate: ${{ secrets.PREPARE_TLS_CERTIFICATE }}
          tls-private-key: ${{ secrets.PREPARE_TLS_PRIVATE_KEY }}
          tls-dhparams: ${{ secrets.PREPARE_TLS_DHPARAMS }}
          nginx-tls-options: ${{ secrets.PREPARE_NGINX_TLS_OPTIONS }}
          mail-tls-certificate: ${{ secrets.PREPARE_MAIL_TLS_CERTIFICATE }}
          mail-tls-private-key: ${{ secrets.PREPARE_MAIL_TLS_PRIVATE_KEY }}

          # The one deliberate exception, and the reason it is its own secret:
          # a replacement machine reads the offsite namespace it recovers from,
          # and during a rehearsal it must not be able to write to, prune or
          # otherwise alter the real backup namespace it is reading. There is
          # no silent fallback to PREPARE_RCLONE_CONFIG — that credential
          # belongs to the machine that OWNS the namespace.
          rclone-config: ${{ secrets.RECOVERY_RCLONE_CONFIG }}

  # The authoritative step. Everything after this branches on what the SERVER
  # reported, never on what the request asked for.
  recover:
    name: Recover staging-main onto the replacement host
    needs:
      - validate
      - binding
      - prepare
    # prepare is skipped on the continue-held path, and a skipped dependency
    # would otherwise skip this job too. The mode is re-checked rather than
    # accepting any skip: a prepare that was skipped on the START path would
    # mean the graph was rewired, not that preparation was unnecessary.
    if: >-
      ${{ !cancelled()
          && needs.validate.result == 'success'
          && needs.binding.result == 'success'
          && (needs.prepare.result == 'success'
              || (needs.prepare.result == 'skipped' && needs.validate.outputs.mode == 'continue')) }}
    runs-on: ubuntu-latest
    environment: staging
    # A real recovery downloads, fully verifies and stages a whole backup and
    # then activates a database and a storage tree. All of that scales with
    # data size.
    timeout-minutes: 180

    outputs:
      status: ${{ steps.decide.outputs.status }}
      operation: ${{ steps.decide.outputs.operation }}
      backup: ${{ steps.decide.outputs.backup }}
      backup_release: ${{ steps.decide.outputs.backup_release }}
      required_source_sha: ${{ steps.decide.outputs.required_source_sha }}
      current_release: ${{ steps.decide.outputs.current_release }}
      current_source_sha: ${{ steps.decide.outputs.current_source_sha }}
      build_required: ${{ steps.decide.outputs.build_required }}
      deploy_required: ${{ steps.decide.outputs.deploy_required }}
      resume_required: ${{ steps.decide.outputs.resume_required }}
      release_version: ${{ steps.decide.outputs.release_version }}
      release_metadata: ${{ steps.decide.outputs.release_metadata }}

    steps:
      # Recovery business logic stays entirely server-side; nothing from this
      # checkout is deployed. It comes from develop rather than any release
      # ref, because the shared recovery action is privileged operational
      # tooling and must never be selectable by the code being rebuilt.
      - name: Checkout trusted recovery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          fetch-depth: 1
          persist-credentials: false

      - name: Recover staging-main from the named offsite backup
        id: apply
        if: ${{ needs.validate.outputs.mode == 'new' }}
        uses: ./.github/actions/recover-rateguru-host
        with:
          mode: apply
          deployment-target: staging-main
          environment: staging

          recovery-host: ${{ needs.validate.outputs.recovery_host }}
          recovery-port: ${{ vars.RECOVERY_PORT }}

          bootstrap-user: ${{ vars.RECOVERY_BOOTSTRAP_USER }}
          bootstrap-ssh-key: ${{ secrets.RECOVERY_BOOTSTRAP_SSH_KEY }}
          bootstrap-known-hosts: ${{ secrets.RECOVERY_BOOTSTRAP_KNOWN_HOSTS }}

          backup-id: ${{ needs.validate.outputs.backup }}

      # Read-only. The data is already recovered; this only reports which of
      # the two safe stages the held operation is at, so a run whose build
      # failed yesterday — or whose runner died after the deployment — can be
      # picked up today without touching the host's data again.
      - name: Inspect the held recovery operation
        id: inspect
        if: ${{ needs.validate.outputs.mode == 'continue' }}
        uses: ./.github/actions/recover-rateguru-host
        with:
          mode: inspect
          deployment-target: staging-main
          environment: staging

          recovery-host: ${{ needs.validate.outputs.recovery_host }}
          recovery-port: ${{ vars.RECOVERY_PORT }}

          bootstrap-user: ${{ vars.RECOVERY_BOOTSTRAP_USER }}
          bootstrap-ssh-key: ${{ secrets.RECOVERY_BOOTSTRAP_SSH_KEY }}
          bootstrap-known-hosts: ${{ secrets.RECOVERY_BOOTSTRAP_KNOWN_HOSTS }}

          operation-id: ${{ needs.validate.outputs.operation }}

      # Index syntax, not property dereference: half of these output names
      # contain a hyphen, and `a.b-c || a.b-c` is exactly the shape where a
      # dereference is ambiguous with a subtraction. `outputs['b-c']` cannot be
      # read any other way.
      #
      # Exactly one of the two steps above ran; the other was skipped and its
      # outputs are empty, so `||` picks the one that has an answer.
      - name: Decide what this recovery still needs
        id: decide
        shell: bash
        env:
          STATUS: ${{ steps.apply.outputs['status'] || steps.inspect.outputs['status'] }}
          OPERATION: ${{ steps.apply.outputs['operation'] || steps.inspect.outputs['operation'] }}
          BACKUP: ${{ steps.apply.outputs['backup'] || steps.inspect.outputs['backup'] }}
          BACKUP_RELEASE: ${{ steps.apply.outputs['backup-release'] || steps.inspect.outputs['backup-release'] }}
          REQUIRED_SOURCE_SHA: ${{ steps.apply.outputs['required-source-sha'] || steps.inspect.outputs['required-source-sha'] }}
          DATA_RESTORED: ${{ steps.apply.outputs['data-restored'] || steps.inspect.outputs['data-restored'] }}
          CURRENT_RELEASE: ${{ steps.apply.outputs['current-release'] || steps.inspect.outputs['current-release'] }}
          CURRENT_SOURCE_SHA: ${{ steps.apply.outputs['source-sha'] || steps.inspect.outputs['source-sha'] }}
        run: |
          set -Eeuo pipefail

          test -n "${STATUS}"
          test -n "${OPERATION}"
          test -n "${REQUIRED_SOURCE_SHA}"

          release_version=""
          release_metadata="{}"

          case "${STATUS}" in
            awaiting-code)
              # The data is on the replacement host and the host is
              # deliberately not serving. Everything downstream is required.
              build_required=yes
              deploy_required=yes
              resume_required=yes
              ;;
            ready-to-resume)
              # A previous run already built and deployed the exact commit and
              # then lost its runner before resuming. Rebuilding and
              # redeploying an identical tree would be work with a risk and no
              # purpose; the operation only needs to be finished.
              build_required=no
              deploy_required=no
              resume_required=yes
              ;;
            *)
              echo "Unexpected recovery status: ${STATUS}" >&2
              echo "Only awaiting-code and ready-to-resume are stages this workflow may act on. The recovery remains held on the replacement host, and 'recover-host --inspect' on the host reports what it is waiting for." >&2
              exit 1
              ;;
          esac

          # The data must actually be on the host before any of the above means
          # anything. Both stages report it restored; a result that says
          # otherwise is one this workflow refuses to act on rather than
          # interpret.
          if [[ "${DATA_RESTORED}" != "true" ]]; then
            echo "The server reports status=${STATUS} but data_restored=${DATA_RESTORED:-<empty>}" >&2
            exit 1
          fi

          # This value becomes a Git checkout ref and a build's expected
          # commit. A malformed one is refused here, where the diagnostic can
          # still say what was wrong.
          if [[ ! "${REQUIRED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The server named a required commit that is not a full SHA: ${REQUIRED_SOURCE_SHA}" >&2
            exit 1
          fi

          # ready-to-resume is DEFINED by the deployed commit being the
          # required one, and the server is what decided it. This refuses to
          # act on a result that contradicts itself rather than re-deciding it.
          if [[ "${STATUS}" == "ready-to-resume" ]]; then
            if [[ -z "${CURRENT_RELEASE}" ]] || [[ "${CURRENT_SOURCE_SHA}" != "${REQUIRED_SOURCE_SHA}" ]]; then
              echo "The server reports ready-to-resume, but names current release '${CURRENT_RELEASE:-<empty>}' at commit '${CURRENT_SOURCE_SHA:-<empty>}' rather than the required ${REQUIRED_SOURCE_SHA}" >&2
              exit 1
            fi
          fi

          if [[ "${build_required}" == "yes" ]]; then
            # The version prefix of the recovery release comes from the
            # BACKUP's own release, so the rebuilt code keeps the version the
            # data belongs to. The rest of the release ID is new, and
            # deliberately: this is a new build of the same commit, not a claim
            # to be byte-identical to a release that already exists. The commit
            # is the identity that matters, and it is carried exactly.
            if [[ ! "${BACKUP_RELEASE}" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+)-[0-9]{8}-[0-9]{6}-[0-9a-f]{7,40}$ ]]; then
              echo "Backup release ${BACKUP_RELEASE} is not a canonical release ID; refusing to invent a version for the recovery build" >&2
              exit 1
            fi

            release_version="${BASH_REMATCH[1]}"

            # Extra identity only. build-rateguru refuses any attempt to
            # redefine a core release.json field, so this can add to the
            # artifact's provenance and never rewrite it.
            release_metadata="$(
              jq -cn \
                --arg operation "${OPERATION}" \
                --arg backup "${BACKUP}" \
                '{
                  environment: "staging",
                  recovery_operation: $operation,
                  recovery_backup: $backup,
                  host_recovery: true
                }'
            )"
          fi

          {
            echo "status=${STATUS}"
            echo "operation=${OPERATION}"
            echo "backup=${BACKUP}"
            echo "backup_release=${BACKUP_RELEASE}"
            echo "required_source_sha=${REQUIRED_SOURCE_SHA}"
            echo "current_release=${CURRENT_RELEASE}"
            echo "current_source_sha=${CURRENT_SOURCE_SHA}"
            echo "build_required=${build_required}"
            echo "deploy_required=${deploy_required}"
            echo "resume_required=${resume_required}"
            echo "release_version=${release_version}"
            echo "release_metadata=${release_metadata}"
          } >> "${GITHUB_OUTPUT}"

          echo "Status: ${STATUS}"
          echo "Operation: ${OPERATION}"
          echo "Backup: ${BACKUP} (offsite)"
          echo "Required source commit: ${REQUIRED_SOURCE_SHA}"
          echo "Historical build required: ${build_required}"
          echo "Controlled deployment required: ${deploy_required}"
          echo "Resume required: ${resume_required}"

  # The historical build. Deliberately holds NO GitHub Environment, no
  # recovery credential, no deployment SSH key, no Sentry credential, no B2
  # credential and no Prepare material: the commit it builds is an arbitrary
  # point in this repository's history, chosen by a backup rather than by a
  # person, and it must never be able to reach anything privileged.
  # contents: read is the whole of its permission.
  build:
    name: Build the exact commit the recovered data belongs to
    needs:
      - validate
      - binding
      - recover
    if: ${{ needs.recover.outputs.build_required == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    outputs:
      source-sha: ${{ steps.build.outputs.source-sha }}
      release-id: ${{ steps.build.outputs.release-id }}
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      workflow-artifact-name: ${{ steps.build.outputs.workflow-artifact-name }}

    steps:
      # Two checkouts, deliberately, and the separation is the whole trust
      # boundary. The build tooling is operational code and always comes from
      # develop; the application is a historical commit that may predate every
      # part of the current pipeline. Loading the build action out of the
      # historical commit would let recovered data decide what the operational
      # tooling does — so it never happens.
      - name: Checkout trusted build tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          fetch-depth: 1
          persist-credentials: false

      # The exact commit the server said the recovered data belongs to. Not a
      # branch, not a tag, not "whatever is near it": if this commit is gone or
      # no longer builds, this job fails and the replacement host simply stays
      # held. There is no fallback, because every fallback would install code
      # the data does not belong to.
      - name: Checkout the required historical application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.recover.outputs.required_source_sha }}
          path: application
          fetch-depth: 1
          persist-credentials: false

      - name: Build the recovery release artifact
        id: build
        uses: ./.github/actions/build-rateguru
        with:
          source-root: ${{ github.workspace }}/application

          # The commit itself, so release.json's source_ref never claims a
          # branch or tag this build did not come from.
          source-ref: ${{ needs.recover.outputs.required_source_sha }}
          expected-source-sha: ${{ needs.recover.outputs.required_source_sha }}

          release-version: ${{ needs.recover.outputs.release_version }}

          workflow-artifact-prefix: rateguru-host-recovery

          # Short-lived transport to the deployment job in the same run, and
          # nothing more. There is deliberately no durable artifact archive in
          # this architecture: a recovery rebuilds from the commit a backup
          # already names.
          artifact-retention-days: "3"

          release-metadata: ${{ needs.recover.outputs.release_metadata }}

  deploy:
    name: Deploy that commit while the replacement host stays held
    needs:
      - validate
      - binding
      - recover
      - build
    if: ${{ needs.recover.outputs.deploy_required == 'yes' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20

    steps:
      - name: Checkout deployment action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Deployment code is always taken from the trusted develop branch,
          # never from the historical application ref being deployed.
          ref: develop
          fetch-depth: 1
          persist-credentials: false

      # A last check on this side of the connection. It is deliberately NOT the
      # authorization: the server reads the required commit from the recovery
      # operation's own documents and refuses an artifact built from anything
      # else, and that refusal is what actually protects the host. This only
      # stops an obviously wrong artifact from being uploaded at all.
      - name: Prove the artifact is the commit the server requires
        shell: bash
        env:
          BUILT_SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
          REQUIRED_SOURCE_SHA: ${{ needs.recover.outputs.required_source_sha }}
        run: |
          set -Eeuo pipefail

          if [[ "${BUILT_SOURCE_SHA}" != "${REQUIRED_SOURCE_SHA}" ]]; then
            echo "The built artifact is commit ${BUILT_SOURCE_SHA}, but the recovered data belongs to ${REQUIRED_SOURCE_SHA}." >&2
            echo "Nothing is uploaded. The recovery remains held on the replacement host." >&2
            exit 1
          fi

          echo "Artifact commit matches the commit the recovered data belongs to: ${REQUIRED_SOURCE_SHA}"

      - name: Download the recovery release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build.outputs.workflow-artifact-name }}
          path: ${{ runner.temp }}/rateguru-release

      # The same deployment action and the same server-side deploy every
      # ordinary release uses. recovery-operation is the only difference, and
      # it names the operation — never the commit. The server reads the
      # required commit from that operation's own persisted state, re-proves
      # the hold through recover-host --inspect, and refuses this artifact if
      # it was built from anything else.
      #
      # The identity is the target's ordinary restricted deploy identity: the
      # user, the incoming directory, the sudo wrapper and the target root that
      # Prepare Host just created on the replacement machine. Only the ADDRESS
      # and the host key are the replacement machine's. The privileged recovery
      # credential is deliberately not used here — a deployment is a deployment.
      - name: Deploy the recovery release
        uses: ./.github/actions/deploy-rateguru
        with:
          deployment-target: staging-main

          deploy-host: ${{ needs.validate.outputs.recovery_host }}
          deploy-port: ${{ vars.RECOVERY_PORT }}
          deploy-user: ${{ vars.DEPLOY_USER }}
          deploy-incoming: ${{ vars.DEPLOY_INCOMING }}
          deploy-wrapper: ${{ vars.DEPLOY_WRAPPER }}
          deploy-root: ${{ vars.DEPLOY_ROOT }}

          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.RECOVERY_DEPLOY_KNOWN_HOSTS }}

          release-id: ${{ needs.build.outputs.release-id }}

          artifact-path: ${{ runner.temp }}/rateguru-release/${{ needs.build.outputs.artifact-name }}
          checksum-path: ${{ runner.temp }}/rateguru-release/${{ needs.build.outputs.artifact-name }}.sha256

          # Never true here, and the action refuses the combination outright.
          # Recovered data belongs to the schema of the commit being installed;
          # migrating it would change the very thing the recovery just put back.
          run-migrations: "false"

          recovery-operation: ${{ needs.recover.outputs.operation }}

  # REHEARSAL ONLY, and a deliberate stop rather than a failure.
  #
  # The disposable-host rehearsal has to prove that a recovery survives losing
  # its runner between the controlled deployment and the resume — the one
  # interruption that is otherwise hard to produce on purpose. This job
  # creates it: after a
  # successful controlled deployment it asks the SERVER what state the host is
  # in, requires the answer to be ready-to-resume, and stops.
  #
  # Nothing is undone and nothing is finished. The recovery guard stays, the
  # queue stays stopped, the scheduler stays held aside, and `current` stays
  # exactly where the controlled deployment put it. The operator finishes it
  # with mode=continue, which is the same path a real lost runner takes.
  #
  # There is no counterpart on the production workflow.
  hold:
    name: "REHEARSAL HOLD: stop after the controlled deployment"
    needs:
      - validate
      - binding
      - recover
      - deploy
    if: >-
      ${{ needs.validate.outputs.pause_after_controlled_deploy == 'true'
          && needs.recover.outputs.deploy_required == 'yes' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20

    steps:
      - name: Checkout trusted recovery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          fetch-depth: 1
          persist-credentials: false

      # Read-only, and the same inspection a lost-runner continuation makes.
      # The rehearsal is only worth anything if the state it leaves behind is
      # the state the server reports, not the state this workflow assumes.
      - name: Inspect the recovery the controlled deployment left behind
        id: inspect
        uses: ./.github/actions/recover-rateguru-host
        with:
          mode: inspect
          deployment-target: staging-main
          environment: staging

          recovery-host: ${{ needs.validate.outputs.recovery_host }}
          recovery-port: ${{ vars.RECOVERY_PORT }}

          bootstrap-user: ${{ vars.RECOVERY_BOOTSTRAP_USER }}
          bootstrap-ssh-key: ${{ secrets.RECOVERY_BOOTSTRAP_SSH_KEY }}
          bootstrap-known-hosts: ${{ secrets.RECOVERY_BOOTSTRAP_KNOWN_HOSTS }}

          operation-id: ${{ needs.recover.outputs.operation }}

      - name: Prove the rehearsal is holding where it meant to
        shell: bash
        env:
          STATUS: ${{ steps.inspect.outputs.status }}
          OPERATION: ${{ needs.recover.outputs.operation }}
          REPLACEMENT_HOST: ${{ needs.validate.outputs.recovery_host }}
        run: |
          set -Eeuo pipefail

          # awaiting-code here would mean the controlled deployment did not
          # actually land, and calling that a successful rehearsal hold would
          # be the one way this job could lie.
          if [[ "${STATUS}" != "ready-to-resume" ]]; then
            echo "The rehearsal hold expected the server to report ready-to-resume after the controlled deployment, and it reports ${STATUS:-<empty>}." >&2
            exit 1
          fi

          {
            echo "## REHEARSAL HOLD — this recovery is NOT complete"
            echo
            echo "The controlled deployment landed and the workflow stopped there on purpose,"
            echo "because \`pause-after-controlled-deploy\` was requested. This is not a failure,"
            echo "and it is not a recovered host."
            echo
            echo "The server reports \`ready-to-resume\`. On the replacement machine right now:"
            echo
            echo "- the recovery guard is still present;"
            echo "- the queue is still stopped;"
            echo "- the scheduler entry is still held aside;"
            echo "- \`current\` carries the recovered commit, and nothing is serving from it."
            echo
            echo "Finish it exactly the way a lost runner would be finished:"
            echo
            echo '```text'
            echo "Recover staging host"
            echo "mode=continue"
            echo "operation=${OPERATION}"
            echo "recovery-host=${REPLACEMENT_HOST}"
            echo "confirmation=RECOVER staging-main"
            echo "pause-after-controlled-deploy=false"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "Rehearsal holding at ready-to-resume; operation ${OPERATION} is still owned by the recovery."

  # The single owner of ending a hold. Nothing before this point starts the
  # queue, restores the scheduler, leaves maintenance or clears the recovery
  # guard — recover-host --resume does all of it, verifies the recovered data
  # and health checks the host, and only then is the operation over.
  #
  # Reached both when a controlled deployment landed above and when
  # continue-held found the required commit already installed.
  resume:
    name: Resume the recovered host
    needs:
      - validate
      - binding
      - recover
      - build
      - deploy
    if: >-
      ${{ !cancelled()
          && needs.recover.result == 'success'
          && needs.recover.outputs.resume_required == 'yes'
          && needs.validate.outputs.pause_after_controlled_deploy != 'true'
          && (needs.build.result == 'success' || needs.build.result == 'skipped')
          && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30

    outputs:
      status: ${{ steps.resume.outputs.status }}
      current_release: ${{ steps.resume.outputs['current-release'] }}
      source_sha: ${{ steps.resume.outputs['source-sha'] }}
      health: ${{ steps.resume.outputs.health }}

    steps:
      - name: Checkout trusted recovery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          fetch-depth: 1
          persist-credentials: false

      - name: Resume the recovery operation
        id: resume
        uses: ./.github/actions/recover-rateguru-host
        with:
          mode: resume
          deployment-target: staging-main
          environment: staging

          recovery-host: ${{ needs.validate.outputs.recovery_host }}
          recovery-port: ${{ vars.RECOVERY_PORT }}

          bootstrap-user: ${{ vars.RECOVERY_BOOTSTRAP_USER }}
          bootstrap-ssh-key: ${{ secrets.RECOVERY_BOOTSTRAP_SSH_KEY }}
          bootstrap-known-hosts: ${{ secrets.RECOVERY_BOOTSTRAP_KNOWN_HOSTS }}

          operation-id: ${{ needs.recover.outputs.operation }}

      # Read out of the SERVER's own result, never inferred from the build job.
      # What was built is what this workflow asked for; what the host serves is
      # what the host says it serves, and only the second one is evidence.
      - name: Prove the server finished the recovery it was asked to finish
        shell: bash
        env:
          STATUS: ${{ steps.resume.outputs.status }}
          CURRENT_RELEASE: ${{ steps.resume.outputs['current-release'] }}
          SOURCE_SHA: ${{ steps.resume.outputs['source-sha'] }}
          HEALTH: ${{ steps.resume.outputs.health }}
          REQUIRED_SOURCE_SHA: ${{ needs.recover.outputs.required_source_sha }}
        run: |
          set -Eeuo pipefail

          if [[ "${STATUS}" != "completed" ]]; then
            echo "The recovery did not complete: the server reports status=${STATUS:-<empty>}" >&2
            exit 1
          fi

          if [[ -z "${CURRENT_RELEASE}" ]]; then
            echo "The server reports a completed recovery but names no current release" >&2
            exit 1
          fi

          if [[ "${SOURCE_SHA}" != "${REQUIRED_SOURCE_SHA}" ]]; then
            echo "The recovered host serves commit ${SOURCE_SHA:-<empty>}, not the ${REQUIRED_SOURCE_SHA} its data belongs to" >&2
            exit 1
          fi

          if [[ "${HEALTH}" != "pass" ]]; then
            echo "The recovered host reports health=${HEALTH:-<empty>}" >&2
            exit 1
          fi

          echo "Recovery completed: ${CURRENT_RELEASE} at ${SOURCE_SHA}, health pass."

  # A recovery is not successful because --resume exited 0. It is successful
  # because the final contract holds on the host as it stands now, asked as a
  # separate read-only question: current canonical, release metadata valid,
  # neither guard present, database reachable and coherent, storage present,
  # scheduler present, queue RUNNING, health PASS.
  #
  # No `if`: every dependency must have SUCCEEDED for this to run, which is
  # exactly the gate this job is supposed to have.
  verify:
    name: Verify the recovered host against the final contract
    needs:
      - validate
      - binding
      - recover
      - resume
    # Deliberately tolerant of a FAILED resume, and this is the whole reason a
    # recovery does not depend on a runner surviving to the end.
    #
    # `recover-host --resume` clears the recovery guard as its commit point and
    # only prints its machine-readable result afterwards. A connection that
    # dies in between leaves a target that is fully recovered, healthy, queue
    # RUNNING and no longer guarded — while this workflow saw nothing but a
    # failed step. Skipping the verification there would strand the operator:
    # `continue-held` cannot continue an operation whose guard is gone, and
    # `start` cannot begin one on a host that is no longer empty.
    #
    # So the final contract is asked regardless, and it is what decides. It
    # weakens nothing: a resume that genuinely failed leaves the guard in
    # place, and `--verify` refuses any target that still carries one.
    #
    # `skipped` is deliberately NOT accepted — a resume that never ran means
    # the recovery is still mid-flight, not finished.
    if: >-
      ${{ !cancelled()
          && needs.recover.result == 'success'
          && (needs.resume.result == 'success' || needs.resume.result == 'failure') }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20

    outputs:
      status: ${{ steps.verify.outputs.status }}
      current_release: ${{ steps.verify.outputs['current-release'] }}
      source_sha: ${{ steps.verify.outputs['source-sha'] }}
      health: ${{ steps.verify.outputs.health }}

    steps:
      - name: Checkout trusted recovery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the recovered target
        id: verify
        uses: ./.github/actions/recover-rateguru-host
        with:
          mode: verify
          deployment-target: staging-main
          environment: staging

          recovery-host: ${{ needs.validate.outputs.recovery_host }}
          recovery-port: ${{ vars.RECOVERY_PORT }}

          bootstrap-user: ${{ vars.RECOVERY_BOOTSTRAP_USER }}
          bootstrap-ssh-key: ${{ secrets.RECOVERY_BOOTSTRAP_SSH_KEY }}
          bootstrap-known-hosts: ${{ secrets.RECOVERY_BOOTSTRAP_KNOWN_HOSTS }}

      # --verify proves the target satisfies the final contract; it does not
      # know which commit this OPERATION was for, because it takes no operation
      # and reads no operation state. That last identity check is made here,
      # against the commit the server named when the data was recovered — so a
      # host that is healthy on some other release can never be read as this
      # recovery having succeeded.
      - name: Prove the verified host serves the commit its data belongs to
        shell: bash
        env:
          CURRENT_RELEASE: ${{ steps.verify.outputs['current-release'] }}
          SOURCE_SHA: ${{ steps.verify.outputs['source-sha'] }}
          REQUIRED_SOURCE_SHA: ${{ needs.recover.outputs.required_source_sha }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${CURRENT_RELEASE}" ]]; then
            echo "The verified host names no current release" >&2
            exit 1
          fi

          if [[ "${SOURCE_SHA}" != "${REQUIRED_SOURCE_SHA}" ]]; then
            echo "The verified host serves commit ${SOURCE_SHA:-<empty>}, not the ${REQUIRED_SOURCE_SHA} its recovered data belongs to" >&2
            exit 1
          fi

          echo "Final contract holds: ${CURRENT_RELEASE} at ${SOURCE_SHA}."

  # Only once the host is provably recovered, and only for what it is provably
  # serving. Depending on `verify` with no `if` is the gate: a marker cannot be
  # recorded for a recovery whose final contract did not hold.
  #
  # Same shared implementation the deploy, release, rollback and restore
  # workflows use, and fail-open throughout: an unreachable Sentry or a
  # Nightwatch outage never turns a successfully recovered host into a failed
  # recovery.
  observability:
    name: Record the recovered release in Sentry and Nightwatch
    needs:
      - validate
      - binding
      - recover
      - verify
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout observability action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          fetch-depth: 1
          persist-credentials: false

      # The release the final VERIFICATION read off the host, not the one the
      # build job produced and not the one the resume step reported. On the
      # continue-held path there is no build job at all, and on the lost-runner
      # path there is no usable resume result either — the verification is the
      # one source that is always present when a marker is owed.
      - name: Record deployment in Sentry and Nightwatch
        uses: ./.github/actions/record-rateguru-deployment
        with:
          deployment-target: staging-main
          environment: staging

          release-id: ${{ needs.verify.outputs.current_release }}
          source-sha: ${{ needs.verify.outputs.source_sha }}

          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          sentry-org: ${{ vars.SENTRY_ORG }}
          sentry-project: ${{ vars.SENTRY_PROJECT }}

          # Nightwatch is reached on the machine that was actually recovered.
          deploy-host: ${{ needs.validate.outputs.recovery_host }}
          deploy-port: ${{ vars.RECOVERY_PORT }}
          deploy-user: ${{ vars.DEPLOY_USER }}

          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.RECOVERY_DEPLOY_KNOWN_HOSTS }}

  # Always, including on every failure path. A recovery that stops halfway
  # leaves a real host in a real state, and the operator's next move depends on
  # knowing which state that is. Identity only — no environment file, no rclone
  # configuration, no key material, no credential fingerprint, no secret size
  # or digest, and no GitHub Environment at all.
  report:
    name: Report what this recovery did
    needs:
      - validate
      - binding
      - prepare
      - recover
      - build
      - deploy
      - hold
      - resume
      - verify
      - observability
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Summarize the recovery
        shell: bash
        env:
          MODE: ${{ needs.validate.outputs.mode }}
          BACKUP: ${{ needs.validate.outputs.backup }}
          REQUESTED_OPERATION: ${{ needs.validate.outputs.operation }}
          REPLACEMENT_HOST: ${{ needs.validate.outputs.recovery_host }}
          STATUS: ${{ needs.recover.outputs.status }}
          OPERATION: ${{ needs.recover.outputs.operation }}
          SERVER_BACKUP: ${{ needs.recover.outputs.backup }}
          REQUIRED_SOURCE_SHA: ${{ needs.recover.outputs.required_source_sha }}
          BUILD_REQUIRED: ${{ needs.recover.outputs.build_required }}
          RECOVERED_RELEASE: ${{ needs.verify.outputs.current_release }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          BINDING_RESULT: ${{ needs.binding.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          RECOVER_RESULT: ${{ needs.recover.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          HOLD_RESULT: ${{ needs.hold.result }}
          PAUSE_REQUESTED: ${{ needs.validate.outputs.pause_after_controlled_deploy }}
          RESUME_RESULT: ${{ needs.resume.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          OBSERVABILITY_RESULT: ${{ needs.observability.result }}
        run: |
          set -Eeuo pipefail

          operation="${OPERATION:-${REQUESTED_OPERATION}}"
          backup="${SERVER_BACKUP:-${BACKUP}}"

          {
            echo "## Recover staging host"
            echo
            echo "| Fact | Value |"
            echo "| --- | --- |"
            echo "| Target | \`staging-main\` (\`staging\`) |"
            echo "| Replacement host | \`${REPLACEMENT_HOST:-unknown}\` |"
            echo "| Mode | \`${MODE:-unknown}\` |"
            echo "| Backup | \`${backup:-n/a}\` |"
            echo "| Recovery operation | \`${operation:-not yet assigned}\` |"
            echo "| Server status | \`${STATUS:-not reached}\` |"
            echo "| Required source SHA | \`${REQUIRED_SOURCE_SHA:-not reported}\` |"
            echo "| Historical build required | \`${BUILD_REQUIRED:-not decided}\` |"
            echo "| Recovered release | \`${RECOVERED_RELEASE:-none}\` |"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Validate request | \`${VALIDATE_RESULT}\` |"
            echo "| Replacement-host binding check | \`${BINDING_RESULT}\` |"
            echo "| Prepare replacement host | \`${PREPARE_RESULT}\` |"
            echo "| Recover data | \`${RECOVER_RESULT}\` |"
            echo "| Historical build | \`${BUILD_RESULT}\` |"
            echo "| Controlled recovery deployment | \`${DEPLOY_RESULT}\` |"
            echo "| Rehearsal hold | \`${HOLD_RESULT}\` |"
            echo "| Resume | \`${RESUME_RESULT}\` |"
            echo "| Final verify | \`${VERIFY_RESULT}\` |"
            echo "| Deployment marker | \`${OBSERVABILITY_RESULT}\` |"
            echo
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${PAUSE_REQUESTED}" == "true" ]] && [[ "${HOLD_RESULT}" == "success" ]]; then
            {
              echo "REHEARSAL HOLD — the recovery is deliberately unfinished."
              echo
              echo "This run is green and the host is NOT recovered: it stopped after the"
              echo "controlled deployment because the rehearsal asked it to, and the server"
              echo "confirmed \`ready-to-resume\` before stopping. Nothing was cleared, started"
              echo "or restored."
              echo
              echo "Finish it with \`mode=continue\` and the operation above — the same path a"
              echo "lost runner takes."
            } >> "${GITHUB_STEP_SUMMARY}"

            exit 0
          fi

          if [[ "${VERIFY_RESULT}" == "success" ]]; then
            {
              echo "The replacement host is recovered and verified against the final contract."
              echo
              echo "The machine \`staging-main\` was bound to before this run is unchanged: nothing here"
              echo "edited DEPLOY_HOST, the target registry or DNS, and no traffic moved."
            } >> "${GITHUB_STEP_SUMMARY}"

            # The lost-runner case, stated plainly so nobody re-runs a recovery
            # that is already finished. --resume clears the guard before it
            # prints its result, so a connection that dies in between fails the
            # step over a target that is complete. The final contract was asked
            # independently and held.
            if [[ "${RESUME_RESULT}" != "success" ]]; then
              {
                echo
                echo "The resume stage reports \`${RESUME_RESULT}\`, and the final verification"
                echo "still passed. That is the lost-runner case: the server finished the recovery"
                echo "and cleared its own guard before this workflow could read the result."
                echo
                echo "The host is complete. Do NOT re-run this workflow: \`mode=continue-held\`"
                echo "would fail, because there is no longer a held operation to continue."
              } >> "${GITHUB_STEP_SUMMARY}"
            fi

            exit 0
          fi

          # A hold is claimed only when an operation ID is actually known.
          # Every failure before the server assigned one — a malformed request,
          # the binding refusal, a failed preparation — leaves nothing held on
          # the replacement machine, and saying otherwise would send an
          # operator hunting for a guard that was never written.
          if [[ -n "${operation}" ]]; then
            {
              echo "Recovery remains held on the replacement host."
              echo
              echo "Nothing was cleaned up to make this run look green: the recovered data, the"
              echo "recovery guard and the operation's own state are all still on the machine."
              echo
              echo 'Re-run "Recover staging host" with:'
              echo
              echo '```text'
              echo "mode=continue-held"
              echo "operation=${operation}"
              echo "recovery-host=${REPLACEMENT_HOST}"
              echo "confirmation=RECOVER staging-main"
              echo '```'
              echo
              echo "It will ask the server which stage the recovery is at and continue from there:"
              echo "\`awaiting-code\` rebuilds and redeploys the required commit, \`ready-to-resume\`"
              echo "skips straight to the resume."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            {
              echo "No recovery operation ID reached this summary, so there is nothing to continue"
              echo "with \`mode=continue-held\` — and this summary cannot claim a recovery is held"
              echo "on the replacement machine either."
              echo
              echo "Nothing was cleaned up regardless. If the recovery step itself failed, its own"
              echo "log names the operation the server assigned, if it got that far; a fresh"
              echo "\`mode=start\` run refuses BY NAME, naming the operation that owns the target,"
              echo "when one really is held."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
