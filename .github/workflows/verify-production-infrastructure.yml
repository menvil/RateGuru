name: Verify production infrastructure

# The permanent, repeatable, READ-ONLY verification of everything tits-guru
# depends on on its host: infrastructure/scripts/verify-infrastructure --target
# tits-guru, run from trusted main tooling. It may be run any number of times in
# a row and changes nothing.
#
# It exists before the launch, and it is the same command after it. The
# verifier decides from the target's reviewed state what is required: while
# tits-guru is planned and its mail is held, the host-global mail gateway and
# the mail identity contract are required, and the DKIM key, outbound
# readiness (including its A, PTR, SPF, DKIM and DMARC records) and the
# application's health are reported as DEFERRED. Once the target is active and
# delivers outbound, the same run requires all of them. This workflow chooses
# nothing: the target, the trusted ref and the GitHub Environment are fixed.
on:
  workflow_dispatch:

permissions:
  contents: read

# tits-guru shares its physical host with staging today, so verifying it must
# never observe that host halfway through a mutation of either target. This is
# the domain Configure tits.guru and every staging host mutation use for the
# same reason; it is a fact about today's topology, and moves with the target
# when it gets a host of its own. It waits rather than cancelling anything.
concurrency:
  group: rateguru-staging-deployment
  cancel-in-progress: false

jobs:
  # --- main-only control-plane gate (begin) ---
  #
  # Fail-closed, and deliberately a job of its own with NO `environment:`.
  #
  # The production-tits-guru Environment permits `main` and `v*`. `v*` has to be
  # there, because Release to production runs with `github.ref` at the tag — but
  # GitHub matches an Environment's allowlist against the ref of the RUN, and a
  # workflow_dispatch ref may be a tag as well as a branch. So the allowlist
  # alone would also admit a manual dispatch of THIS workflow from a tag, and
  # the workflow definition that then ran would be the one at that tag.
  #
  # A manual production operation is a main-only operation, so anything else is
  # refused here, before a single production job starts. Because this job holds
  # no Environment, a refused run never has those credentials available to it at
  # all — the job that owns them never begins.
  #
  # WHAT THIS IS NOT. It guards against accidental and casual misuse: a tag
  # selected in the Run workflow dropdown, or the habit of dispatching from
  # develop, neither of which can reach a production job any more.
  # It is NOT a boundary against someone who can already create an arbitrary
  # trusted tag, because they would author this very file at that tag. Who may
  # create `v*` is a GitHub tag ruleset, which is a separate permission boundary
  # and the one that actually bounds that case. See
  # infrastructure/runbooks/deployment-targets.md.
  validate-ref:
    name: Refuse any ref but main
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require refs/heads/main
        shell: bash
        env:
          RUN_REF: ${{ github.ref }}
        run: |
          set -Eeuo pipefail

          if [[ "${RUN_REF}" != "refs/heads/main" ]]; then
            echo "A manual production operation runs from main and nowhere else." >&2
            echo "Dispatched ref: ${RUN_REF}" >&2
            echo "Re-run with main selected. New application code reaches production only through Release to production, from a v* tag." >&2
            exit 1
          fi

          echo "Control plane: ${RUN_REF}"
  # --- main-only control-plane gate (end) ---
  verify:
    name: Verify the tits-guru infrastructure
    runs-on: ubuntu-24.04

    needs: [validate-ref]

    # The GitHub Environment holding this target's own credentials — not its
    # environment class, which is passed to the action as . Only
    # this job, downstream of the main-only gate, ever receives them.
    environment: production-tits-guru
    timeout-minutes: 15

    steps:
      # Operational tooling always comes from main, the production control
      # plane — never from develop.
      - name: Checkout trusted tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the infrastructure on the production host
        id: verify
        uses: ./.github/actions/verify-rateguru-infrastructure
        with:
          deployment-target: tits-guru
          environment: production

          bootstrap-host: ${{ vars.DEPLOY_HOST }}
          bootstrap-port: ${{ vars.DEPLOY_PORT }}

          # The privileged bootstrap credential: the read-only checks inspect
          # root-owned configuration and the DKIM key. Never the deploy key.
          bootstrap-user: ${{ vars.BOOTSTRAP_USER }}
          bootstrap-ssh-key: ${{ secrets.BOOTSTRAP_SSH_KEY }}
          bootstrap-known-hosts: ${{ secrets.BOOTSTRAP_KNOWN_HOSTS }}

      # Phrased so a green run cannot be read as "production is live".
      - name: Report the verification
        if: ${{ always() }}
        shell: bash
        env:
          STATUS: ${{ steps.verify.outputs.status }}
          PASS: ${{ steps.verify.outputs.pass }}
          FAIL: ${{ steps.verify.outputs.fail }}
          DEFERRED: ${{ steps.verify.outputs.deferred }}
        run: |
          set -Eeuo pipefail

          {
            echo "## tits-guru infrastructure"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Result | \`${STATUS:-not completed}\` |"
            echo "| Passed | ${PASS:-—} |"
            echo "| Failed | ${FAIL:-—} |"
            echo "| Deferred | ${DEFERRED:-—} |"
            echo
            echo "DEFERRED items are required only once the target is active and delivers"
            echo "outbound; a passing run before that is NOT \"production is live\"."
            echo "Read-only: nothing on the host was changed. The full report is in the job log."
          } >> "${GITHUB_STEP_SUMMARY}"
