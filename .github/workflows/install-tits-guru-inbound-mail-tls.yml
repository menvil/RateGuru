name: Install tits.guru inbound mail TLS

# The public inbound listener's certificate on tits-guru's host:
# infrastructure/scripts/activate-mail-inbound --install-tls --target tits-guru,
# run from trusted main tooling, after a typed confirmation. It runs
# install-mail-inbound-tls, which takes the certificate Certbot already holds
# for mx1.tits.guru — /etc/letsencrypt/live/mx1.tits.guru, issued by the
# operator as infrastructure/runbooks/mail-inbound.md says — judges it (the
# name, at least 14 days left, a trusted chain, the key matching, every path
# inside Certbot's own root-owned tree), copies it into
# /etc/rateguru-mail-inbound/tls as regular files, and installs Certbot's
# deploy hook, rendered from main, that does the same for every renewal of
# that one certificate and reloads Postfix when it runs. Run again, it changes
# nothing that is already in place.
#
# It issues no certificate and runs no Certbot command; no certificate or key
# passes through GitHub — only the infrastructure/ tree is uploaded, and
# removed again. Public SMTP, the listeners, the routes, the queue, OpenDKIM,
# Nginx, the site's certificates, the firewall and DNS are never touched;
# Postfix is at most reloaded, never stopped or restarted. Nothing here runs
# on a merge or a schedule.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type exactly "INSTALL tits-guru inbound TLS" to install the inbound listener's certificate on the production host
        required: true
        default: ""
        type: string

permissions:
  contents: read

# tits-guru shares its physical host with staging today, so this must never run
# halfway through a mutation of either target, nor while anything else reads
# that machine: the domain every change to it waits in. It waits rather than
# cancelling anything. On the host, activate-mail-inbound holds the host's own
# infrastructure lock for the whole run.
concurrency:
  group: rateguru-staging-deployment
  cancel-in-progress: false

jobs:
  # --- main-only control-plane gate (begin) ---
  #
  # Fail-closed, and deliberately a job of its own with NO `environment:`.
  #
  # The production-tits-guru Environment permits `main` and `v*`. `v*` has to be
  # there, because Release to production runs with `github.ref` at the tag — but
  # GitHub matches an Environment's allowlist against the ref of the RUN, and a
  # workflow_dispatch ref may be a tag as well as a branch. So the allowlist
  # alone would also admit a manual dispatch of THIS workflow from a tag, and
  # the workflow definition that then ran would be the one at that tag.
  #
  # A manual production operation is a main-only operation, so anything else is
  # refused here, before a single production job starts. Because this job holds
  # no Environment, a refused run never has those credentials available to it at
  # all — the job that owns them never begins.
  #
  # WHAT THIS IS NOT. It guards against accidental and casual misuse: a tag
  # selected in the Run workflow dropdown, or the habit of dispatching from
  # develop, neither of which can reach a production job any more.
  # It is NOT a boundary against someone who can already create an arbitrary
  # trusted tag, because they would author this very file at that tag. Who may
  # create `v*` is a GitHub tag ruleset, which is a separate permission boundary
  # and the one that actually bounds that case. See
  # infrastructure/runbooks/deployment-targets.md.
  validate-ref:
    name: Refuse any ref but main
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require refs/heads/main
        shell: bash
        env:
          RUN_REF: ${{ github.ref }}
        run: |
          set -Eeuo pipefail

          if [[ "${RUN_REF}" != "refs/heads/main" ]]; then
            echo "A manual production operation runs from main and nowhere else." >&2
            echo "Dispatched ref: ${RUN_REF}" >&2
            echo "Re-run with main selected. New application code reaches production only through Release to production, from a v* tag." >&2
            exit 1
          fi

          echo "Control plane: ${RUN_REF}"
  # --- main-only control-plane gate (end) ---
  validate-confirmation:
    name: Require the typed confirmation
    runs-on: ubuntu-24.04

    needs: [validate-ref]
    timeout-minutes: 5

    steps:
      - name: Require exactly "INSTALL tits-guru inbound TLS"
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail

          if [[ "${CONFIRMATION}" != "INSTALL tits-guru inbound TLS" ]]; then
            echo "confirmation must be exactly 'INSTALL tits-guru inbound TLS' to install the inbound listener's certificate on the production host" >&2
            exit 1
          fi

          echo "Confirmed: INSTALL tits-guru inbound TLS"

  install:
    name: Install tits-guru's inbound mail TLS
    runs-on: ubuntu-24.04

    needs: [validate-ref, validate-confirmation]

    # The GitHub Environment holding this target's own credentials. Only this
    # job, downstream of the main-only gate and the typed confirmation, ever receives them.
    environment: production-tits-guru
    timeout-minutes: 20

    steps:
      # Operational tooling always comes from main, the production control
      # plane — never from the integration branch.
      - name: Checkout trusted tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Install on the production host
        id: inbound
        uses: ./.github/actions/activate-rateguru-mail-inbound
        with:
          operation: install-tls
          deployment-target: tits-guru

          bootstrap-host: ${{ vars.DEPLOY_HOST }}
          bootstrap-port: ${{ vars.DEPLOY_PORT }}

          # The privileged bootstrap credential: Certbot's tree, the pair and
          # the deploy hook are root's. Never the deploy key.
          bootstrap-user: ${{ vars.BOOTSTRAP_USER }}
          bootstrap-ssh-key: ${{ secrets.BOOTSTRAP_SSH_KEY }}
          bootstrap-known-hosts: ${{ secrets.BOOTSTRAP_KNOWN_HOSTS }}

      # The action writes the result of every completed run. A run that
      # produced no result at all says so here, rather than leaving an empty
      # summary that could be read as nothing wrong.
      - name: Report an incomplete run
        if: ${{ always() && steps.inbound.outputs.status == '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          {
            echo "## tits-guru inbound mail TLS"
            echo
            echo "The installation did not complete, so there is no result; the reason is in the job log. A pair that could not be put in place intact is rolled back to the one installed before."
          } >> "${GITHUB_STEP_SUMMARY}"
