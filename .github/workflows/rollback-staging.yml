name: Rollback staging

# Manual-only: rollback is an operator decision, never an automatic
# reaction. The server-side wrapper owns all business logic (deployment
# lock, target lifecycle, release validation, atomic current/previous
# switch, PHP-FPM reload, health check with automatic restore on failure,
# rollback history) and .github/actions/rollback-rateguru owns the GitHub
# transport — this workflow only fixes the identity of what is rolled back.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Roll back to the previous release, or to an explicit release ID
        required: true
        default: previous
        type: choice
        options:
          - previous
          - release

      release-id:
        description: Release ID (required when mode=release, must be empty when mode=previous)
        required: false
        type: string

permissions:
  contents: read

# Same logical deployment domain as deploy-staging.yml: a rollback must
# never run concurrently with a staging deploy.
concurrency:
  group: rateguru-staging-deployment
  cancel-in-progress: false

jobs:
  # --- develop-only control-plane gate (begin) ---
  #
  # Fail-closed, and deliberately a job of its own with NO `environment:`.
  #
  # A workflow_dispatch ref may be any branch or tag, and the `staging`
  # Environment does not restrict refs — so without this, dispatching from an
  # arbitrary branch would run THAT branch's workflow definition with staging's
  # bootstrap and deploy credentials. Checking out `develop` for the tooling does
  # not help: the YAML deciding what to do with those credentials is the YAML at
  # the dispatched ref.
  #
  # This operation takes no ref input, because it has nothing to select: it
  # converges the host or the target from the committed tooling. So develop is the
  # only ref it has any reason to run from, and anything else is refused before a
  # single job holding the Environment starts. Because this job holds no
  # Environment, a refused run never has those credentials available to it at all.
  #
  # `deploy-staging.yml` deliberately has NO such gate: it DOES take a ref input,
  # and deploying an operator-selected ref to staging is the whole point of it —
  # staging is where a branch is verified before it is promoted.
  #
  # WHAT THIS IS NOT, and this matters more than it reads.
  #
  # A gate written in the workflow can only bind refs whose workflow contains it.
  # Dispatching a ref from BEFORE this gate existed runs that ref's unguarded job,
  # with the Environment, and nothing here can prevent it — the same is true of
  # anyone who can push a branch, who would simply author this file on it.
  #
  # So this closes the ordinary mistake — a branch left selected in the Run
  # workflow dropdown, a copied URL with the wrong ref — and does not close the
  # general case. What closes the general case is outside the YAML: restricting
  # the `staging` Environment's allowed refs.
  #
  # Precisely what that buys, because it is easy to overstate: GitHub evaluates
  # the allowlist per JOB, when a job that declares the Environment is about to
  # start — not for the workflow as a whole. A disallowed ref can still run this
  # workflow's Environment-free jobs, and on an older ref can run whatever
  # unprotected jobs that ref happens to define. What it cannot do is start a job
  # holding `staging`, which is where the credentials are. That is the boundary:
  # the credentials, not the run.
  #
  # That restriction is the branch `develop` AND the tag pattern `v*`, not
  # `develop` alone: release.yml triggers on `v*` and verifies the artifact on
  # staging through this same Environment, so a develop-only rule would refuse
  # every release. It is an operator setting no pull request can apply; see
  # infrastructure/runbooks/deployment-targets.md. Until it is set, treat this
  # gate as a guard rail rather than a boundary.
  validate-ref:
    name: Refuse any ref but develop
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require refs/heads/develop
        shell: bash
        env:
          RUN_REF: ${{ github.ref }}
        run: |
          set -Eeuo pipefail

          if [[ "${RUN_REF}" != "refs/heads/develop" ]]; then
            echo "This staging operation runs from develop and nowhere else." >&2
            echo "Dispatched ref: ${RUN_REF}" >&2
            echo "Re-run with develop selected. To deploy a particular ref to staging, use Deploy to staging, which takes one." >&2
            exit 1
          fi

          echo "Control plane: ${RUN_REF}"
  # --- develop-only control-plane gate (end) ---
  rollback:
    name: Roll back staging-main
    runs-on: ubuntu-24.04

    needs: [validate-ref]
    environment: staging
    timeout-minutes: 10

    steps:
      # Rollback business logic stays entirely server-side; nothing from this
      # checkout is deployed. It is taken from develop rather than any release
      # ref, because the shared rollback action — and the observability action
      # it calls — are privileged deployment tooling.
      - name: Checkout rollback and observability actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          fetch-depth: 1
          persist-credentials: false

      # The target and the environment are structural properties of this
      # workflow, never operator input: an operator chooses what to roll back
      # to, never which target gets rolled back.
      - name: Roll back staging-main
        id: rollback
        uses: ./.github/actions/rollback-rateguru
        with:
          deployment-target: staging-main
          environment: staging

          deploy-host: ${{ vars.DEPLOY_HOST }}
          deploy-port: ${{ vars.DEPLOY_PORT }}
          deploy-user: ${{ vars.DEPLOY_USER }}
          deploy-root: ${{ vars.DEPLOY_ROOT }}

          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

          mode: ${{ inputs.mode }}
          release-id: ${{ inputs.release-id }}

          # The shared action records the deployment marker for whatever
          # immutable release the target ended up serving. It is fail-open:
          # an unreachable Sentry never turns a healthy rollback into a
          # failed run, and no marker is recorded at all when the release
          # could not be read back.
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          sentry-org: ${{ vars.SENTRY_ORG }}
          sentry-project: ${{ vars.SENTRY_PROJECT }}
