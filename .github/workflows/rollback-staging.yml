name: Rollback staging

# Manual-only: rollback is an operator decision, never an automatic
# reaction. The server-side wrapper owns all business logic (deployment
# lock, target lifecycle, release validation, atomic current/previous
# switch, PHP-FPM reload, health check with automatic restore on failure,
# rollback history) — this workflow only transports the request.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Roll back to the previous release, or to an explicit release ID
        required: true
        default: previous
        type: choice
        options:
          - previous
          - release

      release-id:
        description: Release ID (required when mode=release, must be empty when mode=previous)
        required: false
        type: string

permissions:
  contents: read

# Same logical deployment domain as deploy-staging.yml: a rollback must
# never run concurrently with a staging deploy.
concurrency:
  group: rateguru-staging-deployment
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back staging-main
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10

    steps:
      # Only needed for the local observability action below. Rollback business
      # logic stays entirely server-side; nothing from this checkout is
      # deployed, and it is taken from develop rather than any release ref.
      - name: Checkout observability action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          fetch-depth: 1
          persist-credentials: false

      - name: Validate inputs
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          RELEASE_ID: ${{ inputs.release-id }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail

          for required_var in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER; do
            if [[ -z "${!required_var}" ]]; then
              echo "${required_var} is not configured for the staging environment" >&2
              exit 1
            fi
          done

          case "${MODE}" in
            previous)
              if [[ -n "${RELEASE_ID}" ]]; then
                echo "release-id must be empty when mode=previous" >&2
                exit 1
              fi
              ;;
            release)
              # Basic non-empty validation only: the server-side rollback
              # script is the single source of truth for the release ID
              # format and its existence on the target.
              if [[ -z "${RELEASE_ID}" ]]; then
                echo "release-id is required when mode=release" >&2
                exit 1
              fi
              ;;
            *)
              echo "Invalid mode: ${MODE}" >&2
              exit 1
              ;;
          esac

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          key_path="${RUNNER_TEMP}/rateguru_rollback_key"
          known_hosts_path="${RUNNER_TEMP}/rateguru_known_hosts"

          install -m 0600 /dev/null "${key_path}"
          install -m 0600 /dev/null "${known_hosts_path}"

          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${key_path}"
          printf '%s\n' "${KNOWN_HOSTS}" > "${known_hosts_path}"

          ssh-keygen -y -f "${key_path}" >/dev/null

          {
            echo "RATEGURU_SSH_KEY_PATH=${key_path}"
            echo "RATEGURU_KNOWN_HOSTS_PATH=${known_hosts_path}"
          } >> "${GITHUB_ENV}"

      - name: Roll back via target-aware wrapper
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          MODE: ${{ inputs.mode }}
          RELEASE_ID: ${{ inputs.release-id }}
        run: |
          set -Eeuo pipefail

          # The remote command is a fixed argv built as a Bash array — never
          # an interpolated shell string, never user input concatenated into
          # a command line.
          remote_command=(
            sudo -n /usr/local/sbin/rateguru-rollback
            --target staging-main
          )

          if [[ "${MODE}" == "previous" ]]; then
            remote_command+=(--previous)
          else
            remote_command+=(--release "${RELEASE_ID}")
          fi

          ssh \
            -p "${DEPLOY_PORT}" \
            -i "${RATEGURU_SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${RATEGURU_KNOWN_HOSTS_PATH}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "${remote_command[@]@Q}"

      # Reached only when the previous step succeeded, which — because the
      # server-side wrapper restores the old release and fails when its health
      # check fails — means the target is serving a healthy release again. The
      # release ID is read back off the server rather than derived from the
      # workflow inputs, so `mode=previous` reports the real immutable release
      # the target landed on instead of guessing.
      - name: Resolve the release now serving the target
        id: active
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${DEPLOY_ROOT}" ]]; then
            echo "DEPLOY_ROOT is not configured; cannot resolve the active release." >&2
            echo "release_id=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          printf -v current_command \
            'basename "$(readlink -f %q)"' \
            "${DEPLOY_ROOT%/}/current"

          # This is a second, independent SSH connection made purely to read a
          # value back. Under `set -e` a failed assignment would abort the step
          # and fail the job — reporting an already-successful, already-health-
          # checked rollback as a failed run. Catch it and carry on to the
          # summary with no release ID instead.
          if ! active_release="$(
            ssh \
              -p "${DEPLOY_PORT}" \
              -i "${RATEGURU_SSH_KEY_PATH}" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="${RATEGURU_KNOWN_HOSTS_PATH}" \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "${current_command}"
          )"; then
            echo "Could not read the active release back from the target." >&2
            echo "Rollback succeeded; skipping Sentry deployment marker." >&2
            echo "release_id=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # The rollback itself already succeeded and the target is healthy.
          # If what came back is not a canonical release ID — an absent
          # `current`, a truncated read — record nothing rather than failing
          # this job for an observability reason.
          release_regex='^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]{8}-[0-9]{6}-[0-9a-f]{7,40}$'

          if [[ ! "${active_release}" =~ ${release_regex} ]]; then
            echo "Active release is not a canonical release ID: ${active_release}" >&2
            echo "Rollback succeeded; skipping Sentry deployment marker." >&2
            echo "release_id=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "release_id=${active_release}" >> "${GITHUB_OUTPUT}"
          echo "Target is now serving ${active_release}"

      # A rollback is a deployment of an existing release, so it records a new
      # deploy marker against that same immutable release — never a synthetic
      # "rollback" release, and never a re-association of its commits.
      - name: Record Sentry deployment marker for the restored release
        if: ${{ steps.active.outputs.release_id != '' }}
        uses: ./.github/actions/sentry-release
        with:
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          sentry-org: ${{ vars.SENTRY_ORG }}
          sentry-project: ${{ vars.SENTRY_PROJECT }}

          environment: staging

          release-id: ${{ steps.active.outputs.release_id }}

      - name: Write summary
        if: always()
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          RELEASE_ID: ${{ inputs.release-id }}
          ACTIVE_RELEASE: ${{ steps.active.outputs.release_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail

          {
            echo "Target: staging-main"
            echo "Mode: ${MODE}"
            echo "Requested release: ${RELEASE_ID:-previous}"
            echo "Active release: ${ACTIVE_RELEASE:-unknown}"
            echo "Result: ${JOB_STATUS}"
          } >> "${GITHUB_STEP_SUMMARY}"
