name: Provision tits.guru

# Manual-only, and deliberately without a single operator input.
#
# There is nothing to choose. The target is tits-guru, its environment class is
# production, and the tooling always comes from main — all three are
# structural properties of this file rather than things an operator selects. An
# operator presses "Run workflow"; every decision the operation makes belongs to
# infrastructure/scripts/provision-target on the host.
#
# WHAT THIS IS. One button for one decision: build the infrastructure a target
# that is already declared `planned` in the registry needs, on the host that
# already exists. Nothing more.
#
# WHAT IT IS NOT. It builds no artifact, deploys no release, runs no migration,
# writes no .env and generates no APP_KEY. It creates no database and no role,
# installs no authorized_keys, grants no sudo, configures no B2, no backups, no
# TLS, no DNS, no public vhost, no mail and no production observability. It does
# not edit deployment-targets.json and it does not change any lifecycle. There
# is deliberately no `ref`, `tag`, `branch`, `version` or `run-migrations`
# input, because none of those are questions this operation asks.
#
# The only valid end state is the one it started from, plus infrastructure:
#
#   target=tits-guru  lifecycle=planned  environment_class=production
#   infrastructure=provisioned  application=not-deployed  public=not-activated
#
# A green run is NOT "production is ready". It is "the target's infrastructure
# exists". Activation, public routing and the first release are each separate,
# deliberate operations that this workflow cannot perform.
on:
  workflow_dispatch:

permissions:
  contents: read

# Provisioning installs this target's own service configuration and reloads
# host services shared with staging-main, so it must not overlap a staging
# deploy, a staging rollback, a Prepare Host run or any other mutation of the
# same machine.
#
# The staging group is the right one BECAUSE both logical targets currently sit
# on the same physical host. That is a fact about today's topology, not about
# the targets: when a second host actually exists, the serialization model
# becomes a question about hosts rather than about environments, and inventing a
# second host-mutation lane now would only mean two lanes over one machine.
concurrency:
  group: rateguru-staging-deployment
  cancel-in-progress: false

jobs:
  # --- main-only control-plane gate (begin) ---
  #
  # Fail-closed, and deliberately a job of its own with NO `environment:`.
  #
  # The production-tits-guru Environment permits `main` and `v*`. `v*` has to be
  # there, because Release to production runs with `github.ref` at the tag — but
  # GitHub matches an Environment's allowlist against the ref of the RUN, and a
  # workflow_dispatch ref may be a tag as well as a branch. So the allowlist
  # alone would also admit a manual dispatch of THIS workflow from a tag, and
  # the workflow definition that then ran would be the one at that tag.
  #
  # A manual production operation is a main-only operation, so anything else is
  # refused here, before a single production job starts. Because this job holds
  # no Environment, a refused run never has those credentials available to it at
  # all — the job that owns them never begins.
  #
  # WHAT THIS IS NOT. It guards against accidental and casual misuse: a tag
  # selected in the Run workflow dropdown, or the habit of dispatching from
  # develop, neither of which can reach a production job any more.
  # It is NOT a boundary against someone who can already create an arbitrary
  # trusted tag, because they would author this very file at that tag. Who may
  # create `v*` is a GitHub tag ruleset, which is a separate permission boundary
  # and the one that actually bounds that case. See
  # infrastructure/runbooks/deployment-targets.md.
  validate-ref:
    name: Refuse any ref but main
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require refs/heads/main
        shell: bash
        env:
          RUN_REF: ${{ github.ref }}
        run: |
          set -Eeuo pipefail

          if [[ "${RUN_REF}" != "refs/heads/main" ]]; then
            echo "A manual production operation runs from main and nowhere else." >&2
            echo "Dispatched ref: ${RUN_REF}" >&2
            echo "Re-run with main selected. New application code reaches production only through Release to production, from a v* tag." >&2
            exit 1
          fi

          echo "Control plane: ${RUN_REF}"
  # --- main-only control-plane gate (end) ---
  provision:
    name: Provision the tits-guru infrastructure
    runs-on: ubuntu-24.04

    needs: [validate-ref]

    # READ THIS BEFORE CHANGING IT.
    #
    # `production-tits-guru` here is the GitHub Environment, and a GitHub
    # Environment is where a PHYSICAL HOST is bound to its bootstrap credential.
    # It is named after the TARGET rather than after an environment class,
    # because a class is shared and a credential boundary must not be: a second
    # production brand gets its own environment, not a share of this one.
    #
    # It is NOT the target's environment class. tits-guru is a production
    # target; `environment: production` is passed to the action below, and that
    # is what decides which registry contract, paths and identities the
    # server-side provisioner applies.
    #
    #   GitHub Environment  = which credentials and approvals this run uses
    #   action `environment`= which environment class the TARGET belongs to
    #
    # A GitHub Environment is a LOGICAL credential and permission boundary. It
    # says nothing about how many machines exist, and it never has: one
    # environment can bind a host that another environment also binds. That is
    # exactly the case today — tits-guru shares staging-main's machine, and
    # `production-tits-guru` names that same host.
    #
    # Sharing a machine is not a reason to share a credential box.
    #
    # While this job read staging's box, the blast radius of a staging secret
    # included every production provisioning run, and a protection rule on
    # production could be sidestepped by going through staging's.
    #
    # The hardware is not what decides this, so the hardware changing does not
    # revisit it: when tits-guru gets its own server, only the values inside
    # this environment change, and nothing in this workflow does.
    environment: production-tits-guru

    # Provisioning converges a target's filesystem, PHP-FPM pool, Supervisor
    # program, scheduler entry and internal vhost, then verifies all of it. On
    # an already-provisioned target it finishes in a fraction of this.
    timeout-minutes: 30

    steps:
      # Provisioning tooling is operational code and always comes from main,
      # the production control plane — never develop, which the
      # production-tits-guru Environment does not allow. There is no second
      # checkout here, because there is no application source in this operation
      # at all.
      - name: Checkout trusted provisioning tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Provision tits-guru
        id: provision
        uses: ./.github/actions/provision-rateguru-target
        with:
          deployment-target: tits-guru

          # The TARGET's environment class, not the GitHub Environment above.
          environment: production

          # The physical machine, from the environment that currently binds it.
          bootstrap-host: ${{ vars.DEPLOY_HOST }}
          bootstrap-port: ${{ vars.DEPLOY_PORT }}

          # Provisioning creates system identities and service configuration, so
          # it needs root. The restricted deploy credential reaches only the
          # narrow rateguru-deploy / rateguru-rollback wrappers and cannot do
          # this; there is deliberately no fallback between them.
          bootstrap-user: ${{ vars.BOOTSTRAP_USER }}
          bootstrap-ssh-key: ${{ secrets.BOOTSTRAP_SSH_KEY }}
          bootstrap-known-hosts: ${{ secrets.BOOTSTRAP_KNOWN_HOSTS }}

      # The action's own outputs, reported rather than re-derived — and phrased
      # so a green run cannot be read as more than it is.
      - name: Report what this run did and did not do
        shell: bash
        env:
          PROVISIONED: ${{ steps.provision.outputs.provisioned }}
          LIFECYCLE: ${{ steps.provision.outputs.lifecycle }}
          APPLICATION_STATE: ${{ steps.provision.outputs['application-state'] }}
          PUBLIC_STATE: ${{ steps.provision.outputs['public-state'] }}
        run: |
          set -Eeuo pipefail

          {
            echo "## Provision tits.guru"
            echo
            echo "| Fact | Value |"
            echo "| --- | --- |"
            echo "| Target | \`tits-guru\` |"
            echo "| Environment class | \`production\` |"
            echo "| Infrastructure provisioned | \`${PROVISIONED:-unknown}\` |"
            echo "| Lifecycle | \`${LIFECYCLE:-unknown}\` |"
            echo "| Application | \`${APPLICATION_STATE:-unknown}\` |"
            echo "| Public | \`${PUBLIC_STATE:-unknown}\` |"
            echo
            echo "The target's infrastructure exists. That is all this run did."
            echo
            echo "It is still \`lifecycle=planned\`, it has no public application"
            echo "presence, and it is not reachable from the public internet."
            echo
            echo "Provisioning does install an internal-only vhost, so the target"
            echo "answers on its internal hostname over loopback — that is the whole of"
            echo "what responds, and it is how the host checks its own work. There is no"
            echo "public hostname, no TLS certificate, no redirect and no DNS record."
            echo
            echo "No release was built or deployed, no migration ran, no database or"
            echo "role was created, and the target registry is unchanged."
            echo
            echo "Activating the target, giving it a public hostname and deploying"
            echo "its first release are three separate deliberate operations, and"
            echo "none of them is this button."
          } >> "${GITHUB_STEP_SUMMARY}"
