name: Check tits.guru inbound mail health

# Read-only, and unattended: the inbound mail monitor on the production host —
# whether the store takes mail right now, and whether mail the host already
# accepted waits in the shared queue instead of reaching the store: how many
# messages, how long the oldest has waited, and how many were accepted more
# than a day ago and are AT RISK OF LOSS. Anything but a monitor that ran and
# said pass is FAILED or UNKNOWN, never PASS; the last job keeps one GitHub
# issue open while it lasts.
#
# It reaches the host with the monitor's own key, from the
# production-tits-guru-monitor Environment: an account whose one key runs that
# read-only program, as postfix, and nothing else — no shell, no other command,
# no argument (install-mail-inbound-monitor). It never holds the bootstrap
# credential, uploads nothing and runs nothing of this repository on the host.
# Nothing runs it on a schedule: an operator runs it from main. When it runs
# unattended is for production's unified monitoring to decide.
on:
  workflow_dispatch:

permissions:
  contents: read

# Its own group: a check waits for an earlier one, and never displaces a
# pending production operation. It takes no host lock either: it changes
# nothing.
concurrency:
  group: rateguru-mail-inbound-health
  cancel-in-progress: false

jobs:
  # --- main-only control-plane gate (begin) ---
  #
  # Fail-closed, and deliberately a job of its own with NO `environment:`.
  #
  # The production-tits-guru Environment permits `main` and `v*`. `v*` has to be
  # there, because Release to production runs with `github.ref` at the tag — but
  # GitHub matches an Environment's allowlist against the ref of the RUN, and a
  # workflow_dispatch ref may be a tag as well as a branch. So the allowlist
  # alone would also admit a manual dispatch of THIS workflow from a tag, and
  # the workflow definition that then ran would be the one at that tag.
  #
  # A manual production operation is a main-only operation, so anything else is
  # refused here, before a single production job starts. Because this job holds
  # no Environment, a refused run never has those credentials available to it at
  # all — the job that owns them never begins.
  #
  # WHAT THIS IS NOT. It guards against accidental and casual misuse: a tag
  # selected in the Run workflow dropdown, or the habit of dispatching from
  # develop, neither of which can reach a production job any more.
  # It is NOT a boundary against someone who can already create an arbitrary
  # trusted tag, because they would author this very file at that tag. Who may
  # create `v*` is a GitHub tag ruleset, which is a separate permission boundary
  # and the one that actually bounds that case. See
  # infrastructure/runbooks/deployment-targets.md.
  validate-ref:
    name: Refuse any ref but main
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require refs/heads/main
        shell: bash
        env:
          RUN_REF: ${{ github.ref }}
        run: |
          set -Eeuo pipefail

          if [[ "${RUN_REF}" != "refs/heads/main" ]]; then
            echo "A manual production operation runs from main and nowhere else." >&2
            echo "Dispatched ref: ${RUN_REF}" >&2
            echo "Re-run with main selected. New application code reaches production only through Release to production, from a v* tag." >&2
            exit 1
          fi

          echo "Control plane: ${RUN_REF}"
  # --- main-only control-plane gate (end) ---
  monitor:
    name: Run the inbound mail monitor on the production host
    runs-on: ubuntu-24.04

    needs: [validate-ref]

    # The monitor's own Environment: main only, and no approval — it holds the
    # monitor's key and nothing else. The bootstrap credential stays in
    # production-tits-guru, behind its reviewers.
    environment: production-tits-guru-monitor
    timeout-minutes: 10

    outputs:
      status: ${{ steps.monitor.outputs.status }}
      waiting: ${{ steps.monitor.outputs.waiting }}
      risk: ${{ steps.monitor.outputs.risk }}
      oldest: ${{ steps.monitor.outputs.oldest }}

    steps:
      - name: Run the monitor through its one key
        id: monitor
        shell: bash
        env:
          MONITOR_HOST: ${{ vars.DEPLOY_HOST }}
          MONITOR_PORT: ${{ vars.DEPLOY_PORT }}
          MONITOR_SSH_KEY: ${{ secrets.MAIL_MONITOR_SSH_KEY }}
          MONITOR_KNOWN_HOSTS: ${{ secrets.MAIL_MONITOR_KNOWN_HOSTS }}
        run: |
          set -Euo pipefail

          # The verdict is UNKNOWN until the monitor itself says otherwise.
          status=unknown waiting="" risk="" oldest=""
          finish() {
            {
              echo "status=${status}"
              echo "waiting=${waiting}"
              echo "risk=${risk}"
              echo "oldest=${oldest}"
            } >> "${GITHUB_OUTPUT}"
            {
              echo "## tits-guru inbound mail monitor"
              echo
              echo "**${status^^}** — $1"
              echo
              echo "Counts and ages only; no address and no message is ever shown."
            } >> "${GITHUB_STEP_SUMMARY}"
            [[ "${status}" == pass ]]
            exit $?
          }

          port="${MONITOR_PORT:-22}"
          if [[ -z "${MONITOR_HOST:-}" || -z "${MONITOR_SSH_KEY:-}" || -z "${MONITOR_KNOWN_HOSTS:-}" ]] \
            || [[ ! "${port}" =~ ^[0-9]{1,5}$ ]]
          then
            finish "the production-tits-guru-monitor Environment does not hold the monitor's host, key and known host — the check could not run."
          fi

          key="${RUNNER_TEMP}/rateguru_mail_monitor_key"
          known_hosts="${RUNNER_TEMP}/rateguru_mail_monitor_known_hosts"
          trap 'rm -f "${key}" "${known_hosts}"' EXIT
          install -m 0600 /dev/null "${key}"
          install -m 0600 /dev/null "${known_hosts}"
          printf '%s\n' "${MONITOR_SSH_KEY}" > "${key}"
          printf '%s\n' "${MONITOR_KNOWN_HOSTS}" > "${known_hosts}"

          # No remote command: the key's own forced command is all it can run,
          # whatever is asked. The account is fixed, never a variable.
          output="$(ssh \
            -p "${port}" \
            -i "${key}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${known_hosts}" \
            -T \
            "rateguru-mail-monitor@${MONITOR_HOST}" 2>&1 </dev/null)"
          monitor_status=$?
          printf '%s\n' "${output}" | grep -v '^RATEGURU_MAIL_INBOUND_MONITOR_RESULT=' || true

          results="$(grep -c '^RATEGURU_MAIL_INBOUND_MONITOR_RESULT=' <<<"${output}" || true)"
          if [[ "${results}" != 1 ]]; then
            finish "the monitor did not report (ssh exited ${monitor_status}; ${results} result line(s)) — whether accepted inbound mail is at risk is not known."
          fi
          json="$(grep '^RATEGURU_MAIL_INBOUND_MONITOR_RESULT=' <<<"${output}")"
          json="${json#RATEGURU_MAIL_INBOUND_MONITOR_RESULT=}"

          if ! jq -e '
              type == "object" and .target == "tits-guru" and .mode == "monitor"
              and (.status == "pass" or .status == "fail")
              and (.queue == null or (.queue | type == "object"
                   and ([.waiting, .at_risk, .oldest_seconds] | all(type == "number" and . >= 0 and . == floor))))
            ' <<<"${json}" >/dev/null 2>&1
          then
            finish "the monitor's report is not a report of the tits-guru inbound mail monitor — nothing can be concluded from it."
          fi

          waiting="$(jq -r '.queue.waiting // ""' <<<"${json}")"
          risk="$(jq -r '.queue.at_risk // ""' <<<"${json}")"
          oldest="$(jq -r '.queue.oldest_seconds // ""' <<<"${json}")"

          # PASS needs all three: the monitor said pass, it exited 0, and it
          # read the queue and found nothing waiting.
          if [[ "$(jq -r '.status' <<<"${json}")" == pass && "${monitor_status}" == 0 && "${waiting}" == 0 ]]; then
            status=pass
            finish "the store takes mail and no accepted inbound mail waits in the shared queue."
          fi
          if [[ "$(jq -r '.status' <<<"${json}")" == pass ]]; then
            finish "the monitor said pass, but exited ${monitor_status} or left its queue reading out — not trusted as a pass."
          fi
          status=fail
          if [[ -n "${risk}" ]] && (( risk > 0 )); then
            finish "accepted inbound mail is AT RISK OF LOSS: ${risk} message(s) accepted more than a day ago are still not stored. Restore the store now — infrastructure/runbooks/mail-inbound.md, \"When the health check fails\"."
          fi
          finish "the inbound store, or accepted inbound mail, needs attention — the log above says which check failed (infrastructure/runbooks/mail-inbound.md, \"When the health check fails\")."

  # A failed health check opens one issue, or adds to the one already open, so
  # the operator hears of it however the run was started; a passing one closes
  # it. Counts only: no address, no message. This job holds no Environment and
  # no secret.
  report:
    name: Keep the inbound mail health issue current
    runs-on: ubuntu-24.04
    needs: [validate-ref, monitor]
    if: ${{ always() && needs.validate-ref.result == 'success' && needs.monitor.result != 'skipped' }}
    timeout-minutes: 5

    permissions:
      issues: write

    steps:
      - name: Open, update or close the issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MONITOR_STATUS: ${{ needs.monitor.outputs.status }}
          WAITING: ${{ needs.monitor.outputs.waiting }}
          RISK: ${{ needs.monitor.outputs.risk }}
          OLDEST: ${{ needs.monitor.outputs.oldest }}
        run: |
          set -Eeuo pipefail

          title="tits-guru inbound mail health check failed"
          open_issue="$(gh api "repos/${REPOSITORY}/issues?state=open&per_page=100" \
            | jq -r --arg title "${title}" 'map(select(.title == $title and (has("pull_request") | not))) | .[0].number // empty')"

          # PASS only when the monitor itself said pass; anything else — a
          # failure, a job that never reported, a cancelled one — is not.
          if [[ "${MONITOR_STATUS:-}" == pass ]]; then
            if [[ -n "${open_issue}" ]]; then
              gh api "repos/${REPOSITORY}/issues/${open_issue}/comments" -f body="The inbound mail health check passes again: the store takes mail and no accepted inbound mail waits in the shared queue. ${RUN_URL}" >/dev/null
              gh api -X PATCH "repos/${REPOSITORY}/issues/${open_issue}" -f state=closed -f state_reason=completed >/dev/null
              echo "Closed issue #${open_issue}."
            fi
            exit 0
          fi

          # An output the check never wrote arrives empty, or not at all.
          waiting="${WAITING:-}" risk="${RISK:-0}" oldest="${OLDEST:-0}"

          if [[ "${MONITOR_STATUS:-}" != fail || -z "${waiting}" ]]; then
            finding="UNKNOWN: the monitor did not report, or could not read the shared queue — whether accepted inbound mail is at risk is not known."
          elif (( risk > 0 )); then
            finding="AT RISK OF LOSS: ${waiting} accepted inbound message(s) wait in the shared queue, ${risk} of them accepted more than a day ago; the oldest has waited $(( oldest / 3600 )) h. The shared queue gives a message up after maximal_queue_lifetime (five days by default), and an inbound message given up is lost."
          elif (( waiting > 0 )); then
            finding="${waiting} accepted inbound message(s) wait in the shared queue instead of reaching the store; the oldest has waited $(( oldest / 3600 )) h."
          else
            finding="No accepted inbound mail waits, but the store or its gate does not verify: new inbound mail may be refused, temporarily."
          fi
          body="${finding} Restore the store as infrastructure/runbooks/mail-inbound.md says under \"When the health check fails\". ${RUN_URL}"

          if [[ -n "${open_issue}" ]]; then
            gh api "repos/${REPOSITORY}/issues/${open_issue}/comments" -f body="${body}" >/dev/null
            echo "Updated issue #${open_issue}."
          else
            gh api "repos/${REPOSITORY}/issues" -f title="${title}" -f body="${body}" >/dev/null
            echo "Opened an issue: ${title}."
          fi
