name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

# A new push to the same branch/PR cancels the still-running outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-style:
    name: Code style (Pint)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, gd, exif
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

  static-analysis:
    name: Architecture & static analysis (PHPStan)
    runs-on: ubuntu-24.04
    outputs:
      architecture-suppressions: ${{ steps.baseline-report.outputs.architecture-suppressions }}
      baseline-delta: ${{ steps.baseline-report.outputs.baseline-delta }}
      baseline-files: ${{ steps.baseline-report.outputs.baseline-files }}
      baseline-findings: ${{ steps.baseline-report.outputs.baseline-findings }}
      baseline-patterns: ${{ steps.baseline-report.outputs.baseline-patterns }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, gd, exif
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare baseline comparison
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:phpstan-baseline.neon" > /tmp/phpstan-base-baseline.neon \
            || touch /tmp/phpstan-base-baseline.neon

      - name: Run baseline-free architecture rules
        run: composer analyse:architecture

      - name: Run PHPStan
        run: composer analyse

      - name: Collect baseline debt
        id: baseline-report
        if: always()
        run: |
          set -o pipefail
          php tools/phpstan/bin/baseline-report.php \
            --base=/tmp/phpstan-base-baseline.neon \
            --github-output="$GITHUB_OUTPUT" \
            | tee phpstan-suppressions.json

      - name: Reject baseline growth
        if: github.event_name == 'pull_request'
        run: composer baseline:guard -- /tmp/phpstan-base-baseline.neon

      - name: Upload PHPStan suppression report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phpstan-suppressions
          path: phpstan-suppressions.json
          retention-days: 14

  frontend-build:
    name: Frontend build (Vite)
    runs-on: ubuntu-24.04
    outputs:
      files: ${{ steps.build-metrics.outputs.files }}
      size: ${{ steps.build-metrics.outputs.size }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The admin panel's Filament theme builds on Filament's own theme CSS,
      # which ships inside vendor/filament, so the PHP dependencies have to be
      # installed before Vite can compile it.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, gd, exif
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Collect build metrics
        id: build-metrics
        run: |
          echo "files=$(find public/build -type f | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "size=$(du -sh public/build | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload built assets
        uses: actions/upload-artifact@v7
        with:
          name: public-build
          path: public/build
          retention-days: 1

  tests:
    name: Tests (Pest + PostgreSQL)
    runs-on: ubuntu-24.04
    # The cap exists so a hung external download can never occupy a runner for
    # the 6-hour default — it is not meant to bound a healthy run. The last
    # green runs measured ~12 minutes here, and the suite grows as the product
    # does, so the cap sits well clear of a healthy run rather than tracking
    # it: it should only ever fire for something genuinely stuck, never for an
    # ordinary slow runner.
    timeout-minutes: 60
    needs: frontend-build
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: rateguru_test
      DB_USERNAME: rateguru
      DB_PASSWORD: rateguru
      # The commit this branch is measured against, for the architecture scope
      # guards. Empty on a push event, where those guards correctly skip.
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    outputs:
      assertions: ${{ steps.test-results.outputs.assertions }}
      migrations: ${{ steps.postgres-migrations.outputs.migrations }}
      tests: ${{ steps.test-results.outputs.tests }}
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: rateguru_test
          POSTGRES_USER: rateguru
          POSTGRES_PASSWORD: rateguru
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rateguru -d rateguru_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      # Depth 2, not the default 1. On a pull_request event the checkout is a
      # merge commit whose first parent is the base branch tip, so two commits
      # is exactly enough for the architecture scope guards to diff this branch
      # against its base — and a scope guard that silently skips on every pull
      # request protects nothing.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_pgsql, gd, exif
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Download built assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: public-build
          path: public/build

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      # The Browser test suite (Pest v4 browser tests) drives a real Chromium
      # through Playwright; without it `php artisan test` aborts at startup.
      # Browser binaries are cached by lockfile hash: on a cache hit
      # `npx playwright install` skips the CDN download entirely, so a flaky
      # CDN only ever hurts the first run after a Playwright version bump.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright
        timeout-minutes: 10
        run: |
          npm ci --ignore-scripts
          npx playwright install chromium

      # Split out of the browser install and made best-effort on purpose:
      # on the ubuntu-24.04 image every job is pinned to, every hard Chromium library is
      # already present, and `install-deps` only adds optional international
      # font packages — via apt, whose Azure mirror proved capable of
      # trickling for hours. A down mirror must not block the DOM-based
      # browser tests; if a future runner image ever drops a hard library,
      # the test step itself fails loudly with a Chromium launch error, so
      # nothing is silently masked.
      - name: Install Playwright system dependencies (best effort)
        timeout-minutes: 6
        continue-on-error: true
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "15";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-rateguru-ci >/dev/null
          sudo npx playwright install-deps chromium

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run PostgreSQL migration and seed smoke check
        id: postgres-migrations
        run: |
          set -o pipefail
          php artisan migrate:fresh --seed --force
          php artisan migrate:status --no-ansi \
            | awk '/ Ran / { count++ } END { print "migrations=" count+0 }' \
            >> "$GITHUB_OUTPUT"

      - name: Run PostgreSQL tests
        id: pest
        run: php artisan test --parallel --exclude-testsuite=Architecture --log-junit junit.xml

      - name: Collect test results
        id: test-results
        if: always()
        run: |
          php -r '
          $tests = "n/a";
          $assertions = "n/a";

          if (is_file("junit.xml") && ($junit = simplexml_load_file("junit.xml")) !== false) {
              if (isset($junit["tests"])) {
                  $tests = (string) $junit["tests"];
                  $assertions = (string) ($junit["assertions"] ?? $assertions);
              } elseif (isset($junit->testsuite[0])) {
                  $totalTests = 0;
                  $totalAssertions = 0;

                  foreach ($junit->testsuite as $suite) {
                      $totalTests += (int) ($suite["tests"] ?? 0);
                      $totalAssertions += (int) ($suite["assertions"] ?? 0);
                  }

                  $tests = (string) $totalTests;
                  $assertions = (string) $totalAssertions;
              }
          }

          file_put_contents(getenv("GITHUB_OUTPUT"), sprintf(
              "tests=%s\nassertions=%s\n",
              $tests,
              $assertions,
          ), FILE_APPEND);
          '

      - name: Upload Laravel logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: laravel-logs
          path: storage/logs
          retention-days: 5

  tests-architecture:
    name: Architecture tests (Pest, shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    # Its own job, because the Architecture suite is its own kind of test: it
    # reads committed files and drives real shell subprocesses against a
    # simulated host, and not one of its tests touches the database. Run
    # inside Feature it was re-executed by both compatibility jobs, where it
    # could not discover anything a database engine might disagree about, and a
    # failure there said "MariaDB" when it meant "a shell script changed".
    #
    # No `needs`: the suite reads the checkout only and never downloads the
    # built assets, and this is the longest job of the run, so waiting for the
    # frontend build would only push the whole run's finish out by that much.
    #
    # Four legs, each running a quarter of the test FILES, balanced by the
    # per-file timings committed in tests/.pest/shards.json. Pest hands whole
    # files to its workers in alphabetical order, so inside one job the heavy
    # files that sort late set the finish time however many workers there are;
    # legs are the only lever that moves them. A red leg must not cancel the
    # others: one push should report every failure it has.
    #
    # The cap exists so a hung external download can never occupy a runner for
    # the 6-hour default — it is not meant to bound a healthy run.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: rateguru_test
      DB_USERNAME: rateguru
      DB_PASSWORD: rateguru
      # The commit this branch is measured against, for the architecture scope
      # guards. Empty on a push event, where those guards correctly skip.
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    services:
      # No Architecture test queries the database, but every test in
      # tests/Feature is bound to RefreshDatabase by tests/Pest.php, so the
      # connection has to be real for setUp to succeed.
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: rateguru_test
          POSTGRES_USER: rateguru
          POSTGRES_PASSWORD: rateguru
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rateguru -d rateguru_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      # Depth 2, not the default 1. On a pull_request event the checkout is a
      # merge commit whose first parent is the base branch tip, so two commits
      # is exactly enough for the architecture scope guards to diff this branch
      # against its base — and a scope guard that silently skips on every pull
      # request protects nothing.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_pgsql, gd, exif
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # The target-aware offsite backup Architecture tests exercise a real
      # `rclone` binary (against a local-backend config, never real B2) to
      # get genuine --immutable/check/purge semantics instead of a stub.
      # Installed from the pinned, checksum-verified GitHub release .deb —
      # never from apt: the Azure Ubuntu mirror proved capable of stalling or
      # trickling for hours (regional outages), while dpkg -i needs no network
      # at all. Same pin-and-verify philosophy as the mail-capture binaries.
      # Bump RCLONE_VERSION and RCLONE_DEB_SHA256 together.
      - name: Install rclone
        timeout-minutes: 5
        env:
          RCLONE_VERSION: v1.75.0
          RCLONE_DEB_SHA256: 266598b5c66a42b821571332013cc85a88ffcff8939cf0643861c8d033dd3a4a
        run: |
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 -o /tmp/rclone.deb \
            "https://github.com/rclone/rclone/releases/download/${RCLONE_VERSION}/rclone-${RCLONE_VERSION}-linux-amd64.deb"
          echo "${RCLONE_DEB_SHA256}  /tmp/rclone.deb" | sha256sum --check -
          sudo dpkg -i /tmp/rclone.deb

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --force

      # The same suite takes anywhere between 11 and 18 minutes depending on
      # which hardware GitHub hands out, so a duration means nothing without
      # the CPU it ran on. Recorded in the log, next to the timings.
      - name: Record runner hardware
        run: |
          lscpu | grep -E '^(Model name|CPU\(s\)|Thread\(s\) per core)'
          nproc

      # Pest is called directly, not through `php artisan test`: the shard
      # planner lists the suite in a child process that rejects the options
      # artisan adds, and `--processes` for the same reason, so the worker count
      # is ParaTest's default of one per vCPU. Every leg reads the same checkout
      # and the same tests/.pest/shards.json, so every leg computes the same
      # partition. The output is kept for the check that follows.
      - name: Run Architecture tests
        id: architecture
        run: |
          set -o pipefail
          php vendor/bin/pest --parallel --testsuite=Architecture \
            --shard=${{ matrix.shard }}/${{ strategy.job-total }} \
            --log-junit architecture-junit.xml | tee architecture-pest.log

      # The planner decides what a leg runs from Pest's own test listing. If that
      # listing ever stopped matching what the planner expects, every leg would
      # silently run the whole suite — green, and four times as slow.
      #
      # This step used to be `grep -E 'files? ran, out of [1-9][0-9]*'`, which
      # matches "40 files ran, out of 40" exactly as happily as "11 files ran, out
      # of 40": the numbers were printed and never read, so the failure it was
      # meant to catch passed. The validator reads them, refuses a leg that ran
      # nothing or ran everything, and writes them down for the cross-leg check
      # below — which is the only place "the parts are the whole, once each" can be
      # established. It writes the NAMES of the classes it ran, from its own JUnit,
      # because counts alone cannot see two legs overlapping on one file while a
      # third file goes unrun: the sums still come out right. Its own negative cases
      # are covered by tests/Feature/Architecture/ArchitectureShardPartitionGuardTest.php.
      #
      # A stale timings file costs balance, not coverage; it stays a warning.
      - name: Check the shard ran its share
        run: |
          php tools/pest/bin/verify-shard-partition.php leg \
            architecture-pest.log architecture-junit.xml \
            | tee "shard-${{ matrix.shard }}.json"
          if grep -q 'shards.json\] file is out of date' architecture-pest.log; then
            echo '::warning::tests/.pest/shards.json is out of date. Regenerate it with tools/pest/bin/shards-from-junit.php from the architecture-junit-* artifacts of a green develop run.'
          fi

      - name: Upload shard partition report
        uses: actions/upload-artifact@v7
        with:
          name: architecture-shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.json
          retention-days: 7

      # Per-file durations are the only way to tell a slow runner from a slow
      # change, to see which files form the tail of a leg, and to rebalance the
      # legs — so every leg keeps its report, red runs included.
      - name: Upload Architecture JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: architecture-junit-${{ matrix.shard }}
          path: architecture-junit.xml
          retention-days: 30

  # Deliberately a job of its own, and deliberately NOT `if: always()`: a leg
  # that failed proves nothing about the partition, and this must not turn a red
  # suite into a second, confusing failure. It answers one question the legs
  # cannot answer individually — did the four of them, between them, run every
  # file exactly once.
  verify-shard-partition:
    name: Architecture shards partition the suite
    runs-on: ubuntu-24.04
    needs: [tests-architecture]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Download shard partition reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: architecture-shard-*
          merge-multiple: true

      - name: Verify the legs partition the suite
        run: php tools/pest/bin/verify-shard-partition.php combined shard-*.json

  migrations-mariadb:
    name: Compatibility (MariaDB)
    runs-on: ubuntu-24.04
    # The cap exists so a hung external download can never occupy a runner for
    # the 6-hour default — it is not meant to bound a healthy run. The last
    # green runs measured ~24 minutes here, and the suite grows as the product
    # does, so the cap sits well clear of a healthy run rather than tracking
    # it: it should only ever fire for something genuinely stuck, never for an
    # ordinary slow runner.
    timeout-minutes: 60
    needs: frontend-build
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: rateguru_test
      DB_USERNAME: rateguru
      DB_PASSWORD: rateguru
    outputs:
      migrations: ${{ steps.migration-metrics.outputs.migrations }}
      rollback: ${{ steps.rollback.outcome }}
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: rateguru_test
          MARIADB_USER: rateguru
          MARIADB_PASSWORD: rateguru
          MARIADB_ROOT_PASSWORD: rateguru-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, gd, exif
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Download built assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: public-build
          path: public/build

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --force

      # A parallel run gives every worker its own database: Laravel creates
      # `rateguru_test_test_<token>` the first time a worker connects. The
      # MariaDB image grants the test user rights on exactly one database, so
      # the grant is widened to the family those workers use — and to nothing
      # else. Run through the service container's own client, so the job does
      # not depend on which MySQL/MariaDB client the runner image happens to
      # ship.
      - name: Allow per-worker test databases
        run: |
          set -Eeuo pipefail
          container="$(docker ps --filter "ancestor=mariadb:11.4" --format '{{.ID}}' | head -1)"
          test -n "${container}"
          docker exec "${container}" mariadb -uroot -prateguru-root \
            -e "GRANT ALL PRIVILEGES ON \`rateguru\\_test%\`.* TO 'rateguru'@'%'; FLUSH PRIVILEGES;"

      - name: Run MariaDB compatibility tests
        run: composer test:mariadb

      - name: Run MariaDB migration smoke
        run: php artisan migrate:fresh --seed --force

      - name: Collect MariaDB migration metrics
        id: migration-metrics
        run: |
          set -o pipefail
          php artisan migrate:status --no-ansi \
            | awk '/ Ran / { count++ } END { print "migrations=" count+0 }' \
            >> "$GITHUB_OUTPUT"

      - name: Check rollback path
        id: rollback
        run: |
          php artisan migrate:reset --force
          php artisan migrate --force

  tests-sqlite:
    name: Compatibility (SQLite)
    runs-on: ubuntu-24.04
    # The cap exists so a hung external download can never occupy a runner for
    # the 6-hour default — it is not meant to bound a healthy run. The last
    # green runs measured ~28 minutes here, and the suite grows as the product
    # does, so the cap sits well clear of a healthy run rather than tracking
    # it: it should only ever fire for something genuinely stuck, never for an
    # ordinary slow runner.
    timeout-minutes: 60
    needs: frontend-build
    outputs:
      migrations: ${{ steps.migration-metrics.outputs.migrations }}
      rollback: ${{ steps.rollback.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, gd, exif
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Download built assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: public-build
          path: public/build

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --force
          touch database/database.sqlite

      - name: Run SQLite compatibility tests
        run: composer test:sqlite

      - name: Run SQLite migration smoke
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate:fresh --seed --force

      - name: Collect SQLite migration metrics
        id: migration-metrics
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: |
          set -o pipefail
          php artisan migrate:status --no-ansi \
            | awk '/ Ran / { count++ } END { print "migrations=" count+0 }' \
            >> "$GITHUB_OUTPUT"

      - name: Check rollback path
        id: rollback
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: |
          php artisan migrate:reset --force
          php artisan migrate --force

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    outputs:
      composer-advisories: ${{ steps.dependency-metrics.outputs.composer-advisories }}
      composer-packages: ${{ steps.dependency-metrics.outputs.composer-packages }}
      npm-critical: ${{ steps.dependency-metrics.outputs.npm-critical }}
      npm-high: ${{ steps.dependency-metrics.outputs.npm-high }}
      npm-packages: ${{ steps.dependency-metrics.outputs.npm-packages }}
      npm-vulnerabilities: ${{ steps.dependency-metrics.outputs.npm-vulnerabilities }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Audit Composer dependencies
        # --locked: audits composer.lock directly, no vendor install needed
        shell: bash
        run: |
          set -o pipefail
          composer audit --locked --format=json | tee composer-audit.json

      - name: Audit npm dependencies
        if: always()
        shell: bash
        run: |
          set -o pipefail
          npm ci --ignore-scripts
          npm audit --audit-level=high --json | tee npm-audit.json

      - name: Collect dependency metrics
        id: dependency-metrics
        if: always()
        run: |
          php -r '
          $lock = json_decode(file_get_contents("composer.lock"), true) ?: [];
          $audit = is_file("composer-audit.json")
              ? (json_decode(file_get_contents("composer-audit.json"), true) ?: [])
              : [];
          $packages = count($lock["packages"] ?? []) + count($lock["packages-dev"] ?? []);
          $advisories = 0;

          foreach ($audit["advisories"] ?? [] as $items) {
              $advisories += is_array($items) ? count($items) : 0;
          }

          file_put_contents(getenv("GITHUB_OUTPUT"), sprintf(
              "composer-packages=%d\ncomposer-advisories=%d\n",
              $packages,
              $advisories,
          ), FILE_APPEND);
          '
          node -e '
          const fs = require("fs");
          const report = fs.existsSync("npm-audit.json")
            ? JSON.parse(fs.readFileSync("npm-audit.json", "utf8"))
            : {};
          const dependencies = report.metadata?.dependencies ?? {};
          const vulnerabilities = report.metadata?.vulnerabilities ?? {};
          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            `npm-packages=${dependencies.total ?? "n/a"}`,
            `npm-vulnerabilities=${vulnerabilities.total ?? "n/a"}`,
            `npm-high=${vulnerabilities.high ?? "n/a"}`,
            `npm-critical=${vulnerabilities.critical ?? "n/a"}`,
            "",
          ].join("\n"));
          '

  ci-summary:
    name: Summary
    if: always()
    runs-on: ubuntu-24.04
    needs:
      - code-style
      - static-analysis
      - frontend-build
      - tests
      - tests-architecture
      - migrations-mariadb
      - tests-sqlite
      - dependency-audit
      - verify-shard-partition
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # The Architecture suite runs as several legs, and a matrix job has no
      # usable aggregate output, so the test count is read back from the legs'
      # JUnit reports. Missing reports (a cancelled leg) leave the count n/a and
      # the summary is still published.
      - name: Download Architecture JUnit reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: architecture-junit-*
          path: architecture-junit

      - name: Publish CI results
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CODE_STYLE_RESULT: ${{ needs['code-style'].result }}
          STATIC_ANALYSIS_RESULT: ${{ needs['static-analysis'].result }}
          ARCHITECTURE_SUPPRESSIONS: ${{ needs['static-analysis'].outputs.architecture-suppressions }}
          BASELINE_DELTA: ${{ needs['static-analysis'].outputs.baseline-delta }}
          BASELINE_FILES: ${{ needs['static-analysis'].outputs.baseline-files }}
          BASELINE_FINDINGS: ${{ needs['static-analysis'].outputs.baseline-findings }}
          BASELINE_PATTERNS: ${{ needs['static-analysis'].outputs.baseline-patterns }}
          FRONTEND_BUILD_RESULT: ${{ needs['frontend-build'].result }}
          BUILD_FILES: ${{ needs['frontend-build'].outputs.files }}
          BUILD_SIZE: ${{ needs['frontend-build'].outputs.size }}
          TESTS_RESULT: ${{ needs.tests.result }}
          TEST_COUNT: ${{ needs.tests.outputs.tests }}
          ASSERTION_COUNT: ${{ needs.tests.outputs.assertions }}
          POSTGRES_MIGRATIONS: ${{ needs.tests.outputs.migrations }}
          ARCHITECTURE_RESULT: ${{ needs['tests-architecture'].result }}
          MARIADB_RESULT: ${{ needs['migrations-mariadb'].result }}
          MARIADB_MIGRATIONS: ${{ needs['migrations-mariadb'].outputs.migrations }}
          MARIADB_ROLLBACK: ${{ needs['migrations-mariadb'].outputs.rollback }}
          SQLITE_RESULT: ${{ needs['tests-sqlite'].result }}
          SQLITE_MIGRATIONS: ${{ needs['tests-sqlite'].outputs.migrations }}
          SQLITE_ROLLBACK: ${{ needs['tests-sqlite'].outputs.rollback }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs['dependency-audit'].result }}
          COMPOSER_PACKAGES: ${{ needs['dependency-audit'].outputs.composer-packages }}
          COMPOSER_ADVISORIES: ${{ needs['dependency-audit'].outputs.composer-advisories }}
          NPM_PACKAGES: ${{ needs['dependency-audit'].outputs.npm-packages }}
          NPM_VULNERABILITIES: ${{ needs['dependency-audit'].outputs.npm-vulnerabilities }}
          NPM_HIGH: ${{ needs['dependency-audit'].outputs.npm-high }}
          NPM_CRITICAL: ${{ needs['dependency-audit'].outputs.npm-critical }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- rateguru-ci-summary -->';
            const icon = (result) => ({
              success: '✅',
              failure: '❌',
              cancelled: '⚪',
              skipped: '➖',
            }[result] ?? '❔');
            const details = (result, successText) =>
              result === 'success' ? successText : `${icon(result)} ${result} · see workflow log`;
            const value = (name) => process.env[name] || 'n/a';
            // Every <testcase> in every downloaded Architecture report, one
            // report per leg; counted without an XML parser on purpose.
            const architectureTests = (() => {
              const path = require('path');
              const reports = [];
              const walk = (dir) => {
                for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                  const full = path.join(dir, entry.name);
                  if (entry.isDirectory()) walk(full);
                  else if (entry.name.endsWith('.xml')) reports.push(full);
                }
              };
              try { walk('architecture-junit'); } catch { return 'n/a'; }
              if (reports.length === 0) return 'n/a';
              return String(reports.reduce((sum, report) =>
                sum + (fs.readFileSync(report, 'utf8').match(/<testcase\b/g) || []).length, 0));
            })();
            const tests = process.env.TEST_COUNT || 'n/a';
            const assertions = process.env.ASSERTION_COUNT || 'n/a';
            const baselineFindings = value('BASELINE_FINDINGS');
            const baselinePatterns = value('BASELINE_PATTERNS');
            const baselineFiles = value('BASELINE_FILES');
            const baselineDelta = value('BASELINE_DELTA');
            const generatedAt = new Date().toISOString();
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const lines = [
              marker,
              '## RateGuru CI',
              '',
              `_Updated: ${generatedAt}_`,
              '',
              '| Check | Summary |',
              '|---|---|',
              `| Code style | ${details(process.env.CODE_STYLE_RESULT, 'Pint: no changes required')} |`,
              `| Architecture & static analysis | ${details(process.env.STATIC_ANALYSIS_RESULT, 'Architecture: 0 violations · PHPStan: 0 new errors')} |`,
              `| PHPStan suppressions | ${baselineFindings} findings · ${baselinePatterns} patterns · ${baselineFiles} files · delta ${baselineDelta} |`,
              `| Architecture findings in baseline | ${value('ARCHITECTURE_SUPPRESSIONS')} |`,
              `| Frontend build | ${details(process.env.FRONTEND_BUILD_RESULT, `${value('BUILD_FILES')} files · ${value('BUILD_SIZE')}`)} |`,
              `| Tests & PostgreSQL | ${details(process.env.TESTS_RESULT, `${tests} tests · ${assertions} assertions · ${value('POSTGRES_MIGRATIONS')} migrations · seed passed`)} |`,
              `| Architecture tests (Pest) | ${details(process.env.ARCHITECTURE_RESULT, `${architectureTests} tests · 4 shards`)} |`,
              `| SQLite compatibility | ${details(process.env.SQLITE_RESULT, `Unit + Feature passed · ${value('SQLITE_MIGRATIONS')} migrations · seed passed · rollback ${value('SQLITE_ROLLBACK')}`)} |`,
              `| MariaDB compatibility | ${details(process.env.MARIADB_RESULT, `Unit + Feature passed · ${value('MARIADB_MIGRATIONS')} migrations · seed passed · rollback ${value('MARIADB_ROLLBACK')}`)} |`,
              `| Dependencies | ${details(process.env.DEPENDENCY_AUDIT_RESULT, `Composer: ${value('COMPOSER_PACKAGES')} packages · ${value('COMPOSER_ADVISORIES')} advisories; npm: ${value('NPM_PACKAGES')} packages · ${value('NPM_VULNERABILITIES')} vulnerabilities (${value('NPM_HIGH')} high / ${value('NPM_CRITICAL')} critical)`)} |`,
              '',
              `[Open workflow run](${runUrl})`,
            ];
            const body = lines.join('\n');

            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${body.replace(`${marker}\n`, '')}\n`);

            if (context.eventName !== 'pull_request') {
              return;
            }

            const pullRequest = context.payload.pull_request;

            if (pullRequest.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.info('Skipping PR comment for an external fork.');
              return;
            }

            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                per_page: 100,
              });
              const existingComments = comments.filter((comment) =>
                comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker),
              );

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                body,
              });

              await Promise.all(existingComments.map((comment) =>
                github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                }),
              ));
            } catch (error) {
              core.warning(`Could not publish the PR summary: ${error.message}`);
            }

      - name: Verify CI result
        env:
          CODE_STYLE_RESULT: ${{ needs['code-style'].result }}
          STATIC_ANALYSIS_RESULT: ${{ needs['static-analysis'].result }}
          FRONTEND_BUILD_RESULT: ${{ needs['frontend-build'].result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          ARCHITECTURE_RESULT: ${{ needs['tests-architecture'].result }}
          MARIADB_RESULT: ${{ needs['migrations-mariadb'].result }}
          SQLITE_RESULT: ${{ needs['tests-sqlite'].result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs['dependency-audit'].result }}
          SHARD_PARTITION_RESULT: ${{ needs['verify-shard-partition'].result }}
        run: |
          for result in \
            "$SHARD_PARTITION_RESULT" \
            "$CODE_STYLE_RESULT" \
            "$STATIC_ANALYSIS_RESULT" \
            "$FRONTEND_BUILD_RESULT" \
            "$TESTS_RESULT" \
            "$ARCHITECTURE_RESULT" \
            "$MARIADB_RESULT" \
            "$SQLITE_RESULT" \
            "$DEPENDENCY_AUDIT_RESULT"
          do
            if [ "$result" != 'success' ]; then
              echo "At least one CI job did not succeed."
              exit 1
            fi
          done
