name: Verify RateGuru infrastructure
description: >-
  Run the read-only infrastructure verification of one deployment target on its
  host, from a temporary trusted bundle — and nothing else.

# Transport and invocation only.
#
# infrastructure/scripts/verify-infrastructure owns every decision: which
# contracts the target's current reviewed state requires, which are deferred,
# which do not apply, and what each primitive's verdict means. None of that is
# reproduced here. This action uploads the trusted infrastructure/ tree, runs
# that one command as root, prints its whole report, checks there is exactly
# one well-formed result, writes its group table into the job summary, and
# removes everything it uploaded.
#
# READ-ONLY. It never mutates the host: it carries no material, installs
# nothing and runs no mode of anything but verification. Its only writes are
# the temporary bundle it uploads and removes again.
#
# CREDENTIAL. The privileged BOOTSTRAP credential, because the authoritative
# read-only checks inspect root-owned configuration and key material. Never the
# deploy credential, and no fallback between them.
#
# CALLER REQUIREMENT: a Bash 4.4+ runner. Remote argv is quoted with
# ${array[@]@Q}, as the other operational actions here quote theirs, so a caller
# runs this on `runs-on: ubuntu-24.04`.

inputs:
  deployment-target:
    required: true
    description: >-
      Deployment target ID from the RateGuru target registry. The registry, not
      this input, decides its environment class and lifecycle.

  environment:
    required: true
    description: >-
      Environment class the caller verifies: staging or production. Checked
      against nothing but its own vocabulary here; the server-side verifier
      reads the target's real class from the registry.

  bootstrap-host:
    required: true
    description: SSH hostname or IP of the host the target lives on.

  bootstrap-port:
    required: false
    default: "22"
    description: SSH server port

  bootstrap-user:
    required: true
    description: >-
      Privileged bootstrap user. Must be root, or hold passwordless
      non-interactive sudo.

  bootstrap-ssh-key:
    required: true
    description: Privileged bootstrap SSH private key, separate from any deployment key

  bootstrap-known-hosts:
    required: true
    description: >-
      Verified known_hosts entry for the host. Strict host key checking is
      non-negotiable: no TOFU, no relaxed policy, no password fallback.

outputs:
  status:
    description: "pass or fail, from the verifier's machine-readable result"
    value: ${{ steps.verify.outputs.status }}

  pass:
    description: Checks passed
    value: ${{ steps.verify.outputs.pass }}

  fail:
    description: Checks the current state requires that failed
    value: ${{ steps.verify.outputs.fail }}

  deferred:
    description: Checks deliberately not required in the target's current reviewed state
    value: ${{ steps.verify.outputs.deferred }}

runs:
  using: composite

  steps:
    - name: Validate fixed caller inputs
      shell: bash
      env:
        DEPLOYMENT_TARGET: ${{ inputs.deployment-target }}
        ENVIRONMENT: ${{ inputs.environment }}
        BOOTSTRAP_HOST: ${{ inputs.bootstrap-host }}
        BOOTSTRAP_PORT: ${{ inputs.bootstrap-port }}
        BOOTSTRAP_USER: ${{ inputs.bootstrap-user }}
        BOOTSTRAP_KEY_PRESENT: ${{ inputs.bootstrap-ssh-key != '' }}
        BOOTSTRAP_KNOWN_HOSTS_PRESENT: ${{ inputs.bootstrap-known-hosts != '' }}
      run: |
        set -Eeuo pipefail

        target_regex='^[a-z0-9]+(-[a-z0-9]+)*$'

        [[ "${DEPLOYMENT_TARGET}" =~ ${target_regex} ]] || {
          echo "Invalid deployment target: ${DEPLOYMENT_TARGET}" >&2
          exit 1
        }

        case "${ENVIRONMENT}" in
          staging|production) ;;
          *)
            echo "Infrastructure verification runs for staging or production only (got: ${ENVIRONMENT})." >&2
            exit 1
            ;;
        esac

        # 10# forces decimal: a leading-zero port read as octal would abort
        # (( )) and be mistaken for a passing condition by the || chain.
        if [[ ! "${BOOTSTRAP_PORT}" =~ ^[0-9]{1,5}$ ]] \
          || (( 10#${BOOTSTRAP_PORT} < 1 )) \
          || (( 10#${BOOTSTRAP_PORT} > 65535 ))
        then
          echo "Invalid bootstrap port (expected 1-65535): ${BOOTSTRAP_PORT}" >&2
          exit 1
        fi

        for required_var in BOOTSTRAP_HOST BOOTSTRAP_USER; do
          if [[ -z "${!required_var}" ]]; then
            echo "${required_var} is not configured for the ${ENVIRONMENT} environment" >&2
            exit 1
          fi
        done

        if [[ "${BOOTSTRAP_KEY_PRESENT}" != "true" ]] \
          || [[ "${BOOTSTRAP_KNOWN_HOSTS_PRESENT}" != "true" ]]
        then
          echo "This environment has no bootstrap SSH credential." >&2
          echo "Verification reads root-owned configuration and key material; it refuses to fall back to a deployment key, which is restricted to the deploy wrappers." >&2
          exit 1
        fi

    - name: Configure bootstrap SSH
      shell: bash
      env:
        BOOTSTRAP_SSH_KEY: ${{ inputs.bootstrap-ssh-key }}
        BOOTSTRAP_KNOWN_HOSTS: ${{ inputs.bootstrap-known-hosts }}
      run: |
        set -Eeuo pipefail

        key_path="${RUNNER_TEMP}/rateguru_verify_key"
        known_hosts_path="${RUNNER_TEMP}/rateguru_verify_known_hosts"

        install -m 0600 /dev/null "${key_path}"
        install -m 0600 /dev/null "${known_hosts_path}"

        printf '%s\n' "${BOOTSTRAP_SSH_KEY}" > "${key_path}"
        printf '%s\n' "${BOOTSTRAP_KNOWN_HOSTS}" > "${known_hosts_path}"

        ssh-keygen -y -f "${key_path}" >/dev/null

        {
          echo "RATEGURU_BOOTSTRAP_SSH_KEY_PATH=${key_path}"
          echo "RATEGURU_BOOTSTRAP_KNOWN_HOSTS_PATH=${known_hosts_path}"
        } >> "${GITHUB_ENV}"

    - name: Verify privileged access on the host
      shell: bash
      env:
        BOOTSTRAP_HOST: ${{ inputs.bootstrap-host }}
        BOOTSTRAP_PORT: ${{ inputs.bootstrap-port }}
        BOOTSTRAP_USER: ${{ inputs.bootstrap-user }}
      run: |
        set -Eeuo pipefail

        ssh_bootstrap() {
          ssh \
            -p "${BOOTSTRAP_PORT}" \
            -i "${RATEGURU_BOOTSTRAP_SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${RATEGURU_BOOTSTRAP_KNOWN_HOSTS_PATH}" \
            "${BOOTSTRAP_USER}@${BOOTSTRAP_HOST}" \
            "$@"
        }

        remote_uid="$(ssh_bootstrap 'id -u')"

        if [[ "${remote_uid}" == "0" ]]; then
          privileged_prefix=""
        elif ssh_bootstrap 'sudo -n true' >/dev/null 2>&1; then
          privileged_prefix="sudo -n"
        else
          echo "Bootstrap user ${BOOTSTRAP_USER} is neither root nor a passwordless sudoer." >&2
          echo "Verification reads root-owned configuration and key material; nothing was uploaded and nothing was changed." >&2
          exit 1
        fi

        echo "RATEGURU_PRIVILEGED_PREFIX=${privileged_prefix}" >> "${GITHUB_ENV}"

    # Only infrastructure/ — the verifier and every primitive it composes
    # resolve everything beneath that one directory. No application code, and
    # no material of any kind.
    - name: Package trusted infrastructure bundle
      shell: bash
      run: |
        set -Eeuo pipefail

        bundle_path="${RUNNER_TEMP}/rateguru-verify-bundle.tar.gz"

        test -x "${GITHUB_WORKSPACE}/infrastructure/scripts/verify-infrastructure"
        test -x "${GITHUB_WORKSPACE}/infrastructure/scripts/mail-identity"
        test -f "${GITHUB_WORKSPACE}/infrastructure/config/deployment-targets.json"

        tar --create --gzip --file "${bundle_path}" \
          --directory "${GITHUB_WORKSPACE}" infrastructure

        chmod 0600 "${bundle_path}"

        echo "RATEGURU_BUNDLE_PATH=${bundle_path}" >> "${GITHUB_ENV}"

    - name: Upload the trusted infrastructure bundle
      shell: bash
      env:
        BOOTSTRAP_HOST: ${{ inputs.bootstrap-host }}
        BOOTSTRAP_PORT: ${{ inputs.bootstrap-port }}
        BOOTSTRAP_USER: ${{ inputs.bootstrap-user }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -Eeuo pipefail

        run_tag="${RUN_ID}-${RUN_ATTEMPT}"
        staging_dir=".rateguru-verify-${run_tag}"
        remote_root="/root/rateguru-verify-${run_tag}"

        {
          echo "RATEGURU_REMOTE_STAGING_DIR=${staging_dir}"
          echo "RATEGURU_REMOTE_ROOT=${remote_root}"
        } >> "${GITHUB_ENV}"

        ssh_bootstrap() {
          ssh \
            -p "${BOOTSTRAP_PORT}" \
            -i "${RATEGURU_BOOTSTRAP_SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${RATEGURU_BOOTSTRAP_KNOWN_HOSTS_PATH}" \
            "${BOOTSTRAP_USER}@${BOOTSTRAP_HOST}" \
            "$@"
        }

        printf -v prepare_staging 'umask 077 && rm -rf %q && mkdir -p %q' \
          "${staging_dir}" "${staging_dir}"

        ssh_bootstrap "${prepare_staging}"

        scp \
          -P "${BOOTSTRAP_PORT}" \
          -i "${RATEGURU_BOOTSTRAP_SSH_KEY_PATH}" \
          -o BatchMode=yes \
          -o IdentitiesOnly=yes \
          -o ConnectTimeout=15 \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=10 \
          -o StrictHostKeyChecking=yes \
          -o UserKnownHostsFile="${RATEGURU_BOOTSTRAP_KNOWN_HOSTS_PATH}" \
          "${RATEGURU_BUNDLE_PATH}" \
          "${BOOTSTRAP_USER}@${BOOTSTRAP_HOST}:${staging_dir}/bundle.tar.gz"

        # scp writes as the bootstrap user, so the bundle lands in that user's
        # home and is extracted into a root-only directory before anything
        # runs from it; the copy in the home directory is removed at once.
        printf -v install_remote \
          'set -Eeuo pipefail; umask 077; %s install -d -m 0700 -o root -g root %q && %s tar -xzpf %q/bundle.tar.gz -C %q && %s chown -R root:root %q && rm -rf %q' \
          "${RATEGURU_PRIVILEGED_PREFIX:-}" "${remote_root}" \
          "${RATEGURU_PRIVILEGED_PREFIX:-}" "${staging_dir}" "${remote_root}" \
          "${RATEGURU_PRIVILEGED_PREFIX:-}" "${remote_root}" \
          "${staging_dir}"

        ssh_bootstrap "bash -c ${install_remote@Q}"

    - name: Verify the infrastructure
      id: verify
      shell: bash
      env:
        BOOTSTRAP_HOST: ${{ inputs.bootstrap-host }}
        BOOTSTRAP_PORT: ${{ inputs.bootstrap-port }}
        BOOTSTRAP_USER: ${{ inputs.bootstrap-user }}
        DEPLOYMENT_TARGET: ${{ inputs.deployment-target }}
      run: |
        set -Eeuo pipefail

        remote_command=(
          ${RATEGURU_PRIVILEGED_PREFIX:-}
          "${RATEGURU_REMOTE_ROOT}/infrastructure/scripts/verify-infrastructure"
          --target "${DEPLOYMENT_TARGET}"
        )

        # The status is captured explicitly rather than allowed to abort the
        # step: under `set -e` a failing command substitution ends the step
        # before the captured output is printed, and the server-side report is
        # the whole diagnosis.
        set +e
        verification_output="$(
          ssh \
            -p "${BOOTSTRAP_PORT}" \
            -i "${RATEGURU_BOOTSTRAP_SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${RATEGURU_BOOTSTRAP_KNOWN_HOSTS_PATH}" \
            "${BOOTSTRAP_USER}@${BOOTSTRAP_HOST}" \
            "${remote_command[@]@Q}" 2>&1
        )"
        verification_status=$?
        set -e

        printf '%s\n' "${verification_output}"

        # Exactly one result line, whatever the verdict: zero means the run
        # did not complete, two would be a broken contract.
        count="$(grep -c '^RATEGURU_INFRASTRUCTURE_VERIFY_RESULT=' <<<"${verification_output}" || true)"

        if [[ "${count}" != "1" ]]; then
          echo "Expected exactly one RATEGURU_INFRASTRUCTURE_VERIFY_RESULT line, got ${count}; the verifier exited ${verification_status}." >&2
          exit 1
        fi

        json="$(grep '^RATEGURU_INFRASTRUCTURE_VERIFY_RESULT=' <<<"${verification_output}")"
        json="${json#RATEGURU_INFRASTRUCTURE_VERIFY_RESULT=}"

        # The whole result is judged before any of it is shown: the target it
        # names, the verdict, the counts, and one well-formed entry per group —
        # unique ids, a closed status vocabulary, titles of plain words — whose
        # failures agree with the overall verdict.
        jq -e --arg target "${DEPLOYMENT_TARGET}" '
          type == "object"
          and .target == $target
          and (.status == "pass" or .status == "fail")
          and ([.pass, .fail, .deferred, .not_applicable] | all(type == "number"))
          and (.lifecycle | type) == "string"
          and (.environment_class | type) == "string"
          and (.groups | type) == "array"
          and (.groups | length) > 0
          and all(.groups[];
                type == "object"
                and (.id | type) == "string" and (.id | test("^[a-z][a-z-]*$"))
                and (.title | type) == "string" and (.title | test("^[A-Z][A-Za-z &-]*$"))
                and (.status | IN("pass", "fail", "deferred", "not_applicable"))
                and ([.pass, .fail, .deferred, .not_applicable] | all(type == "number")))
          and ([.groups[].id] | length) == ([.groups[].id] | unique | length)
          and ((.status == "fail") == any(.groups[]; .status == "fail"))
        ' <<<"${json}" >/dev/null || {
          echo "The machine-readable result is not a verification result for ${DEPLOYMENT_TARGET}: ${json}" >&2
          exit 1
        }

        {
          echo "status=$(jq -r '.status' <<<"${json}")"
          echo "pass=$(jq -r '.pass' <<<"${json}")"
          echo "fail=$(jq -r '.fail' <<<"${json}")"
          echo "deferred=$(jq -r '.deferred' <<<"${json}")"
        } >> "${GITHUB_OUTPUT}"

        # One row per group, in the order the verifier ran them. Only a result
        # that passed every check above reaches the summary; without one, the
        # calling workflow says the verification did not complete.
        {
          jq -r '
            "## \(.target) infrastructure",
            "",
            "\(.environment_class), lifecycle \(.lifecycle)",
            "",
            "| Group | Result |",
            "| --- | --- |",
            (.groups[]
              | "| \(.title) | \({pass: "PASS", fail: "**FAIL**", deferred: "DEFERRED", not_applicable: "N/A"}[.status])"
                + (if .status == "pass" and .deferred > 0 then " (\(.deferred) deferred)" else "" end) + " |"),
            "| **Overall** | **\(.status | ascii_upcase)** |",
            "",
            "Checks: \(.pass) passed, \(.fail) failed, \(.deferred) deferred, \(.not_applicable) not applicable.",
            (if .lifecycle == "planned"
             then "", "PASS means the CURRENT reviewed planned state is correct. It does NOT mean \(if .environment_class == "production" then "production" else .target end) is live."
             else empty end),
            "",
            "Read-only: nothing on the host was changed. The complete child reports are in the job log."
          ' <<<"${json}"
        } >> "${GITHUB_STEP_SUMMARY}"

        # The verdict is the verifier's, and its exit status must agree with it.
        if [[ "$(jq -r '.status' <<<"${json}")" != "pass" ]] || (( verification_status != 0 )); then
          echo "Infrastructure verification failed for ${DEPLOYMENT_TARGET} (exit ${verification_status}). The complete report is above." >&2
          exit 1
        fi

    # Runs on failure too. Uploaded tooling must never outlive the run.
    - name: Remove the remote infrastructure bundle
      if: ${{ always() }}
      shell: bash
      env:
        BOOTSTRAP_HOST: ${{ inputs.bootstrap-host }}
        BOOTSTRAP_PORT: ${{ inputs.bootstrap-port }}
        BOOTSTRAP_USER: ${{ inputs.bootstrap-user }}
      run: |
        set -Eeuo pipefail

        if [[ -z "${RATEGURU_REMOTE_ROOT:-}" ]]; then
          echo "Nothing was uploaded; no remote cleanup required."
          exit 0
        fi

        printf -v cleanup_command '%s rm -rf %q && rm -rf %q' \
          "${RATEGURU_PRIVILEGED_PREFIX:-}" "${RATEGURU_REMOTE_ROOT}" "${RATEGURU_REMOTE_STAGING_DIR:-/nonexistent}"

        if ssh \
          -p "${BOOTSTRAP_PORT}" \
          -i "${RATEGURU_BOOTSTRAP_SSH_KEY_PATH}" \
          -o BatchMode=yes \
          -o IdentitiesOnly=yes \
          -o ConnectTimeout=15 \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=10 \
          -o StrictHostKeyChecking=yes \
          -o UserKnownHostsFile="${RATEGURU_BOOTSTRAP_KNOWN_HOSTS_PATH}" \
          "${BOOTSTRAP_USER}@${BOOTSTRAP_HOST}" \
          "bash -c ${cleanup_command@Q}"
        then
          echo "Removed ${RATEGURU_REMOTE_ROOT} and the upload staging directory."
        else
          echo "WARNING: could not remove ${RATEGURU_REMOTE_ROOT} from the host. Remove it manually." >&2
        fi

    - name: Remove temporary local files
      if: ${{ always() }}
      shell: bash
      run: |
        rm -f \
          "${RATEGURU_BUNDLE_PATH:-}" \
          "${RATEGURU_BOOTSTRAP_SSH_KEY_PATH:-}" \
          "${RATEGURU_BOOTSTRAP_KNOWN_HOSTS_PATH:-}"
