name: Activate RateGuru outbound mail
description: >-
  Activate one planned production target's direct outbound mail on its host, or
  roll that activation back while the target is still planned: run
  activate-mail-outbound from a temporary trusted bundle — and nothing else.

# Transport and invocation only.
#
# infrastructure/scripts/activate-mail-outbound owns every decision: whether the
# trusted bundle requests the activation at all, the one transition it may make,
# the proof it requires before the gateway changes, the rollback capsule, the
# return to held on any failure, and the initial-launch rollback's own limits.
# None of that is reproduced here. This action uploads the trusted
# infrastructure/ tree, runs that one command as root in the one mode its caller
# fixed, prints its whole report, checks there is exactly one well-formed result,
# writes it into the job summary, and removes everything it uploaded.
#
# MUTATING, AND CONTAINED. An activation changes the host's mail gateway, and
# only when the trusted bundle requests it; it sends no mail. Its proof submits
# the signing acceptance's held probes, which go nowhere. This action carries
# no material: the DKIM private key is already on the host, and no secret but
# the bootstrap credential is read.
#
# CREDENTIAL. The privileged BOOTSTRAP credential, because the gateway, the
# signer and the queue are root's. Never the deploy credential, and no fallback
# between them.
#
# CALLER REQUIREMENT: a Bash 4.4+ runner. Remote argv is quoted with
# ${array[@]@Q}, as the other operational actions here quote theirs, so a caller
# runs this on `runs-on: ubuntu-24.04`.

inputs:
  operation:
    required: true
    description: >-
      apply or rollback, fixed by the calling workflow. Never an operator's
      choice: each operation has a workflow of its own.

  deployment-target:
    required: true
    description: >-
      Deployment target ID from the RateGuru target registry. The trusted
      bundle's reviewed mail routing, not this input, decides whether there is
      anything to activate.

  bootstrap-host:
    required: true
    description: SSH hostname or IP of the host the target lives on.

  bootstrap-port:
    required: false
    default: "22"
    description: SSH server port

  bootstrap-user:
    required: true
    description: >-
      Privileged bootstrap user. Must be root, or hold passwordless
      non-interactive sudo.

  bootstrap-ssh-key:
    required: true
    description: Privileged bootstrap SSH private key, separate from any deployment key

  bootstrap-known-hosts:
    required: true
    description: >-
      Verified known_hosts entry for the host. Strict host key checking is
      non-negotiable: no TOFU, no relaxed policy, no password fallback.

outputs:
  status:
    description: "pass, fail or critical, from the activation's machine-readable result"
    value: ${{ steps.activate.outputs.status }}

runs:
  using: composite

  steps:
    - name: Validate fixed caller inputs
      shell: bash
      env:
        OPERATION: ${{ inputs.operation }}
        DEPLOYMENT_TARGET: ${{ inputs.deployment-target }}
        BOOTSTRAP_HOST: ${{ inputs.bootstrap-host }}
        BOOTSTRAP_PORT: ${{ inputs.bootstrap-port }}
        BOOTSTRAP_USER: ${{ inputs.bootstrap-user }}
        BOOTSTRAP_KEY_PRESENT: ${{ inputs.bootstrap-ssh-key != '' }}
        BOOTSTRAP_KNOWN_HOSTS_PRESENT: ${{ inputs.bootstrap-known-hosts != '' }}
      run: |
        set -Eeuo pipefail

        case "${OPERATION}" in
          apply|rollback) ;;
          *)
            echo "Invalid operation: ${OPERATION} (expected apply or rollback)" >&2
            exit 1
            ;;
        esac

        target_regex='^[a-z0-9]+(-[a-z0-9]+)*$'

        [[ "${DEPLOYMENT_TARGET}" =~ ${target_regex} ]] || {
          echo "Invalid deployment target: ${DEPLOYMENT_TARGET}" >&2
          exit 1
        }

        # 10# forces decimal: a leading-zero port read as octal would abort
        # (( )) and be mistaken for a passing condition by the || chain.
        if [[ ! "${BOOTSTRAP_PORT}" =~ ^[0-9]{1,5}$ ]] \
          || (( 10#${BOOTSTRAP_PORT} < 1 )) \
          || (( 10#${BOOTSTRAP_PORT} > 65535 ))
        then
          echo "Invalid bootstrap port (expected 1-65535): ${BOOTSTRAP_PORT}" >&2
          exit 1
        fi

        for required_var in BOOTSTRAP_HOST BOOTSTRAP_USER; do
          if [[ -z "${!required_var}" ]]; then
            echo "${required_var} is not configured for this environment" >&2
            exit 1
          fi
        done

        if [[ "${BOOTSTRAP_KEY_PRESENT}" != "true" ]] \
          || [[ "${BOOTSTRAP_KNOWN_HOSTS_PRESENT}" != "true" ]]
        then
          echo "This environment has no bootstrap SSH credential." >&2
          echo "The activation changes the root-owned mail gateway; it refuses to fall back to a deployment key, which is restricted to the deploy wrappers." >&2
          exit 1
        fi

    - name: Configure bootstrap SSH
      shell: bash
      env:
        BOOTSTRAP_SSH_KEY: ${{ inputs.bootstrap-ssh-key }}
        BOOTSTRAP_KNOWN_HOSTS: ${{ inputs.bootstrap-known-hosts }}
      run: |
        set -Eeuo pipefail

        key_path="${RUNNER_TEMP}/rateguru_mail_activation_key"
        known_hosts_path="${RUNNER_TEMP}/rateguru_mail_activation_known_hosts"

        install -m 0600 /dev/null "${key_path}"
        install -m 0600 /dev/null "${known_hosts_path}"

        printf '%s\n' "${BOOTSTRAP_SSH_KEY}" > "${key_path}"
        printf '%s\n' "${BOOTSTRAP_KNOWN_HOSTS}" > "${known_hosts_path}"

        ssh-keygen -y -f "${key_path}" >/dev/null

        {
          echo "RATEGURU_BOOTSTRAP_SSH_KEY_PATH=${key_path}"
          echo "RATEGURU_BOOTSTRAP_KNOWN_HOSTS_PATH=${known_hosts_path}"
        } >> "${GITHUB_ENV}"

    - name: Verify privileged access on the host
      shell: bash
      env:
        BOOTSTRAP_HOST: ${{ inputs.bootstrap-host }}
        BOOTSTRAP_PORT: ${{ inputs.bootstrap-port }}
        BOOTSTRAP_USER: ${{ inputs.bootstrap-user }}
      run: |
        set -Eeuo pipefail

        ssh_bootstrap() {
          ssh \
            -p "${BOOTSTRAP_PORT}" \
            -i "${RATEGURU_BOOTSTRAP_SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${RATEGURU_BOOTSTRAP_KNOWN_HOSTS_PATH}" \
            "${BOOTSTRAP_USER}@${BOOTSTRAP_HOST}" \
            "$@"
        }

        remote_uid="$(ssh_bootstrap 'id -u')"

        if [[ "${remote_uid}" == "0" ]]; then
          privileged_prefix=""
        elif ssh_bootstrap 'sudo -n true' >/dev/null 2>&1; then
          privileged_prefix="sudo -n"
        else
          echo "Bootstrap user ${BOOTSTRAP_USER} is neither root nor a passwordless sudoer." >&2
          echo "The activation needs root; nothing was uploaded and nothing was changed." >&2
          exit 1
        fi

        echo "RATEGURU_PRIVILEGED_PREFIX=${privileged_prefix}" >> "${GITHUB_ENV}"

    # Only infrastructure/ — the activation copies exactly this tree into its own
    # temporary bundles and resolves every owner beneath it. No application code,
    # and no material of any kind.
    - name: Package trusted infrastructure bundle
      shell: bash
      run: |
        set -Eeuo pipefail

        bundle_path="${RUNNER_TEMP}/rateguru-mail-activation-bundle.tar.gz"

        test -x "${GITHUB_WORKSPACE}/infrastructure/scripts/activate-mail-outbound"
        test -f "${GITHUB_WORKSPACE}/infrastructure/scripts/smtp-submission"

        tar --create --gzip --file "${bundle_path}" \
          --directory "${GITHUB_WORKSPACE}" infrastructure

        chmod 0600 "${bundle_path}"

        echo "RATEGURU_BUNDLE_PATH=${bundle_path}" >> "${GITHUB_ENV}"

    - name: Upload the trusted infrastructure bundle
      shell: bash
      env:
        BOOTSTRAP_HOST: ${{ inputs.bootstrap-host }}
        BOOTSTRAP_PORT: ${{ inputs.bootstrap-port }}
        BOOTSTRAP_USER: ${{ inputs.bootstrap-user }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -Eeuo pipefail

        run_tag="${RUN_ID}-${RUN_ATTEMPT}"
        staging_dir=".rateguru-mail-activation-${run_tag}"
        remote_root="/root/rateguru-mail-activation-${run_tag}"

        {
          echo "RATEGURU_REMOTE_STAGING_DIR=${staging_dir}"
          echo "RATEGURU_REMOTE_ROOT=${remote_root}"
        } >> "${GITHUB_ENV}"

        ssh_bootstrap() {
          ssh \
            -p "${BOOTSTRAP_PORT}" \
            -i "${RATEGURU_BOOTSTRAP_SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${RATEGURU_BOOTSTRAP_KNOWN_HOSTS_PATH}" \
            "${BOOTSTRAP_USER}@${BOOTSTRAP_HOST}" \
            "$@"
        }

        printf -v prepare_staging 'umask 077 && rm -rf %q && mkdir -p %q' \
          "${staging_dir}" "${staging_dir}"

        ssh_bootstrap "${prepare_staging}"

        scp \
          -P "${BOOTSTRAP_PORT}" \
          -i "${RATEGURU_BOOTSTRAP_SSH_KEY_PATH}" \
          -o BatchMode=yes \
          -o IdentitiesOnly=yes \
          -o ConnectTimeout=15 \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=10 \
          -o StrictHostKeyChecking=yes \
          -o UserKnownHostsFile="${RATEGURU_BOOTSTRAP_KNOWN_HOSTS_PATH}" \
          "${RATEGURU_BUNDLE_PATH}" \
          "${BOOTSTRAP_USER}@${BOOTSTRAP_HOST}:${staging_dir}/bundle.tar.gz"

        # scp writes as the bootstrap user, so the bundle lands in that user's
        # home and is extracted into a root-only directory before anything
        # runs from it; the copy in the home directory is removed at once.
        printf -v install_remote \
          'set -Eeuo pipefail; umask 077; %s install -d -m 0700 -o root -g root %q && %s tar -xzpf %q/bundle.tar.gz -C %q && %s chown -R root:root %q && rm -rf %q' \
          "${RATEGURU_PRIVILEGED_PREFIX:-}" "${remote_root}" \
          "${RATEGURU_PRIVILEGED_PREFIX:-}" "${staging_dir}" "${remote_root}" \
          "${RATEGURU_PRIVILEGED_PREFIX:-}" "${remote_root}" \
          "${staging_dir}"

        ssh_bootstrap "bash -c ${install_remote@Q}"

    - name: Run the activation
      id: activate
      shell: bash
      env:
        BOOTSTRAP_HOST: ${{ inputs.bootstrap-host }}
        BOOTSTRAP_PORT: ${{ inputs.bootstrap-port }}
        BOOTSTRAP_USER: ${{ inputs.bootstrap-user }}
        DEPLOYMENT_TARGET: ${{ inputs.deployment-target }}
        OPERATION: ${{ inputs.operation }}
      run: |
        set -Eeuo pipefail

        remote_command=(
          ${RATEGURU_PRIVILEGED_PREFIX:-}
          "${RATEGURU_REMOTE_ROOT}/infrastructure/scripts/activate-mail-outbound"
          "--${OPERATION}"
          --target "${DEPLOYMENT_TARGET}"
        )

        # The status is captured explicitly rather than allowed to abort the
        # step: under `set -e` a failing command substitution ends the step
        # before the captured output is printed, and the server-side report is
        # the whole diagnosis.
        set +e
        activation_output="$(
          ssh \
            -p "${BOOTSTRAP_PORT}" \
            -i "${RATEGURU_BOOTSTRAP_SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${RATEGURU_BOOTSTRAP_KNOWN_HOSTS_PATH}" \
            "${BOOTSTRAP_USER}@${BOOTSTRAP_HOST}" \
            "${remote_command[@]@Q}" 2>&1
        )"
        activation_status=$?
        set -e

        printf '%s\n' "${activation_output}"

        # Exactly one result line, whatever the verdict: zero means the run did
        # not complete, two would be a broken contract.
        count="$(grep -c '^RATEGURU_MAIL_OUTBOUND_ACTIVATION_RESULT=' <<<"${activation_output}" || true)"

        if [[ "${count}" != "1" ]]; then
          echo "Expected exactly one RATEGURU_MAIL_OUTBOUND_ACTIVATION_RESULT line, got ${count}; the activation exited ${activation_status}." >&2
          exit 1
        fi

        json="$(grep '^RATEGURU_MAIL_OUTBOUND_ACTIVATION_RESULT=' <<<"${activation_output}")"
        json="${json#RATEGURU_MAIL_OUTBOUND_ACTIVATION_RESULT=}"

        # The whole result is judged before any of it is shown: the target and
        # mode it names, a verdict from the closed set, every flag a boolean,
        # and a pass that means what its mode promises — an activation that
        # left the target ready, a rollback that left it held.
        jq -e --arg target "${DEPLOYMENT_TARGET}" --arg mode "${OPERATION}" '
          type == "object"
          and .target == $target
          and .mode == $mode
          and (.status == "pass" or .status == "fail" or .status == "critical")
          and ([.requested, .changed, .rolled_back, .outbound_ready] | all(type == "boolean"))
          and (.status != "pass"
               or ($mode == "apply" and .requested and .outbound_ready and (.rolled_back | not))
               or ($mode == "rollback" and .rolled_back and (.outbound_ready | not)))
        ' <<<"${json}" >/dev/null || {
          echo "The machine-readable result is not an activation result for ${DEPLOYMENT_TARGET} (${OPERATION}): ${json}" >&2
          exit 1
        }

        echo "status=$(jq -r '.status' <<<"${json}")" >> "${GITHUB_OUTPUT}"

        {
          jq -r '
            def yesno: if . then "yes" else "no" end;
            if .mode == "apply" then
              "## \(.target) outbound mail activation",
              "",
              "| Check | Result |",
              "| --- | --- |",
              "| Activation requested by the trusted bundle | \(.requested | yesno) |",
              "| Gateway changed by this run | \(.changed | yesno) |",
              "| Rolled back to held | \(.rolled_back | yesno) |",
              "| OUTBOUND READY | \(if .outbound_ready then "YES" else "**NO**" end) |",
              "| **Overall** | **\(.status | ascii_upcase)** |",
              "",
              (if (.requested | not) then
                 "Activation is not requested by this trusted bundle: main does not deliver \(.target)'"'"'s mail outbound with direct delivery enabled. Nothing was changed."
               elif .status == "pass" then
                 "\(.target) delivers its mail outbound by direct delivery, signed, and is fully ready. No message was sent. Next: verify the production infrastructure, then send the production mail canary."
               elif .status == "critical" then
                 "**CRITICAL:** the activation failed and its return to held could not be proved. Inspect the mail gateway on the host now."
               elif .rolled_back then
                 "The activation failed and the host was returned to its pre-activation state: \(.target)'"'"'s mail is held again and no direct route exists."
               else
                 "The activation was refused before the gateway changed. Nothing was changed."
               end),
              "",
              "The complete report is in the job log."
            else
              "## \(.target) initial activation rollback",
              "",
              "> **This is the pre-go-live initial activation rollback.** It returns the RUNTIME to held; it does not change the committed configuration. Revert the activation change to `mail-routing.json` and `mail-outbound.json` on main before the next Prepare or Verify, or Prepare will activate it again.",
              "",
              "| Check | Result |",
              "| --- | --- |",
              "| Returned to held | \(.rolled_back | yesno) |",
              "| OUTBOUND READY | \(if .outbound_ready then "YES" else "NO" end) |",
              "| **Overall** | **\(.status | ascii_upcase)** |",
              "",
              "The complete report is in the job log."
            end
          ' <<<"${json}"
        } >> "${GITHUB_STEP_SUMMARY}"

        # The verdict is the activation's, and its exit status must agree.
        if [[ "$(jq -r '.status' <<<"${json}")" != "pass" ]] || (( activation_status != 0 )); then
          echo "The ${OPERATION} of ${DEPLOYMENT_TARGET}'s outbound mail did not pass (exit ${activation_status}). The complete report is above." >&2
          exit 1
        fi

    # Runs on failure too. Uploaded tooling must never outlive the run.
    - name: Remove the remote infrastructure bundle
      if: ${{ always() }}
      shell: bash
      env:
        BOOTSTRAP_HOST: ${{ inputs.bootstrap-host }}
        BOOTSTRAP_PORT: ${{ inputs.bootstrap-port }}
        BOOTSTRAP_USER: ${{ inputs.bootstrap-user }}
      run: |
        set -Eeuo pipefail

        if [[ -z "${RATEGURU_REMOTE_ROOT:-}" ]]; then
          echo "Nothing was uploaded; no remote cleanup required."
          exit 0
        fi

        printf -v cleanup_command '%s rm -rf %q && rm -rf %q' \
          "${RATEGURU_PRIVILEGED_PREFIX:-}" "${RATEGURU_REMOTE_ROOT}" "${RATEGURU_REMOTE_STAGING_DIR:-/nonexistent}"

        if ssh \
          -p "${BOOTSTRAP_PORT}" \
          -i "${RATEGURU_BOOTSTRAP_SSH_KEY_PATH}" \
          -o BatchMode=yes \
          -o IdentitiesOnly=yes \
          -o ConnectTimeout=15 \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=10 \
          -o StrictHostKeyChecking=yes \
          -o UserKnownHostsFile="${RATEGURU_BOOTSTRAP_KNOWN_HOSTS_PATH}" \
          "${BOOTSTRAP_USER}@${BOOTSTRAP_HOST}" \
          "bash -c ${cleanup_command@Q}"
        then
          echo "Removed ${RATEGURU_REMOTE_ROOT} and the upload staging directory."
        else
          echo "WARNING: could not remove ${RATEGURU_REMOTE_ROOT} from the host. Remove it manually." >&2
        fi

    - name: Remove temporary local files
      if: ${{ always() }}
      shell: bash
      run: |
        rm -f \
          "${RATEGURU_BUNDLE_PATH:-}" \
          "${RATEGURU_BOOTSTRAP_SSH_KEY_PATH:-}" \
          "${RATEGURU_BOOTSTRAP_KNOWN_HOSTS_PATH:-}"
