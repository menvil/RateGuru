name: Verify RateGuru mail gateway
description: >-
  Run the mutating end-to-end acceptance of the host-global mail gateway —
  infrastructure/scripts/verify-mail-gateway --e2e — on a staging host, from a
  temporary trusted infrastructure bundle.

# Transport and invocation only.
#
# infrastructure/scripts/verify-mail-gateway owns every check: capture delivery
# into Mailpit and its mirror, sender isolation on every listener, held mail in
# HOLD and nowhere else, and queued retry across a Mailpit outage, all driven by
# the reviewed mail routing plan. None of that is restated here. This action
# packages infrastructure/, proves privileged access, runs that one command and
# removes what it uploaded.
#
# WHAT IT NEVER DOES. It never installs or converges anything — that is Prepare
# Host — never edits an environment file, never deploys application code and
# carries no material other than the bootstrap credential it connects with.
# The acceptance it runs removes only the messages and queue entries it created.
#
# STAGING ONLY. The acceptance observes the staging capture backend (Mailpit and
# its Mailtrap Local mirror). A production host has none, and its mail is held,
# so `environment` accepts exactly one value.
#
# CREDENTIAL SEPARATION. The privileged BOOTSTRAP credential, exactly as Prepare
# Host uses it, never the restricted deploy credential: the acceptance stops and
# starts Mailpit and removes its own Postfix queue entries, which needs root.

inputs:
  environment:
    required: true
    description: Environment class. Only staging has a capture backend to accept against.

  bootstrap-host:
    required: true
    description: SSH hostname or IP of the host the gateway runs on

  bootstrap-port:
    required: false
    default: "22"
    description: SSH server port

  bootstrap-user:
    required: true
    description: >-
      Privileged bootstrap user. Must be root, or hold passwordless
      non-interactive sudo; proven before the bundle is uploaded.

  bootstrap-ssh-key:
    required: true
    description: Privileged bootstrap SSH private key, separate from the deployment key

  bootstrap-known-hosts:
    required: true
    description: >-
      Verified known_hosts entry for the host. Strict host key checking only:
      no TOFU, no relaxed host-key policy, no password fallback.

runs:
  using: composite

  steps:
    - name: Validate fixed caller inputs
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        BOOTSTRAP_HOST: ${{ inputs.bootstrap-host }}
        BOOTSTRAP_PORT: ${{ inputs.bootstrap-port }}
        BOOTSTRAP_USER: ${{ inputs.bootstrap-user }}
        BOOTSTRAP_KEY_PRESENT: ${{ inputs.bootstrap-ssh-key != '' }}
        BOOTSTRAP_KNOWN_HOSTS_PRESENT: ${{ inputs.bootstrap-known-hosts != '' }}
      run: |
        set -Eeuo pipefail

        if [[ "${ENVIRONMENT}" != "staging" ]]; then
          echo "The mail gateway acceptance runs on staging only (got: ${ENVIRONMENT})." >&2
          echo "It exercises the staging capture backend; a production host has none, and its mail is held." >&2
          exit 1
        fi

        # 10# forces decimal: a leading-zero port would otherwise be read as
        # octal inside (( )) and quietly pass validation.
        if [[ ! "${BOOTSTRAP_PORT}" =~ ^[0-9]{1,5}$ ]] \
          || (( 10#${BOOTSTRAP_PORT} < 1 )) \
          || (( 10#${BOOTSTRAP_PORT} > 65535 ))
        then
          echo "Invalid bootstrap port (expected 1-65535): ${BOOTSTRAP_PORT}" >&2
          exit 1
        fi

        for required_var in BOOTSTRAP_HOST BOOTSTRAP_USER; do
          if [[ -z "${!required_var}" ]]; then
            echo "${required_var} is not configured for the ${ENVIRONMENT} environment" >&2
            exit 1
          fi
        done

        if [[ "${BOOTSTRAP_KEY_PRESENT}" != "true" ]] \
          || [[ "${BOOTSTRAP_KNOWN_HOSTS_PRESENT}" != "true" ]]
        then
          echo "The ${ENVIRONMENT} environment has no bootstrap SSH credential." >&2
          echo "The acceptance deliberately refuses to fall back to the deployment key: that key is restricted to the deploy wrappers and cannot run anything as root." >&2
          exit 1
        fi

    - name: Configure bootstrap SSH
      shell: bash
      env:
        BOOTSTRAP_SSH_KEY: ${{ inputs.bootstrap-ssh-key }}
        BOOTSTRAP_KNOWN_HOSTS: ${{ inputs.bootstrap-known-hosts }}
      run: |
        set -Eeuo pipefail

        key_path="${RUNNER_TEMP}/rateguru_mail_gateway_key"
        known_hosts_path="${RUNNER_TEMP}/rateguru_mail_gateway_known_hosts"

        install -m 0600 /dev/null "${key_path}"
        install -m 0600 /dev/null "${known_hosts_path}"

        printf '%s\n' "${BOOTSTRAP_SSH_KEY}" > "${key_path}"
        printf '%s\n' "${BOOTSTRAP_KNOWN_HOSTS}" > "${known_hosts_path}"

        # Proven usable before its path is exported; a malformed credential is
        # removed here, because the always() cleanup only knows exported paths.
        if ! ssh-keygen -y -f "${key_path}" >/dev/null; then
          rm -f "${key_path}" "${known_hosts_path}"
          echo "The bootstrap SSH private key for this environment is not a usable key. Nothing was uploaded." >&2
          exit 1
        fi

        {
          echo "RATEGURU_MAIL_GATEWAY_SSH_KEY_PATH=${key_path}"
          echo "RATEGURU_MAIL_GATEWAY_KNOWN_HOSTS_PATH=${known_hosts_path}"
        } >> "${GITHUB_ENV}"

    - name: Verify privileged access on the host
      shell: bash
      env:
        BOOTSTRAP_HOST: ${{ inputs.bootstrap-host }}
        BOOTSTRAP_PORT: ${{ inputs.bootstrap-port }}
        BOOTSTRAP_USER: ${{ inputs.bootstrap-user }}
      run: |
        set -Eeuo pipefail

        ssh_bootstrap() {
          ssh \
            -p "${BOOTSTRAP_PORT}" \
            -i "${RATEGURU_MAIL_GATEWAY_SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${RATEGURU_MAIL_GATEWAY_KNOWN_HOSTS_PATH}" \
            "${BOOTSTRAP_USER}@${BOOTSTRAP_HOST}" \
            "$@"
        }

        if ! uid="$(ssh_bootstrap 'id -u')"; then
          echo "Could not reach ${BOOTSTRAP_HOST}:${BOOTSTRAP_PORT} as ${BOOTSTRAP_USER} with the bootstrap key and the recorded host key. Nothing was uploaded." >&2
          exit 1
        fi

        if [[ "${uid}" == "0" ]]; then
          privileged_prefix=""
        elif ssh_bootstrap 'sudo -n true' >/dev/null 2>&1; then
          privileged_prefix="sudo -n"
        else
          echo "${BOOTSTRAP_USER} is neither root nor a passwordless sudoer on the host. Nothing was uploaded." >&2
          exit 1
        fi

        echo "RATEGURU_PRIVILEGED_PREFIX=${privileged_prefix}" >> "${GITHUB_ENV}"

    # Only infrastructure/: the acceptance needs the verifier, the gateway
    # installer whose --verify it runs first, and the routing policy, registry
    # and policy tooling they render the plan from — all beneath that one
    # directory. The application is not part of it.
    - name: Package trusted infrastructure bundle
      shell: bash
      run: |
        set -Eeuo pipefail

        bundle_path="${RUNNER_TEMP}/rateguru-mail-gateway-bundle.tar.gz"

        test -x "${GITHUB_WORKSPACE}/infrastructure/scripts/verify-mail-gateway"
        test -x "${GITHUB_WORKSPACE}/infrastructure/scripts/install-mail-gateway"

        tar \
          --create \
          --gzip \
          --file "${bundle_path}" \
          --directory "${GITHUB_WORKSPACE}" \
          infrastructure

        chmod 0600 "${bundle_path}"
        echo "RATEGURU_MAIL_GATEWAY_BUNDLE_PATH=${bundle_path}" >> "${GITHUB_ENV}"

    # The run ID and attempt name the directories, so a retry never collides
    # with its own earlier attempt.
    - name: Upload the bundle into a root-only directory
      shell: bash
      env:
        BOOTSTRAP_HOST: ${{ inputs.bootstrap-host }}
        BOOTSTRAP_PORT: ${{ inputs.bootstrap-port }}
        BOOTSTRAP_USER: ${{ inputs.bootstrap-user }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -Eeuo pipefail

        run_tag="${RUN_ID}-${RUN_ATTEMPT}"
        staging_dir=".rateguru-mail-gateway-verify-${run_tag}"
        remote_root="/root/rateguru-mail-gateway-verify-${run_tag}"

        {
          echo "RATEGURU_MAIL_GATEWAY_STAGING_DIR=${staging_dir}"
          echo "RATEGURU_MAIL_GATEWAY_REMOTE_ROOT=${remote_root}"
        } >> "${GITHUB_ENV}"

        ssh_bootstrap() {
          ssh \
            -p "${BOOTSTRAP_PORT}" \
            -i "${RATEGURU_MAIL_GATEWAY_SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${RATEGURU_MAIL_GATEWAY_KNOWN_HOSTS_PATH}" \
            "${BOOTSTRAP_USER}@${BOOTSTRAP_HOST}" \
            "$@"
        }

        printf -v prepare_staging 'umask 077 && rm -rf %q && mkdir -p %q' "${staging_dir}" "${staging_dir}"
        ssh_bootstrap "${prepare_staging}"

        scp \
          -P "${BOOTSTRAP_PORT}" \
          -i "${RATEGURU_MAIL_GATEWAY_SSH_KEY_PATH}" \
          -o BatchMode=yes \
          -o IdentitiesOnly=yes \
          -o StrictHostKeyChecking=yes \
          -o UserKnownHostsFile="${RATEGURU_MAIL_GATEWAY_KNOWN_HOSTS_PATH}" \
          "${RATEGURU_MAIL_GATEWAY_BUNDLE_PATH}" \
          "${BOOTSTRAP_USER}@${BOOTSTRAP_HOST}:${staging_dir}/bundle.tar.gz"

        printf -v install_remote \
          'set -Eeuo pipefail; umask 077; %s install -d -m 0700 -o root -g root %q && %s tar -xzpf %q/bundle.tar.gz -C %q && %s chown -R root:root %q && rm -rf %q' \
          "${RATEGURU_PRIVILEGED_PREFIX}" "${remote_root}" \
          "${RATEGURU_PRIVILEGED_PREFIX}" "${staging_dir}" "${remote_root}" \
          "${RATEGURU_PRIVILEGED_PREFIX}" "${remote_root}" \
          "${staging_dir}"

        ssh_bootstrap "bash -c ${install_remote@Q}"

        echo "Bundle installed under ${remote_root} (root-only)."

    - name: Run the mail gateway end-to-end acceptance
      shell: bash
      env:
        BOOTSTRAP_HOST: ${{ inputs.bootstrap-host }}
        BOOTSTRAP_PORT: ${{ inputs.bootstrap-port }}
        BOOTSTRAP_USER: ${{ inputs.bootstrap-user }}
      run: |
        set -Eeuo pipefail

        # A fixed argv, quoted element-wise: the verifier accepts only a
        # closed flag set and no free-text command of any kind.
        remote_command=(
          ${RATEGURU_PRIVILEGED_PREFIX}
          "${RATEGURU_MAIL_GATEWAY_REMOTE_ROOT}/infrastructure/scripts/verify-mail-gateway"
          --e2e
        )

        ssh \
          -p "${BOOTSTRAP_PORT}" \
          -i "${RATEGURU_MAIL_GATEWAY_SSH_KEY_PATH}" \
          -o BatchMode=yes \
          -o IdentitiesOnly=yes \
          -o ConnectTimeout=15 \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=10 \
          -o StrictHostKeyChecking=yes \
          -o UserKnownHostsFile="${RATEGURU_MAIL_GATEWAY_KNOWN_HOSTS_PATH}" \
          "${BOOTSTRAP_USER}@${BOOTSTRAP_HOST}" \
          "${remote_command[@]@Q}"

    # Runs on failure too: the uploaded bundle never outlives the run.
    - name: Remove the uploaded bundle
      if: ${{ always() }}
      shell: bash
      env:
        BOOTSTRAP_HOST: ${{ inputs.bootstrap-host }}
        BOOTSTRAP_PORT: ${{ inputs.bootstrap-port }}
        BOOTSTRAP_USER: ${{ inputs.bootstrap-user }}
      run: |
        set -Eeuo pipefail

        if [[ -z "${RATEGURU_MAIL_GATEWAY_SSH_KEY_PATH:-}" ]] || [[ -z "${RATEGURU_MAIL_GATEWAY_STAGING_DIR:-}" ]]; then
          echo "Nothing was uploaded; no remote cleanup required."
          exit 0
        fi

        printf -v cleanup_command 'rm -rf %q; %s rm -rf %q' \
          "${RATEGURU_MAIL_GATEWAY_STAGING_DIR}" \
          "${RATEGURU_PRIVILEGED_PREFIX:-}" "${RATEGURU_MAIL_GATEWAY_REMOTE_ROOT}"

        if ssh \
          -p "${BOOTSTRAP_PORT}" \
          -i "${RATEGURU_MAIL_GATEWAY_SSH_KEY_PATH}" \
          -o BatchMode=yes \
          -o IdentitiesOnly=yes \
          -o ConnectTimeout=15 \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=10 \
          -o StrictHostKeyChecking=yes \
          -o UserKnownHostsFile="${RATEGURU_MAIL_GATEWAY_KNOWN_HOSTS_PATH}" \
          "${BOOTSTRAP_USER}@${BOOTSTRAP_HOST}" \
          "bash -c ${cleanup_command@Q}"
        then
          echo "Removed the temporary bundle from the host."
        else
          echo "WARNING: could not remove ${RATEGURU_MAIL_GATEWAY_REMOTE_ROOT} from the host. Remove it manually." >&2
        fi

    - name: Remove temporary local files
      if: ${{ always() }}
      shell: bash
      run: |
        rm -f \
          "${RATEGURU_MAIL_GATEWAY_SSH_KEY_PATH:-}" \
          "${RATEGURU_MAIL_GATEWAY_KNOWN_HOSTS_PATH:-}" \
          "${RATEGURU_MAIL_GATEWAY_BUNDLE_PATH:-}"
