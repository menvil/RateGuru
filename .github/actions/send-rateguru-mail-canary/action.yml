name: Send RateGuru mail canary
description: >-
  Send one real canary from an activated production target and follow its exact
  queue ID until the receiving server accepted it: run send-mail-canary from a
  temporary trusted bundle — and nothing else.

# Transport and invocation only.
#
# infrastructure/scripts/send-mail-canary owns every decision: that the target
# is production, planned and fully activated before it connects anywhere, the
# reviewed sender and endpoint, the one message, the queue ID it follows, and
# the removal of exactly that entry if it never reaches a final status. None of
# that is reproduced here. This action carries the recipient to the host as
# root-only material, runs that one command as root, prints its report, checks
# there is exactly one well-formed result, writes it into the job summary, and
# removes everything it put anywhere.
#
# THE RECIPIENT. It arrives as a secret and is written to a mode-0600 file on
# the runner, copied into the same root-only directory as the bundle on the
# host, and named to the script by that file's PATH. It is never a command-line
# argument, never echoed, and both copies are removed on every path. The
# summary shows the recipient's domain only, as the script's result does.
#
# WHAT A PASS IS NOT. A pass means Postfix logged status=sent for the canary's
# queue ID: the receiving MX accepted it. SPF, DKIM and DMARC at the receiver
# are read by an operator from the raw headers of the message as received.
#
# CREDENTIAL. The privileged BOOTSTRAP credential, because the queue and the
# gateway are root's. Never the deploy credential, and no fallback between them.
# The DKIM private key is never supplied: it is already on the host.
#
# CALLER REQUIREMENT: a Bash 4.4+ runner. Remote argv is quoted with
# ${array[@]@Q}, as the other operational actions here quote theirs, so a caller
# runs this on `runs-on: ubuntu-24.04`.

inputs:
  deployment-target:
    required: true
    description: >-
      Deployment target ID from the RateGuru target registry. Its reviewed mail
      routing decides the sender; this action supplies none.

  canary-recipient:
    required: true
    description: >-
      The one public mailbox the canary is sent to, from a GitHub Environment
      secret. Carried as a root-only file, never as an argument.

  bootstrap-host:
    required: true
    description: SSH hostname or IP of the host the target lives on.

  bootstrap-port:
    required: false
    default: "22"
    description: SSH server port

  bootstrap-user:
    required: true
    description: >-
      Privileged bootstrap user. Must be root, or hold passwordless
      non-interactive sudo.

  bootstrap-ssh-key:
    required: true
    description: Privileged bootstrap SSH private key, separate from any deployment key

  bootstrap-known-hosts:
    required: true
    description: >-
      Verified known_hosts entry for the host. Strict host key checking is
      non-negotiable: no TOFU, no relaxed policy, no password fallback.

outputs:
  status:
    description: "pass or fail, from the canary's machine-readable result once it passed the result check"
    value: ${{ steps.canary.outputs.status }}
  result:
    description: "pass or fail (a checked result); invalid (a result that failed the result check); missing (no result at all)"
    value: ${{ steps.canary.outputs.result }}

runs:
  using: composite

  steps:
    # Before anything touches the host: a canary with no recipient is refused
    # here, so it never reaches the host's SMTP listener at all.
    - name: Validate fixed caller inputs
      shell: bash
      env:
        DEPLOYMENT_TARGET: ${{ inputs.deployment-target }}
        CANARY_RECIPIENT_PRESENT: ${{ inputs.canary-recipient != '' }}
        BOOTSTRAP_HOST: ${{ inputs.bootstrap-host }}
        BOOTSTRAP_PORT: ${{ inputs.bootstrap-port }}
        BOOTSTRAP_USER: ${{ inputs.bootstrap-user }}
        BOOTSTRAP_KEY_PRESENT: ${{ inputs.bootstrap-ssh-key != '' }}
        BOOTSTRAP_KNOWN_HOSTS_PRESENT: ${{ inputs.bootstrap-known-hosts != '' }}
      run: |
        set -Eeuo pipefail

        if [[ "${CANARY_RECIPIENT_PRESENT}" != "true" ]]; then
          echo "MAIL_CANARY_RECIPIENT is not configured in this environment." >&2
          echo "Add the one public mailbox the canary goes to as that GitHub Environment secret. Nothing was sent and nothing on the host was touched." >&2
          exit 1
        fi

        target_regex='^[a-z0-9]+(-[a-z0-9]+)*$'

        [[ "${DEPLOYMENT_TARGET}" =~ ${target_regex} ]] || {
          echo "Invalid deployment target: ${DEPLOYMENT_TARGET}" >&2
          exit 1
        }

        # 10# forces decimal: a leading-zero port read as octal would abort
        # (( )) and be mistaken for a passing condition by the || chain.
        if [[ ! "${BOOTSTRAP_PORT}" =~ ^[0-9]{1,5}$ ]] \
          || (( 10#${BOOTSTRAP_PORT} < 1 )) \
          || (( 10#${BOOTSTRAP_PORT} > 65535 ))
        then
          echo "Invalid bootstrap port (expected 1-65535): ${BOOTSTRAP_PORT}" >&2
          exit 1
        fi

        for required_var in BOOTSTRAP_HOST BOOTSTRAP_USER; do
          if [[ -z "${!required_var}" ]]; then
            echo "${required_var} is not configured for this environment" >&2
            exit 1
          fi
        done

        if [[ "${BOOTSTRAP_KEY_PRESENT}" != "true" ]] \
          || [[ "${BOOTSTRAP_KNOWN_HOSTS_PRESENT}" != "true" ]]
        then
          echo "This environment has no bootstrap SSH credential." >&2
          echo "The canary follows its own queue entry as root; it refuses to fall back to a deployment key, which is restricted to the deploy wrappers." >&2
          exit 1
        fi

    # The recipient file: mode 0600 from the moment it exists, written by a
    # shell builtin, and holding the address with nothing around it.
    - name: Stage the recipient file
      shell: bash
      env:
        CANARY_RECIPIENT: ${{ inputs.canary-recipient }}
      run: |
        set -Eeuo pipefail

        recipient_path="${RUNNER_TEMP}/rateguru_mail_canary_recipient"
        install -m 0600 /dev/null "${recipient_path}"

        recipient="${CANARY_RECIPIENT}"
        recipient="${recipient#"${recipient%%[![:space:]]*}"}"
        recipient="${recipient%"${recipient##*[![:space:]]}"}"
        printf '%s\n' "${recipient}" > "${recipient_path}"

        echo "RATEGURU_CANARY_RECIPIENT_PATH=${recipient_path}" >> "${GITHUB_ENV}"

    - name: Configure bootstrap SSH
      shell: bash
      env:
        BOOTSTRAP_SSH_KEY: ${{ inputs.bootstrap-ssh-key }}
        BOOTSTRAP_KNOWN_HOSTS: ${{ inputs.bootstrap-known-hosts }}
      run: |
        set -Eeuo pipefail

        key_path="${RUNNER_TEMP}/rateguru_mail_canary_key"
        known_hosts_path="${RUNNER_TEMP}/rateguru_mail_canary_known_hosts"

        install -m 0600 /dev/null "${key_path}"
        install -m 0600 /dev/null "${known_hosts_path}"

        printf '%s\n' "${BOOTSTRAP_SSH_KEY}" > "${key_path}"
        printf '%s\n' "${BOOTSTRAP_KNOWN_HOSTS}" > "${known_hosts_path}"

        ssh-keygen -y -f "${key_path}" >/dev/null

        {
          echo "RATEGURU_BOOTSTRAP_SSH_KEY_PATH=${key_path}"
          echo "RATEGURU_BOOTSTRAP_KNOWN_HOSTS_PATH=${known_hosts_path}"
        } >> "${GITHUB_ENV}"

    - name: Verify privileged access on the host
      shell: bash
      env:
        BOOTSTRAP_HOST: ${{ inputs.bootstrap-host }}
        BOOTSTRAP_PORT: ${{ inputs.bootstrap-port }}
        BOOTSTRAP_USER: ${{ inputs.bootstrap-user }}
      run: |
        set -Eeuo pipefail

        ssh_bootstrap() {
          ssh \
            -p "${BOOTSTRAP_PORT}" \
            -i "${RATEGURU_BOOTSTRAP_SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${RATEGURU_BOOTSTRAP_KNOWN_HOSTS_PATH}" \
            "${BOOTSTRAP_USER}@${BOOTSTRAP_HOST}" \
            "$@"
        }

        remote_uid="$(ssh_bootstrap 'id -u')"

        if [[ "${remote_uid}" == "0" ]]; then
          privileged_prefix=""
        elif ssh_bootstrap 'sudo -n true' >/dev/null 2>&1; then
          privileged_prefix="sudo -n"
        else
          echo "Bootstrap user ${BOOTSTRAP_USER} is neither root nor a passwordless sudoer." >&2
          echo "The canary needs root; nothing was uploaded and nothing was sent." >&2
          exit 1
        fi

        echo "RATEGURU_PRIVILEGED_PREFIX=${privileged_prefix}" >> "${GITHUB_ENV}"

    # Only infrastructure/ — the canary and the activation verify it composes
    # resolve every owner beneath that one directory. No application code.
    - name: Package trusted infrastructure bundle
      shell: bash
      run: |
        set -Eeuo pipefail

        bundle_path="${RUNNER_TEMP}/rateguru-mail-canary-bundle.tar.gz"

        test -x "${GITHUB_WORKSPACE}/infrastructure/scripts/send-mail-canary"
        test -x "${GITHUB_WORKSPACE}/infrastructure/scripts/activate-mail-outbound"
        test -f "${GITHUB_WORKSPACE}/infrastructure/scripts/smtp-submission"

        tar --create --gzip --file "${bundle_path}" \
          --directory "${GITHUB_WORKSPACE}" infrastructure

        chmod 0600 "${bundle_path}"

        echo "RATEGURU_BUNDLE_PATH=${bundle_path}" >> "${GITHUB_ENV}"

    - name: Upload the trusted bundle and the recipient file
      shell: bash
      env:
        BOOTSTRAP_HOST: ${{ inputs.bootstrap-host }}
        BOOTSTRAP_PORT: ${{ inputs.bootstrap-port }}
        BOOTSTRAP_USER: ${{ inputs.bootstrap-user }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -Eeuo pipefail

        run_tag="${RUN_ID}-${RUN_ATTEMPT}"
        staging_dir=".rateguru-mail-canary-${run_tag}"
        remote_root="/root/rateguru-mail-canary-${run_tag}"

        {
          echo "RATEGURU_REMOTE_STAGING_DIR=${staging_dir}"
          echo "RATEGURU_REMOTE_ROOT=${remote_root}"
        } >> "${GITHUB_ENV}"

        ssh_bootstrap() {
          ssh \
            -p "${BOOTSTRAP_PORT}" \
            -i "${RATEGURU_BOOTSTRAP_SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${RATEGURU_BOOTSTRAP_KNOWN_HOSTS_PATH}" \
            "${BOOTSTRAP_USER}@${BOOTSTRAP_HOST}" \
            "$@"
        }

        printf -v prepare_staging 'umask 077 && rm -rf %q && mkdir -p %q' \
          "${staging_dir}" "${staging_dir}"

        ssh_bootstrap "${prepare_staging}"

        scp \
          -P "${BOOTSTRAP_PORT}" \
          -i "${RATEGURU_BOOTSTRAP_SSH_KEY_PATH}" \
          -o BatchMode=yes \
          -o IdentitiesOnly=yes \
          -o ConnectTimeout=15 \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=10 \
          -o StrictHostKeyChecking=yes \
          -o UserKnownHostsFile="${RATEGURU_BOOTSTRAP_KNOWN_HOSTS_PATH}" \
          "${RATEGURU_BUNDLE_PATH}" \
          "${RATEGURU_CANARY_RECIPIENT_PATH}" \
          "${BOOTSTRAP_USER}@${BOOTSTRAP_HOST}:${staging_dir}/"

        # Both land in the bootstrap user's own 0700 staging directory, are
        # moved into a root-only directory — the recipient as a root-owned
        # 0600 file — and the staging directory is removed at once.
        printf -v install_remote \
          'set -Eeuo pipefail; umask 077; %s install -d -m 0700 -o root -g root %q && %s tar -xzpf %q/%q -C %q && %s chown -R root:root %q && %s install -m 0600 -o root -g root %q/%q %q/canary-recipient && rm -rf %q' \
          "${RATEGURU_PRIVILEGED_PREFIX:-}" "${remote_root}" \
          "${RATEGURU_PRIVILEGED_PREFIX:-}" "${staging_dir}" "$(basename "${RATEGURU_BUNDLE_PATH}")" "${remote_root}" \
          "${RATEGURU_PRIVILEGED_PREFIX:-}" "${remote_root}" \
          "${RATEGURU_PRIVILEGED_PREFIX:-}" "${staging_dir}" "$(basename "${RATEGURU_CANARY_RECIPIENT_PATH}")" "${remote_root}" \
          "${staging_dir}"

        ssh_bootstrap "bash -c ${install_remote@Q}"

    - name: Send the canary
      id: canary
      shell: bash
      env:
        BOOTSTRAP_HOST: ${{ inputs.bootstrap-host }}
        BOOTSTRAP_PORT: ${{ inputs.bootstrap-port }}
        BOOTSTRAP_USER: ${{ inputs.bootstrap-user }}
        DEPLOYMENT_TARGET: ${{ inputs.deployment-target }}
      run: |
        set -Eeuo pipefail

        remote_command=(
          ${RATEGURU_PRIVILEGED_PREFIX:-}
          "${RATEGURU_REMOTE_ROOT}/infrastructure/scripts/send-mail-canary"
          --send
          --target "${DEPLOYMENT_TARGET}"
          --recipient-file "${RATEGURU_REMOTE_ROOT}/canary-recipient"
        )

        # The status is captured explicitly rather than allowed to abort the
        # step: under `set -e` a failing command substitution ends the step
        # before the captured output is printed, and the server-side report is
        # the whole diagnosis.
        set +e
        canary_output="$(
          ssh \
            -p "${BOOTSTRAP_PORT}" \
            -i "${RATEGURU_BOOTSTRAP_SSH_KEY_PATH}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${RATEGURU_BOOTSTRAP_KNOWN_HOSTS_PATH}" \
            "${BOOTSTRAP_USER}@${BOOTSTRAP_HOST}" \
            "${remote_command[@]@Q}" 2>&1
        )"
        canary_status=$?
        set -e

        printf '%s\n' "${canary_output}"

        count="$(grep -c '^RATEGURU_MAIL_CANARY_RESULT=' <<<"${canary_output}" || true)"

        if [[ "${count}" != "1" ]]; then
          echo "result=missing" >> "${GITHUB_OUTPUT}"
          echo "Expected exactly one RATEGURU_MAIL_CANARY_RESULT line, got ${count}; the canary exited ${canary_status}." >&2
          exit 1
        fi

        json="$(grep '^RATEGURU_MAIL_CANARY_RESULT=' <<<"${canary_output}")"
        json="${json#RATEGURU_MAIL_CANARY_RESULT=}"

        # Judged before any of it is shown: exactly the canary's own fields,
        # this target, a send, a closed verdict and delivery status, a
        # recipient DOMAIN and never an address, the canary ID in the form
        # send-mail-canary makes it (rgcanary-YYYYMMDDTHHMMSSZ-12hex) and its
        # Message-ID made from that same ID — and a pass only for a canary
        # whose own queue ID was logged status=sent.
        result_check='
          def matches($re): type == "string" and test($re);
          def nullable($re): . == null or matches($re);
          . as $result
          | type == "object"
          and (keys == ["canary_id", "deleted", "dsn", "message_id", "mode", "queue_id", "recipient_domain", "smtp_delivery", "status", "target"])
          and .target == $target
          and .mode == "send"
          and (.status == "pass" or .status == "fail")
          and (.recipient_domain | nullable("^[a-z0-9.-]+$"))
          and (.queue_id | nullable("^[0-9A-Za-z]+$"))
          and (.canary_id | nullable("^rgcanary-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{12}$"))
          and (.message_id == null
               or ($result.canary_id != null
                   and (.message_id | matches("^<" + $result.canary_id + "@[a-z0-9]([a-z0-9-]*[a-z0-9])?([.][a-z0-9]([a-z0-9-]*[a-z0-9])?)+>$"))))
          and (.smtp_delivery == null or (.smtp_delivery | IN("sent", "bounced", "expired", "deferred", "not_submitted", "unknown")))
          and (.dsn | nullable("^[0-9][.][0-9]{1,3}[.][0-9]{1,3}$"))
          and (.deleted | type) == "boolean"
          and (tostring | test("@[^>]*\"") | not)
          and (.status == "fail"
               or (.smtp_delivery == "sent" and .queue_id != null and .canary_id != null and .message_id != null))
        '

        # A result that fails the check is reported as exactly that — never
        # as a delivery that failed, and never as no result at all — and
        # nothing in it is shown.
        if ! jq -e --arg target "${DEPLOYMENT_TARGET}" "${result_check}" <<<"${json}" >/dev/null 2>&1; then
          echo "result=invalid" >> "${GITHUB_OUTPUT}"
          {
            echo "## ${DEPLOYMENT_TARGET} production mail canary"
            echo
            echo "**The canary's result was not accepted.** It printed one machine-readable result, but that result failed the result check, so nothing in it is reported here and this run cannot pass."
            echo
            echo "This is a failed result check, not a failed delivery: whether the receiving server accepted the message is in the canary's own report in the job log. Read it before sending another canary — a message that was delivered would be delivered again."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "The machine-readable result is not a canary result for ${DEPLOYMENT_TARGET}: it failed the result check, so it is not reported. The canary exited ${canary_status}; its own report is above." >&2
          exit 1
        fi

        status="$(jq -r '.status' <<<"${json}")"
        echo "result=${status}" >> "${GITHUB_OUTPUT}"
        echo "status=${status}" >> "${GITHUB_OUTPUT}"

        {
          jq -r '
            def yesno: if . then "yes" else "**no**" end;
            "## \(.target) production mail canary",
            "",
            "| Check | Result |",
            "| --- | --- |",
            "| Canary | \(.canary_id // "**none**") |",
            "| Message-ID | \(.message_id // "**none**") |",
            "| Recipient domain | \(.recipient_domain // "**unknown**") |",
            "| Queue entry followed | \(.queue_id // "**none**") |",
            "| Remote MX accepted it (status=sent) | \(.smtp_delivery == "sent" | yesno) |",
            "| Delivery status | \(.smtp_delivery // "**none**")\(if .dsn then " (dsn \(.dsn))" else "" end) |",
            "| Own queue entry deleted | \(if .deleted then "yes" else "no" end) |",
            "| **Overall** | **\(.status | ascii_upcase)** |",
            "",
            "**status=sent is not SPF, DKIM or DMARC acceptance.** It means the receiving MX accepted the message, and nothing more. Open the received message and inspect its raw headers against the acceptance criteria in infrastructure/runbooks/mail-outbound-activation.md.",
            "",
            "The complete report is in the job log."
          ' <<<"${json}"
        } >> "${GITHUB_STEP_SUMMARY}"

        if [[ "${status}" != "pass" ]] || (( canary_status != 0 )); then
          echo "The canary for ${DEPLOYMENT_TARGET} did not pass (exit ${canary_status}). The complete report is above." >&2
          exit 1
        fi

    # Runs on failure too. Neither the uploaded tooling nor the recipient file
    # may outlive the run.
    - name: Remove the remote bundle and recipient file
      if: ${{ always() }}
      shell: bash
      env:
        BOOTSTRAP_HOST: ${{ inputs.bootstrap-host }}
        BOOTSTRAP_PORT: ${{ inputs.bootstrap-port }}
        BOOTSTRAP_USER: ${{ inputs.bootstrap-user }}
      run: |
        set -Eeuo pipefail

        if [[ -z "${RATEGURU_REMOTE_ROOT:-}" ]]; then
          echo "Nothing was uploaded; no remote cleanup required."
          exit 0
        fi

        printf -v cleanup_command '%s rm -rf %q && rm -rf %q' \
          "${RATEGURU_PRIVILEGED_PREFIX:-}" "${RATEGURU_REMOTE_ROOT}" "${RATEGURU_REMOTE_STAGING_DIR:-/nonexistent}"

        if ssh \
          -p "${BOOTSTRAP_PORT}" \
          -i "${RATEGURU_BOOTSTRAP_SSH_KEY_PATH}" \
          -o BatchMode=yes \
          -o IdentitiesOnly=yes \
          -o ConnectTimeout=15 \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=10 \
          -o StrictHostKeyChecking=yes \
          -o UserKnownHostsFile="${RATEGURU_BOOTSTRAP_KNOWN_HOSTS_PATH}" \
          "${BOOTSTRAP_USER}@${BOOTSTRAP_HOST}" \
          "bash -c ${cleanup_command@Q}"
        then
          echo "Removed ${RATEGURU_REMOTE_ROOT} (the bundle and the recipient file) and the upload staging directory."
        else
          echo "WARNING: could not remove ${RATEGURU_REMOTE_ROOT} from the host. Remove it manually: it holds the canary recipient." >&2
        fi

    - name: Remove temporary local files
      if: ${{ always() }}
      shell: bash
      run: |
        rm -f \
          "${RATEGURU_BUNDLE_PATH:-}" \
          "${RATEGURU_CANARY_RECIPIENT_PATH:-}" \
          "${RATEGURU_BOOTSTRAP_SSH_KEY_PATH:-}" \
          "${RATEGURU_BOOTSTRAP_KNOWN_HOSTS_PATH:-}"
