# RateGuru's settings for the host's PostgreSQL 18 cluster (18/main).
# Installed by install-bootstrap-services as conf.d/70-rateguru.conf, which the
# cluster's postgresql.conf includes (include_dir = 'conf.d'); validated with
# `postgres -C` before PostgreSQL reloads, and PostgreSQL restarts when a
# setting only a restart applies has changed (shared_buffers).
#
# Sized for the machine the targets share: 4 vCPU and 5.8 GiB of RAM, with
# nginx, PHP-FPM, Redis, the queue workers and the mail stack beside
# PostgreSQL. Memory is therefore a sixth for the cache PostgreSQL keeps
# itself and about half for what the planner may count on the operating
# system caching, rather than a dedicated server's quarter and three
# quarters. Every other setting keeps PostgreSQL's default.

# PostgreSQL's own page cache (the default is 128MB).
shared_buffers = 1GB

# What the planner assumes the operating system caches besides — a hint
# only, nothing is allocated.
effective_cache_size = 3GB

# Memory one sort or hash of one query may use before it spills to disk (the
# default is 4MB). Analytics counts people by sorting, and at 4MB every such
# sort went to disk. A request runs a few of these at most, and the
# application holds a few dozen connections at most.
work_mem = 32MB

# Index builds and vacuum (the default is 64MB).
maintenance_work_mem = 256MB

# Parallel query: two helpers a query, at most one per core in all.
max_parallel_workers_per_gather = 2
max_parallel_workers = 4

# The disks are SSDs: a random read costs little more than a sequential one
# (the default, 4, assumes spinning disks).
random_page_cost = 1.1
