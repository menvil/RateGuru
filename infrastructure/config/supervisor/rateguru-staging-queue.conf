; RateGuru staging — queue workers: the default queue's, and the media
; queue's long jobs (video transcoding) on the redis-media connection, whose
; retry window outlasts them. One group, so every operation addresses both
; as rateguru-staging-queue:*.

[program:rateguru-staging-queue-default]
process_name=%(program_name)s_%(process_num)02d

directory=/home/www/rateguru/staging/current

command=/usr/bin/php8.5 artisan queue:work redis --queue=rateguru-staging --sleep=3 --tries=3 --timeout=120 --max-time=3600 --max-jobs=1000

user=rateguru-staging
numprocs=1

autostart=true
autorestart=true
startsecs=3
startretries=5

stopasgroup=true
killasgroup=true
stopwaitsecs=130

redirect_stderr=true
stdout_logfile=/home/www/rateguru/staging/shared/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

environment=APP_ENV="staging"

; At a lower CPU priority, so a transcode never crowds out the site. A stop
; (restore, recovery) kills a transcode after 60 s rather than waiting out its
; 900 s; the job is retried once the connection's retry window passes.
; Deployments signal queue:restart instead, which lets the running job finish.
[program:rateguru-staging-queue-media]
process_name=%(program_name)s_%(process_num)02d

directory=/home/www/rateguru/staging/current

command=/usr/bin/nice -n 10 /usr/bin/php8.5 artisan queue:work redis-media --queue=rateguru-staging-media --sleep=3 --tries=2 --timeout=900 --max-time=3600 --max-jobs=50 --memory=512

user=rateguru-staging
numprocs=1

autostart=true
autorestart=true
startsecs=3
startretries=5

stopasgroup=true
killasgroup=true
stopwaitsecs=60

redirect_stderr=true
stdout_logfile=/home/www/rateguru/staging/shared/storage/logs/media-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

environment=APP_ENV="staging"

[group:rateguru-staging-queue]
programs=rateguru-staging-queue-default,rateguru-staging-queue-media
