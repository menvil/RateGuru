[program:rateguru-staging-nightwatch]
process_name=%(program_name)s_%(process_num)02d

directory=/home/www/rateguru/staging/current

command=/usr/bin/php8.5 artisan nightwatch:agent

user=rateguru-staging
numprocs=1

autostart=true
autorestart=true
startsecs=3
startretries=5

stopasgroup=true
killasgroup=true
stopwaitsecs=20

redirect_stderr=true
stdout_logfile=/home/www/rateguru/staging/shared/storage/logs/nightwatch-agent.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

environment=APP_ENV="staging"
